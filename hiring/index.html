<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forka Hiring</title>
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="../config.js"></script>
<style>
:root{--ink:#23211F;--ink2:#4a4642;--mute:#8a847c;--line:#e4ded4;--bg:#F5F2EC;--card:#fffdf9;--bronze:#A57C52;--bronze2:#8a6440;--soft:#efe7dc;--ok:#3f7a52;--okbg:#e6f0e8;--warn:#a8741a;--warnbg:#f8eedb;--bad:#a5432f;--badbg:#f6e3de;--blue:#3c5d84;--bluebg:#e5ecf4}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter Tight",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:600;margin:0;letter-spacing:.1px}
h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bronze);outline-offset:-1px;border-color:var(--bronze)}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
label .hint{font-weight:400;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;margin:0;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:600;font-size:13px;line-height:1;white-space:nowrap;vertical-align:middle}
.btn:hover{background:#000}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}.btn.sec:hover{border-color:var(--ink)}
.btn.br{background:var(--bronze);border-color:var(--bronze)}.btn.br:hover{background:var(--bronze2)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border-color:#e7c3ba}
.btn{text-decoration:none}.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.ai{background:#fff;color:var(--bronze2);border-color:#dcc5a9}
header{background:var(--ink);color:#fff;padding:0 22px;display:flex;align-items:center;gap:18px;height:58px;position:sticky;top:0;z-index:20}
.logo{font-family:"EB Garamond",serif;font-size:22px;letter-spacing:.5px}.logo b{color:#d7b48a;font-weight:600}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav a{color:#cfc8bf;text-decoration:none;padding:7px 12px;border-radius:7px;font-weight:500;cursor:pointer;white-space:nowrap;font-size:13px}
nav a.on,nav a:hover{background:#3a3633;color:#fff}
nav a .n{background:var(--bronze);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-inline-start:5px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfc8bf}
.who select{width:auto;background:#3a3633;color:#fff;border:0;padding:6px 8px}
.role{background:var(--bronze);color:#fff;border-radius:20px;padding:3px 10px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
main{max-width:1240px;margin:0 auto;padding:24px 22px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
/* Phone: the top bar becomes three tidy rows - name + language, who you are + Forka Apps, then the menu (swipe sideways) */
@media(max-width:720px){
  header{height:auto;flex-wrap:wrap;padding:10px 14px;gap:8px 10px}
  .logo{order:1;white-space:nowrap;font-size:21px}
  #langSw{order:2;margin-inline-start:auto}
  .who{order:3;flex-basis:100%;flex-wrap:nowrap;min-width:0}
  .who .role{white-space:nowrap;flex:none}
  .who select{flex:1;min-width:0;height:32px;padding:4px 8px;font-size:12px}
  .who .btn{flex:none;margin:0!important}
  nav{order:4;flex-basis:100%;margin:0 -14px;padding:0 10px 2px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
}
.kpi .v{font-size:28px;font-weight:700;font-family:"EB Garamond",serif}.kpi .l{color:var(--mute);font-size:12px;font-weight:500}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.blue{background:var(--bluebg);color:var(--blue)}.tag.br{background:#f3e6d6;color:var(--bronze2)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#faf6ef}
.muted{color:var(--mute)}.small{font-size:12px}.right{text-align:end}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#ebe5db;border-radius:10px;padding:8px;min-height:120px}
.col h4{margin:2px 4px 8px;font-size:12px;display:flex;justify-content:space-between;color:var(--ink2)}
.cc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:7px;cursor:pointer}
.cc:hover{border-color:var(--bronze)}.cc b{display:block;font-size:13px}.cc .small{margin-top:3px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bronze)}
.funnel .r{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(35,33,31,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#modal.on{display:flex}
.dlg{background:var(--bg);border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg .hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px 14px 0 0}
.dlg .bd{padding:18px 20px}.dlg .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--card);border-radius:0 0 14px 14px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute);margin-inline-start:auto}
.steps{display:flex;gap:3px;margin:12px 0 4px;flex-wrap:wrap}
.steps span{flex:1;min-width:62px;font-size:10px;text-align:center;padding:5px 2px;border-radius:5px;background:var(--soft);color:var(--mute);font-weight:600}
.steps span.done{background:#e4d3bd;color:var(--bronze2)}.steps span.cur{background:var(--ink);color:#fff}
.score{display:flex;gap:4px}.score button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.score button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.crit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
div.sec{margin-top:14px}div.sec>h3{margin-bottom:6px}
.crit .ivn{grid-column:1/-1;margin-top:-2px;padding:6px 9px;font-size:12px}
.crit .pr{display:block;font-size:12px;color:var(--mute);font-style:italic}
.cmp{overflow-x:auto;margin-top:6px}.cmp table{min-width:520px;font-size:13px}.cmp th,.cmp td{text-align:start;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
.cmp th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--soft)}.cmp td.q{width:34%}.cmp .sc{display:inline-block;min-width:24px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;background:var(--soft)}
.cmp .sc.hi{background:var(--okbg);color:var(--ok)}.cmp .sc.lo{background:var(--badbg);color:var(--bad)}.cmp .nt{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.cmp tr.gap td{background:#fff7e8}.cmp tr.sec td{background:none;font-weight:700;font-size:12px;letter-spacing:.3px;color:var(--bronze2);padding-top:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}.slots .day{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.slots .day b{display:block;font-size:12px;margin-bottom:6px}.slots .day div{display:flex;flex-wrap:wrap;gap:4px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 6px;font:inherit;font-size:12px;cursor:pointer}.slots button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flag{display:inline-block;margin:2px 6px 2px 0;font-size:12px}
.note{background:var(--warnbg);color:#6d4d12;border-radius:8px;padding:9px 12px;font-size:12px}
.note.info{background:var(--bluebg);color:var(--blue)}.note.ok{background:var(--okbg);color:var(--ok)}
.hist{font-size:12px;color:var(--mute);border-inline-start:2px solid var(--line);padding-inline-start:10px;margin-top:6px}
.hist div{margin:3px 0}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px}.chk input{width:auto}
.hero{background:var(--ink);color:#fff;border-radius:14px;padding:28px;margin-bottom:18px}
.hero h1{font-size:34px}.hero p{color:#d8d1c7;max-width:640px}
.vals{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.vals span{border:1px solid #6b635b;border-radius:20px;padding:4px 12px;font-size:12px;color:#eadfce}
.job{display:flex;gap:14px;align-items:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;z-index:80;font-weight:500;display:none}
.track{display:flex;gap:0;margin:12px 0}.track div{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative;padding-top:18px}
.track div:before{content:"";position:absolute;top:5px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.track div.done:before{background:var(--bronze)}.track div.cur{color:var(--ink);font-weight:700}.track div.cur:before{background:var(--ink);box-shadow:0 0 0 4px #e4d3bd}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:inherit;font-size:13px;max-height:340px;overflow:auto}
.banner{background:#3a3633;color:#e9e1d6;font-size:12px;padding:6px 22px}

#langSw{display:flex;border:1px solid #4a4541;border-radius:8px;overflow:hidden;flex:none}
#langSw button{background:none;border:0;color:#cfc8bf;font:inherit;font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer}
#langSw button.on{background:var(--bronze);color:#fff}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter Tight",system-ui,sans-serif}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .logo{font-family:"IBM Plex Sans Arabic","EB Garamond",serif}
[dir=rtl] th,[dir=rtl] .role,[dir=rtl] .steps span{letter-spacing:0;text-transform:none}
[dir=rtl] nav a{padding:7px 9px}
[dir=rtl] pre.out,[dir=rtl] .crit>*:first-child,[dir=rtl] .cc,[dir=rtl] td{unicode-bidi:plaintext}
[dir=rtl] input[type=email],[dir=rtl] input[type=tel],[dir=rtl] input[type=url]{direction:ltr;text-align:right}
</style>
</head>

async function reqAct(id,a){
  const r=JSON.parse(JSON.stringify(S.reqs[id])); const log=m=>r.history.push({t:now(),by:V.me,m});
  if(a==="approve"){ const d=new Date(), n=Object.values(S.reqs).filter(x=>x.reqId&&x.reqId.startsWith("REQ-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0"))).length+1;
    r.reqId="REQ-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+"-"+String(n).padStart(2,"0"); r.status="approved"; log("CEO approved vacancy — "+r.reqId); }
  if(a==="decline"){ const why=await ask("Why is this vacancy declined?"); if(!why)return; r.status="declined"; log("CEO declined: "+why) }
  if(a==="headok"){ r.status="ready"; log("Department head approved the scorecard") }
  if(a==="changes"){ const why=await ask("What should HR change?"); if(!why)return; r.status="approved"; log("Head asked for changes: "+why) }
  if(a==="post"){ r.status="open"; r.postedAt=now(); log("Job posted");
    await store.put("jobs",id,{id,title:r.title,dept:r.dept,branch:r.branch,summary:r.purpose,jd:r.jd||"",knockout:r.knockout||[],open:true,postedAt:r.postedAt}); }
  if(a==="close"){ r.status=Object.values(allCands()).filter(c=>c.req===id&&c.stage==="hired").length>=r.headcount?"filled":"closed"; log("Role closed"); if(S.jobs[id]) await store.put("jobs",id,{...S.jobs[id],open:false}); }
  await store.put("reqs",id,r); toast("Saved"); openReq(id);
}

function ivCompare(d,r){

  const secs=[["tech","Technical",(r.testQs||[])],["comp","Competency",COMPETENCY],["prac","Practical",PR(r)],["hr","HR questions",[...HR_Q.map(x=>x[0]),...fq.map(q=>"Follow-up: "+q)]]];
  const cell=(s,k,i)=>{ const v=k==="prac"?PV(s)[i]:(s[k]||[])[i], n=(s.n||{})[k+"."+i]; if(v==null&&!n) return `<td class="muted small">not asked</td>`;
    return `<td><span class="sc ${v>=4?"hi":v!=null&&v<=2?"lo":""}">${v??"–"}</span>${n?`<span class="nt">${esc(n)}</span>`:""}</td>` };
  let rows="";
  secs.forEach(([k,t,L])=>{ const used=L.map((x,i)=>i).filter(i=>P.some(([,s])=>(k==="prac"?PV(s)[i]:(s[k]||[])[i])!=null)); if(!used.length) return;
    rows+=`<tr class="sec"><td colspan="${P.length+1}">${t}</td></tr>`;
    used.forEach(i=>{ const vs=P.map(([,s])=>k==="prac"?PV(s)[i]:(s[k]||[])[i]).filter(v=>typeof v==="number"); const gap=vs.length>1&&Math.max(...vs)-Math.min(...vs)>=2;
      rows+=`<tr class="${gap?"gap":""}"><td class="q">${esc(L[i])}${gap?` <span class="tag warn">differ</span>`:""}</td>${P.map(([,s])=>cell(s,k,i)).join("")}</tr>` }) });
  const foot=(lab,f)=>`<tr><td class="q"><b>${lab}</b></td>${P.map(([,s])=>`<td>${f(s)}</td>`).join("")}</tr>`;
  rows+=`<tr class="sec"><td colspan="${P.length+1}">Summary</td></tr>`+foot("Average",s=>`<span class="sc ${ivScore(s)>=PASS?"hi":"lo"}">${f1(ivScore(s))}</span>`)+foot("Recommendation",s=>`<b>${esc(s.rec||"—")}</b>`)
    +foot("Strengths",s=>`<span class="nt">${esc(s.strengths||"—")}</span>`)+foot("Concerns",s=>`<span class="nt">${esc(s.concerns||s.notes||"—")}</span>`)+foot("Personality follow-up",s=>esc(s.pf||"—"));
  const recs=P.map(([,s])=>s.rec).filter(Boolean), split=recs.some(x=>/hire/i.test(x)&&!/No/.test(x))&&recs.some(x=>/No hire/.test(x));
  return `${split?`<div class="note" style="margin-top:8px">The interviewers disagree on hiring — talk it through before moving on.</div>`:""}<div class="cmp"><table><tr><th>Question</th>${P.map(([k,s])=>`<th>${esc(nm(k))}<br><span class="tag ${whoOf(k,s)==="head"?"blue":"br"}">${whoOf(k,s)==="head"?"Dept head":"HR"}</span> <span class="muted">${fmtD(s.at)}</span></th>`).join("")}</tr>${rows}</table></div>`;
}

async function bulk(kind){ const C=allCands(); let why="";
  if(kind==="reject"){ why=await ask("Reason for all selected (criterion failed)",["Screening score below pass mark","Missing must-have experience","Salary above range","Position filled"]); if(!why)return }
  if(kind==="pool"){ why=await ask("Talent pool note"); if(!why)return }
  for(const id of V.sel){ const d=JSON.parse(JSON.stringify(C[id])); if(!d||["hired"].includes(d.stage))continue;

    else { d.reject={reason:why,at:now(),by:V.me}; if(kind==="pool")d.poolNote=why; d.stage=kind==="pool"?"pool":"rejected"; d.stageAt=now(); await persist(d,(kind==="pool"?"Talent pool — ":"Rejected — ")+why) } }

async function uploadCV(file){
  if(file.size>20*1024*1024){ toast("That file is over 20 MB"); return null }
  const ok=/pdf|image\//.test(file.type)||/\.pdf$/i.test(file.name); if(!ok){ toast("Please upload a PDF or a photo (save Word files as PDF)"); return null }
  if(DEMO){ if(file.size>1.5*1024*1024) return {name:file.name,size:file.size,type:file.type,demoTooBig:true};
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)}); return {name:file.name,size:file.size,type:file.type,data} }
  if(HURL){ if(file.size>5*1024*1024){ toast("CV files up to 5 MB"); return null }
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(file)});
    const r=await api("upload",{file:{name:file.name,type:file.type||"application/pdf",data}}); if(r.ok) return r.file; toast("Upload failed — try again or paste the text"); return null }
  if(!ASSETS){ toast("File upload isn't available for your access level — paste your CV text instead"); return null }
  try{ const up=await ASSETS.upload(file); return {id:up.id,url:up.url,name:file.name,size:up.sizeBytes,type:up.contentType} }
  catch(e){ toast("Upload failed — try again or paste the text"); return null }
}
async function openCV(id){ const w=window.open("","_blank"); if(w)w.document.write("<p style='font-family:sans-serif'>Opening CV…</p>");
  const r=await api("cv",{id}); if(!r.ok){ if(w)w.close(); toast("Couldn't open the CV."); return }
  const bin=atob(r.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:r.type||"application/pdf"})); if(w)w.location=url; else location.href=url }
function cvLink(f){ if(!f) return "";
  if(f.drive) return `<button class="btn sm sec" onclick="openCV('${esc(f.id)}')">Open CV · ${esc(f.name)} ${f.size?Math.round(f.size/1024)+" KB":""}</button>`; const href=f.data||f.url||(f.id?"/_blob/"+f.id:""); const kb=f.size?Math.round(f.size/1024)+" KB":"";
  return href?`<a class="btn sm sec" href="${esc(href)}" target="_blank" rel="noopener">Open CV · ${esc(f.name)} ${kb}</a>`:`<span class="small muted">${esc(f.name)} (demo: file too big to keep)</span>` }
