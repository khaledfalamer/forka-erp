name: Test and deploy erp.forka.com
# Every change is checked first. If any check fails, the site is NOT updated
# and erp.forka.com stays on the last version that passed.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install browser for tests
        run: |
          pip install playwright==1.48.0
          python -m playwright install chromium
          # extra system packages (fonts): optional, so an Ubuntu mirror outage cannot block publishing
          timeout 180 python -m playwright install-deps chromium || echo "System packages unavailable right now; using what the runner already has"
      - name: Server checks (accounts, sign-in, clearance)
        run: node tests/server_test.js
      - name: Page checks (preview mode, desktop, phone, Arabic)
        run: python tests/ci_test.py
      - name: Live sign-in checks
        run: python tests/live_test.py
      - name: Hiring server checks
        run: node tests/hiring_server_test.js
      - name: Hiring and careers page checks
        run: python tests/hiring_test.py
      - name: Boards (preview) page checks
        run: python tests/boards_test.py
      - name: Boards server checks (who sees and changes what)
        run: node tests/boards_server_test.js
      - name: Boards signed-in checks (several people, real server code)
        run: python tests/boards_live_test.py
      - name: No secrets in the site
        run: |
          ! grep -RInE "GOCSPX-|AIza[0-9A-Za-z_-]{30}|\"pin\"[[:space:]]*:[[:space:]]*\"[0-9]{4,}\"" index.html config.js hiring apply boards server
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (only the public files)
        run: |
          mkdir _site && cp index.html config.js privacy.html about.html CNAME _site/ && cp -r hiring apply boards suite _site/
          test -f _site/suite/suite.js && test -f _site/suite/suite.css   # the shared header (Forka suite) must be published
          # new address for the shared suite files on every publish, so browsers never use an old copy
          sed -i -E "s#(suite/suite\.(css|js))\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html _site/hiring/index.html _site/boards/index.html
          # new address for the settings file on every publish, so browsers never use an old copy
          sed -i "s#<script src=\"config.js\"></script>#<script src=\"config.js?v=${GITHUB_SHA::7}\"></script>#" _site/index.html
          grep -q "config.js?v=" _site/index.html
          sed -i "s#<script src=\"../config.js\"></script>#<script src=\"../config.js?v=${GITHUB_SHA::7}\"></script>#" _site/hiring/index.html _site/apply/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
