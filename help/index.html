<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Forka App - How to use</title>
<link rel="icon" href="../logos/forka-app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2B2B;--mute:#6f6a62;--paper:#f6f3ee;--card:#fff;--line:#e7e1d7;--bronze:#896B45;
  --app:#896B45;--proc:#BD5038;--hire:#C8891F;--board:#397F8F;--green:#77987D}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.65 'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic','Inter Tight',sans-serif}
a{color:inherit}
/* header */
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px}
.top .logo{display:flex;align-items:center;text-decoration:none}
.top .logo img{height:34px;width:auto;display:block}
.top .sep{width:1px;height:26px;background:var(--line)}
.top .tt{font:600 19px 'EB Garamond',serif;color:var(--ink);white-space:nowrap}
[dir=rtl] .top .tt{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:16px}
.top .sp{flex:1}
.seg{display:inline-flex;background:#f1ede6;border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:600 13px 'Inter Tight',sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--mute)}
.seg button[data-l=ar]{font-family:'IBM Plex Sans Arabic',sans-serif}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap}
.btn:hover{background:#000}
.btn svg{width:16px;height:16px}
[dir=rtl] .btn svg{transform:scaleX(-1)}
/* hero */
.hero{max-width:1180px;margin:0 auto;padding:34px 22px 10px;display:flex;gap:26px;align-items:center}
.mark{width:74px;height:74px;flex:none;border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(43,43,43,.08);display:grid;place-items:center}
.mark img{width:46px;height:46px}
.hero h1{font:600 40px/1.1 'EB Garamond',serif;margin:0 0 6px}
[dir=rtl] .hero h1{font:700 32px/1.3 'IBM Plex Sans Arabic',sans-serif}
.hero p{margin:0;color:var(--mute);font-size:16.5px}
.who{max-width:1180px;margin:0 auto;padding:16px 22px 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who>span{font-weight:600;color:var(--mute);font-size:14px;margin-inline-end:4px}
.who button{border:1px solid var(--line);background:#fff;color:var(--ink);font:500 14px inherit;font-family:inherit;padding:8px 15px;border-radius:999px;cursor:pointer;transition:all .15s}
.who button:hover{border-color:#cfc6b8}
.who button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.who .print{margin-inline-start:auto;background:none;border-color:transparent;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px;display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
nav.toc{position:sticky;top:84px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
nav.toc h5{margin:4px 10px 8px;font:600 11.5px 'Inter Tight',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
[dir=rtl] nav.toc h5{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0;font-size:13px}
nav.toc a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;text-decoration:none;font-size:14px;color:#4a4640;line-height:1.3}
nav.toc a img{width:20px;height:20px;flex:none}
nav.toc a:hover{background:#f6f3ee}
nav.toc a.on{background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ink);font-weight:600}
main{min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 28px 22px;margin-bottom:18px;position:relative;overflow:hidden}
section::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--ac)}
section.hidden{display:none}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.sh img{width:42px;height:42px;flex:none;border-radius:11px;background:color-mix(in srgb,var(--ac) 10%,#fff);padding:7px}
.sh h2{margin:0;font:600 26px/1.2 'EB Garamond',serif}
[dir=rtl] .sh h2{font:700 21px/1.4 'IBM Plex Sans Arabic',sans-serif}
.for{display:block;font-size:12.5px;font-weight:600;color:var(--ac);margin-bottom:2px}
h3{font-size:15px;margin:18px 0 6px;color:var(--ink)}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-inline-start:0;list-style:none}
ul li{position:relative;padding-inline-start:20px;margin:7px 0}
ul li::before{content:"";position:absolute;inset-inline-start:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--ac)}
ol{counter-reset:n}
ol li{counter-increment:n;position:relative;padding-inline-start:40px;margin:11px 0;min-height:28px}
ol li::before{content:counter(n);position:absolute;inset-inline-start:0;top:0;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ac) 14%,#fff);color:var(--ac);font-weight:700;font-size:13.5px;display:grid;place-items:center}
.ui{display:inline-block;background:#f6f3ee;border:1px solid var(--line);border-radius:7px;padding:0 7px;font-size:13.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.tip,.rule{border-radius:14px;padding:12px 16px;margin:14px 0 4px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.tip{background:color-mix(in srgb,var(--ac) 9%,#fff);border:1px solid color-mix(in srgb,var(--ac) 22%,#fff)}
.rule{background:#fbefec;border:1px solid #f0d3cc;color:#5a2a20}
.tip::before,.rule::before{flex:none;font-weight:700;font-size:12px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-top:2px}
.tip::before{content:"TIP";background:var(--ac);color:#fff}
.rule::before{content:"RULE";background:#BD5038;color:#fff}
[dir=rtl] .tip::before{content:"نصيحة";letter-spacing:0}
[dir=rtl] .rule::before{content:"قاعدة";letter-spacing:0}
.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:6px 0 10px}
.apps .a{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:#fff}
.apps .a img{width:40px;height:40px;flex:none}
.apps .a b{display:block;font-size:15.5px}
.apps .a small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.apps .a span{display:block;font-size:14px;line-height:1.5;margin-top:3px}
table{width:100%;border-collapse:separate;border-spacing:0;margin:8px 0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:#f6f3ee;font-weight:600;font-size:13px;color:var(--mute)}
.foot{color:var(--mute);font-size:13px;text-align:center;padding:10px 0 0}
@media (max-width:880px){
  .wrap{grid-template-columns:1fr;gap:12px}
  nav.toc{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px;border-radius:14px;scrollbar-width:none}
  nav.toc h5{display:none}
  nav.toc a{flex:none;white-space:nowrap;background:#f6f3ee}
  .apps{grid-template-columns:1fr}
}
@media (max-width:600px){
  .top .in{padding:10px 14px;gap:10px}.top .logo img{height:28px}.top .sep,.top .tt{display:none}
  .btn{padding:8px 12px;font-size:13px}
  .hero{padding:22px 16px 4px;gap:16px}.mark{width:56px;height:56px;border-radius:16px}.mark img{width:34px;height:34px}
  .hero h1{font-size:30px}[dir=rtl] .hero h1{font-size:25px}
  .who{padding:12px 16px 4px}.who .print{display:none}
  .wrap{padding:12px 16px 40px}
  section{padding:18px 18px 16px;border-radius:16px}
  .sh h2{font-size:22px}[dir=rtl] .sh h2{font-size:18px}
  table{font-size:13.5px}th,td{padding:8px 10px}
}
@media print{.top,.who,nav.toc{display:none}.wrap{display:block}section{break-inside:avoid;border-color:#ccc}section.hidden{display:block}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="../" aria-label="Forka App"><img src="../logos/forka-app-logo.svg" alt="Forka App"></a>
  <span class="sep"></span><span class="tt" id="tt"></span><span class="sp"></span>
  <div class="seg" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ar">عربي</button></div>
  <a class="btn" id="home" href="../"><span id="homel"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div></header>
<div id="hero"></div>
<div class="wrap"><nav class="toc" id="toc" aria-label="Contents"></nav><main id="main"></main></div>
<script>
const ROLES=['all','staff','head','store','hr','ceo'];
const R={en:{all:'Everyone',staff:'Staff',head:'Department head',store:'Purchasing, store and finance',hr:'HR',ceo:'CEO'},
 ar:{all:'الجميع',staff:'الموظفون',head:'مسؤول قسم',store:'المشتريات والمستودع والمالية',hr:'الموارد البشرية',ceo:'الرئيس التنفيذي'}};
const W={en:{tt:'How to use',home:'Open Forka App',title:'How to use Forka App',lead:'Short and step by step. Choose who you are to see only what you need.',iam:'I am:',print:'Print this guide',contents:'Contents',for:'For: ',foot:'Forka Collective · erp.forka.com'},
 ar:{tt:'طريقة الاستخدام',home:'افتح تطبيق فوركا',title:'طريقة استخدام تطبيق فوركا',lead:'خطوات قصيرة وواضحة. اختر من أنت لترى ما تحتاجه فقط.',iam:'أنا:',print:'اطبع الدليل',contents:'المحتويات',for:'لـ: ',foot:'فوركا كولكتيف · erp.forka.com'}};
const APP={app:{c:'#896B45',i:'../logos/forka-app-icon.svg'},proc:{c:'#BD5038',i:'img/forka-procurement-icon.svg'},hire:{c:'#C8891F',i:'../logos/forka-hire-icon.svg'},board:{c:'#397F8F',i:'../logos/forka-board-icon.svg'}};
const u=s=>`<span class="ui">${s}</span>`;
const S=[
{id:'start',app:'app',roles:['all'],en:{h:'Start here: signing in',b:`
<p>Forka App is one place for all our work apps: <b>erp.forka.com</b>. It works on a computer and on a phone.</p>
<h3>Sign in</h3><ol>
<li>Open <b>erp.forka.com</b>. The sign-in box is on the left, next to the lantern picture.</li>
<li>Press ${u('Sign in with Google')} and choose your <b>company email</b> (for example name@forka.com).</li>
<li>No company email? Press ${u('No company email? Sign in with a PIN')} and type the PIN the CEO gave you.</li>
<li>You see the apps you are allowed to open. Press one. A short loading circle with the app logo shows, then the app opens.</li></ol>
<h3>Inside every app</h3><ul>
<li>The menu is on the left side (also in Arabic). Press the arrows at the top of the menu to make it small; it remembers your choice.</li>
<li>On a phone, press the menu button at the top to open the menu.</li>
<li>${u('Forka Apps')} at the bottom of the menu takes you back to all the apps.</li></ul>
<h3>Every day</h3><ul>
<li>Switch language with ${u('EN')} / ${u('عربي')} at the top.</li>
<li>On a phone: open erp.forka.com, then "Add to Home Screen" in the browser menu. It opens like an app.</li>
<li>On a shared computer, press ${u('Sign out')} when you finish.</li></ul>
<div class="rule">Never share your PIN or let someone use your sign-in. Everything you do is recorded with your name.</div>`},
 ar:{h:'ابدأ هنا: تسجيل الدخول',b:`
<p>تطبيق فوركا مكان واحد لكل تطبيقات العمل: <b>erp.forka.com</b>. يعمل على الكمبيوتر والهاتف.</p>
<h3>تسجيل الدخول</h3><ol>
<li>افتح <b>erp.forka.com</b>. مربع الدخول على اليسار بجانب صورة الفانوس.</li>
<li>اضغط ${u('الدخول بحساب Google')} واختر <b>بريد الشركة</b> (مثل name@forka.com).</li>
<li>لا يوجد بريد للشركة؟ اضغط ${u('لا يوجد بريد للشركة؟ ادخل بالرقم السري')} واكتب الرقم السري الذي أعطاك إياه الرئيس التنفيذي.</li>
<li>تظهر لك التطبيقات المسموحة لك. اضغط على أحدها. تظهر دائرة تحميل قصيرة بشعار التطبيق ثم يفتح.</li></ol>
<h3>داخل كل تطبيق</h3><ul>
<li>القائمة على الجانب الأيسر (وكذلك بالعربية). اضغط الأسهم أعلى القائمة لتصغيرها، ويتذكر التطبيق اختيارك.</li>
<li>على الهاتف، اضغط زر القائمة في الأعلى لفتحها.</li>
<li>${u('تطبيقات فوركا')} أسفل القائمة يعيدك إلى كل التطبيقات.</li></ul>
<h3>كل يوم</h3><ul>
<li>غيّر اللغة من ${u('EN')} / ${u('عربي')} في الأعلى.</li>
<li>على الهاتف: افتح erp.forka.com ثم "إضافة إلى الشاشة الرئيسية" من قائمة المتصفح. يفتح مثل التطبيق.</li>
<li>على جهاز مشترك، اضغط ${u('تسجيل الخروج')} عند الانتهاء.</li></ul>
<div class="rule">لا تشارك رقمك السري ولا تسمح لأحد باستخدام دخولك. كل ما تفعله يُسجَّل باسمك.</div>`}},

{id:'apps',app:'app',roles:['all'],en:{h:'Which app is for what',b:`
<div class="apps">
<div class="a"><img src="img/forka-procurement-icon.svg" alt=""><div><b>Procurement</b><small>Department heads, purchasing, store, finance, CEO</small><span>Requests from departments, purchase orders (LPOs), receiving (GRN), stock, suppliers and payments.</span></div></div>
<div class="a"><img src="../logos/forka-hire-icon.svg" alt=""><div><b>Hire</b><small>HR, department heads, CEO</small><span>Hiring requests, job ads, candidates, interviews and offers.</span></div></div>
<div class="a"><img src="../logos/forka-board-icon.svg" alt=""><div><b>Board</b><small>Every department</small><span>Tasks and projects for each department, goals and team chat.</span></div></div>
<div class="a"><img src="../logos/forka-app-icon.svg" alt=""><div><b>Careers page</b><small>apply.forka.com, no sign-in</small><span>Where candidates see open jobs and apply. Share it with candidates.</span></div></div>
</div>
<p>You only see the apps the CEO turned on for you. Missing one you need? Ask the CEO.</p>`},
 ar:{h:'أي تطبيق لأي عمل',b:`
<div class="apps">
<div class="a"><img src="img/forka-procurement-icon.svg" alt=""><div><b>المشتريات</b><small>مسؤولو الأقسام، المشتريات، المستودع، المالية، الرئيس التنفيذي</small><span>طلبات الأقسام، أوامر الشراء، الاستلام، المخزون، الموردون والمدفوعات.</span></div></div>
<div class="a"><img src="../logos/forka-hire-icon.svg" alt=""><div><b>التوظيف</b><small>الموارد البشرية، مسؤولو الأقسام، الرئيس التنفيذي</small><span>طلبات التوظيف، إعلانات الوظائف، المرشحون، المقابلات والعروض.</span></div></div>
<div class="a"><img src="../logos/forka-board-icon.svg" alt=""><div><b>اللوحات</b><small>كل الأقسام</small><span>مهام ومشاريع كل قسم، الأهداف ومحادثة الفريق.</span></div></div>
<div class="a"><img src="../logos/forka-app-icon.svg" alt=""><div><b>صفحة الوظائف</b><small>apply.forka.com، بدون تسجيل دخول</small><span>يرى فيها المرشحون الوظائف المتاحة ويتقدمون. شاركها مع المرشحين.</span></div></div>
</div>
<p>ترى فقط التطبيقات التي فعّلها لك الرئيس التنفيذي. ينقصك تطبيق تحتاجه؟ اطلبه من الرئيس التنفيذي.</p>`}},

{id:'head-proc',app:'proc',roles:['head'],en:{h:'Ask procurement for something',b:`
<p>For anything new your department needs: a new ingredient or brand, equipment, a service, design work.</p><ol>
<li>Open ${u('Procurement')} and press ${u('Requests')} on the start screen.</li>
<li>Press ${u('New request')} and choose the type: Food or ingredient, Equipment, Service, Design or creative, or Other.</li>
<li>Say what you need and <b>why</b>, how much, and by when. You can add up to 3 photos. Boxes in red must be filled.</li>
<li>Press ${u('Send to procurement')}. Follow every step in ${u('My requests')}: procurement accepts it, calls or meets you to agree the details, then finds suppliers.</li></ol>
<div class="tip">Every purchase from a department request needs the CEO's OK before the order is placed. Add a clear reason to avoid questions.</div>`},
 ar:{h:'اطلب شيئاً من المشتريات',b:`
<p>لأي شيء جديد يحتاجه قسمك: مادة أو علامة جديدة، معدات، خدمة، أعمال تصميم.</p><ol>
<li>افتح ${u('المشتريات')} واضغط ${u('الطلبات')} في شاشة البداية.</li>
<li>اضغط ${u('طلب جديد')} واختر النوع: طعام أو مكوّن، معدات، خدمة، تصميم أو إبداع، أو أخرى.</li>
<li>اكتب ما تحتاجه و<b>السبب</b>، والكمية، والموعد. يمكنك إضافة حتى 3 صور. الخانات الحمراء يجب تعبئتها.</li>
<li>اضغط ${u('إرسال إلى المشتريات')}. تابع كل خطوة في ${u('طلباتي')}: تقبله المشتريات، وتتصل بك أو تقابلك لتحديد التفاصيل، ثم تبحث عن موردين.</li></ol>
<div class="tip">كل شراء من طلب قسم يحتاج موافقة الرئيس التنفيذي قبل الطلب من المورد. اكتب سبباً واضحاً لتجنب الأسئلة.</div>`}},

{id:'head-hire',app:'hire',roles:['head'],en:{h:'Hire for your department',b:`
<ol>
<li>Open ${u('Hire')} and press ${u('Hiring requests')} in the left menu. Press ${u('+ New hiring request')} (about 10 minutes). For the same role again, start from your last request.</li>
<li>Choose the ${u('Work type')}: ${u('On site')}, ${u('Hybrid')} or ${u('Remote')}. For a remote role the branch is optional.</li>
<li>The CEO approves the vacancy. HR builds the scorecard and you approve it. HR posts the job on the careers page.</li>
<li>In ${u('Candidates')} you see the people HR shortlisted for your roles.</li>
<li>Interview: score every question <b>on your own before discussing</b> with HR, then press ${u('Submit my scorecard')}. Other scores stay hidden until you submit.</li>
<li>To book an interview, use ${u('Invite to interview')}: pick a few times and the candidate chooses one by link.</li></ol>
<div class="tip">You only see your own department's requests and candidates. Salaries and personality reports stay with HR.</div>`},
 ar:{h:'وظّف لقسمك',b:`
<ol>
<li>افتح ${u('التوظيف')} واضغط ${u('طلبات التوظيف')} في القائمة الجانبية. اضغط ${u('+ طلب توظيف جديد')} (حوالي 10 دقائق). لنفس الوظيفة مرة أخرى، ابدأ من آخر طلب.</li>
<li>اختر ${u('نوع العمل')}: ${u('في الفرع')} أو ${u('مختلط (في الفرع وعن بُعد)')} أو ${u('عن بُعد')}. للوظيفة عن بُعد يكون الفرع اختيارياً.</li>
<li>يوافق الرئيس التنفيذي على الشاغر. تعدّ الموارد البشرية بطاقة التقييم وتوافق أنت عليها. تنشر الموارد البشرية الوظيفة في صفحة الوظائف.</li>
<li>في ${u('المرشحون')} ترى من اختارتهم الموارد البشرية لوظائفك.</li>
<li>المقابلة: قيّم كل سؤال <b>بنفسك قبل النقاش</b> مع الموارد البشرية، ثم اضغط ${u('إرسال تقييمي')}. تبقى التقييمات الأخرى مخفية حتى ترسل.</li>
<li>لحجز مقابلة استخدم ${u('دعوة للمقابلة')}: اختر عدة أوقات ويختار المرشح أحدها عبر رابط.</li></ol>
<div class="tip">ترى فقط طلبات ومرشحي قسمك. الرواتب وتقارير الشخصية تبقى مع الموارد البشرية.</div>`}},

{id:'staff',app:'app',roles:['staff'],en:{h:'For staff',b:`
<ul>
<li>Open erp.forka.com and press the app you need. If an app is missing, you do not have it yet: ask your department head.</li>
<li>Fill every box in red before saving. Red means "needed".</li>
<li>When you change something, press ${u('Save')} (or ${u('Save changes')}). ${u('Cancel')} throws your changes away.</li>
<li>Your tasks are in ${u('Board')} → ${u('My tasks')}.</li>
<li>Something looks wrong? Take a screenshot and send it to your department head with what you pressed.</li></ul>
<div class="tip">Friends looking for a job? Send them <b>apply.forka.com</b>. Every candidate gets a reply.</div>`},
 ar:{h:'للموظفين',b:`
<ul>
<li>افتح erp.forka.com واضغط التطبيق الذي تحتاجه. إذا لم يظهر التطبيق، فليس لديك صلاحية بعد: اطلبها من مسؤول قسمك.</li>
<li>عبّئ كل خانة حمراء قبل الحفظ. الأحمر يعني "مطلوب".</li>
<li>عندما تغيّر شيئاً اضغط ${u('حفظ')} (أو ${u('حفظ التعديلات')}). ${u('إلغاء')} يحذف تعديلاتك.</li>
<li>مهامك في ${u('اللوحات')} ← ${u('مهامي')}.</li>
<li>هناك شيء غير صحيح؟ خذ صورة للشاشة وأرسلها لمسؤول قسمك مع ما ضغطت عليه.</li></ul>
<div class="tip">أصدقاء يبحثون عن عمل؟ أرسل لهم <b>apply.forka.com</b>. كل متقدم يحصل على رد.</div>`}},

{id:'board',app:'board',roles:['all'],en:{h:'Board: tasks and projects',b:`
<ol>
<li>Open ${u('Board')}. ${u('My tasks')} in the left menu shows everything given to you, with due dates.</li>
<li>Press ${u('New task')}: write what needs doing, choose who does it and the due date, then save.</li>
<li>Open a task to add a note, a checklist or a file, and to move it along (for example to Doing or Done).</li>
<li>${u('Projects')} and ${u('Departments')} show the work of each team. ${u('Goals')} shows what the company is aiming for.</li>
<li>${u('Chat')} is for quick messages with your team. Write @ and a name to mention someone.</li></ol>
<div class="tip">Keep tasks short and clear: one task, one person, one due date.</div>`},
 ar:{h:'اللوحات: المهام والمشاريع',b:`
<ol>
<li>افتح ${u('اللوحات')}. ${u('مهامي')} في القائمة الجانبية تعرض كل ما أُسند إليك مع مواعيد التسليم.</li>
<li>اضغط ${u('مهمة جديدة')}: اكتب المطلوب، واختر من سينفذه وموعد التسليم، ثم احفظ.</li>
<li>افتح المهمة لإضافة ملاحظة أو قائمة تحقق أو ملف، ولنقلها إلى مرحلة أخرى (مثل قيد التنفيذ أو تم).</li>
<li>${u('المشاريع')} و${u('الأقسام')} تعرض عمل كل فريق. ${u('الأهداف')} تعرض ما تسعى إليه الشركة.</li>
<li>${u('المحادثة')} للرسائل السريعة مع فريقك. اكتب @ ثم الاسم لتذكر شخصاً.</li></ol>
<div class="tip">اجعل المهام قصيرة وواضحة: مهمة واحدة، شخص واحد، موعد واحد.</div>`}},

{id:'buy',app:'proc',roles:['store'],en:{h:'Procurement: Purchasing',b:`
<p>Press ${u('Purchasing')} on the start screen: the monthly plan, stock, suppliers and orders.</p><ol>
<li>${u('Requests')}: new requests from department heads. Accept and agree the details with the requester, or close with a reason (a reason is always needed). ${u('Email requester')} under the notes writes an email that already has the request number.</li>
<li>${u('Procurement ongoing')}: find suppliers, collect quotes, and follow up until delivered. Purchases from requests wait for the CEO's OK.</li>
<li>${u('Purchase orders')}: LPOs are made automatically (after CEO approval, and for stock below its reserve). Check the draft, then issue it. ${u('New LPO')} adds one by hand.</li>
<li>${u('Inventory')}: update "Stock now" with today's count. The app works out "To buy". When a line is right, press ${u('Confirm')}.</li>
<li>Item photo: in ${u('Inventory')} press ${u('Edit')}, open the item, then ${u('Add photo')}. The photo shows in the supplier's item list too.</li>
<li>${u('Suppliers')}: keep phone, payment terms and credit days filled (red = missing). The item list shows the amount for this month, how much to buy and the unit price.</li></ol>`},
 ar:{h:'المشتريات: قسم الشراء',b:`
<p>اضغط ${u('المشتريات')} في شاشة البداية: الخطة الشهرية، المخزون، الموردون والطلبات.</p><ol>
<li>${u('الطلبات')}: طلبات جديدة من مسؤولي الأقسام. اقبلها واتفق على التفاصيل مع صاحب الطلب، أو أغلقها مع ذكر السبب (السبب مطلوب دائماً). ${u('مراسلة مقدم الطلب بالبريد')} أسفل الملاحظات يكتب رسالة فيها رقم الطلب.</li>
<li>${u('المشتريات الجارية')}: ابحث عن موردين، اجمع العروض، وتابع حتى التسليم. مشتريات الطلبات تنتظر موافقة الرئيس التنفيذي.</li>
<li>${u('أوامر الشراء')}: تُنشأ تلقائياً (بعد موافقة الرئيس التنفيذي، وللأصناف التي نزلت عن الاحتياطي). راجع المسودة ثم أصدرها. ${u('أمر شراء جديد')} لإضافة أمر يدوياً.</li>
<li>${u('المخزون')}: حدّث «المخزون الآن» بجرد اليوم. التطبيق يحسب «للشراء». عندما يكون السطر صحيحاً اضغط ${u('تأكيد')}.</li>
<li>صورة الصنف: في ${u('المخزون')} اضغط ${u('تعديل')}، افتح الصنف، ثم ${u('إضافة صورة')}. تظهر الصورة أيضاً في قائمة أصناف المورد.</li>
<li>${u('الموردون')}: أكمل الهاتف وشروط الدفع وأيام الائتمان (الأحمر = ناقص). قائمة الأصناف تعرض مبلغ هذا الشهر والكمية المطلوب شراؤها وسعر الوحدة.</li></ol>`}},

{id:'store',app:'proc',roles:['store'],en:{h:'Procurement: Operations (store)',b:`
<p>Press ${u('Operations')} on the start screen: what comes into the store and what goes out to the branches.</p><ol>
<li><b>Receiving (GRN)</b>: one GRN per delivery. Check the truck, count every item, record rejections with photos.</li>
<li>${u('Branch requests')}: a branch asks for items, the store approves and issues them with a transfer bill at cost price, then the branch confirms what arrived.</li>
<li>Every issue voucher and GRN has ${u('Print')} and ${u('Share')}. Share sends a PDF, for example by WhatsApp.</li>
<li>${u('Stock movements')}: everything in (accepted on GRNs) and out (issued to branches).</li></ol>
<div class="rule">The person who ordered must not receive. Purchasing buys, the store receives, Finance pays.</div>`},
 ar:{h:'المشتريات: قسم العمليات (المستودع)',b:`
<p>اضغط ${u('العمليات')} في شاشة البداية: ما يدخل المستودع وما يخرج للفروع.</p><ol>
<li><b>الاستلام (GRN)</b>: استلام واحد لكل توريد. افحص الشاحنة، عدّ كل صنف، وسجّل المرفوض مع صور.</li>
<li>${u('طلبات الفروع')}: يطلب الفرع أصنافاً، يوافق المستودع ويصرفها بفاتورة تحويل بسعر التكلفة، ثم يؤكد الفرع ما وصل.</li>
<li>كل إذن صرف وإذن استلام فيه ${u('طباعة')} و${u('مشاركة')}. المشاركة ترسل ملف PDF، مثلاً عبر واتساب.</li>
<li>${u('حركة المخزون')}: كل ما دخل (المقبول في الاستلام) وما خرج (المصروف للفروع).</li></ol>
<div class="rule">من يطلب لا يستلم. المشتريات تشتري، المستودع يستلم، المالية تدفع.</div>`}},

{id:'fin',app:'proc',roles:['store'],en:{h:'Procurement: Payments (finance)',b:`
<ol>
<li>${u('Payments')}: everything received from suppliers and what is still to pay. A delivery is ready to pay when the invoice, quantities and price checks are complete.</li>
<li>Pay only when the purchase order, the GRN and the invoice match.</li>
<li>${u('Statements (SOA)')}: every delivery is added to the supplier's statement automatically; payments are recorded when you mark a bill paid.</li></ol>
<div class="tip">Oman has its own Payments (amounts in OMR). Each bill shows if it is paid from the UAE or from Oman.</div>`},
 ar:{h:'المشتريات: المدفوعات (المالية)',b:`
<ol>
<li>${u('المدفوعات')}: كل ما استُلم من الموردين وما بقي للدفع. التوريد جاهز للدفع عندما تكتمل الفاتورة والكميات وفحص الأسعار.</li>
<li>ادفع فقط عندما يتطابق أمر الشراء والاستلام والفاتورة.</li>
<li>${u('كشوف الحساب')}: يُضاف كل توريد إلى كشف المورد تلقائياً، وتُسجّل الدفعات عندما تحدد الفاتورة كمدفوعة.</li></ol>
<div class="tip">لعُمان مدفوعات خاصة (المبالغ بالريال العماني). كل فاتورة توضح إن كانت تُدفع من الإمارات أو من عُمان.</div>`}},

{id:'hr',app:'hire',roles:['hr'],en:{h:'Hire for HR',b:`
<ol>
<li><b>Post a job</b>: open the approved hiring request. ${u('Draft JD + ads with AI')} writes the job description and the English and Arabic ads; read and edit before saving. Your house style goes in ${u('Careers page')} → ${u('Guidance for AI')}.</li>
<li><b>On site, hybrid or remote</b>: the work type from the request shows on the job ad and the careers page.</li>
<li><b>New applications</b> arrive in ${u('Candidates')}. HR gets one email for the first, then a summary every 15 minutes.</li>
<li><b>Screen</b>: open a candidate and press ${u('Summarise CV')}. The AI reads the CV and suggests a score for each must-have with the evidence. <b>It is a suggestion: check it against the CV. People decide.</b></li>
<li><b>Interviews</b>: ${u('Invite to interview')} sends the candidate a link to pick a time; WhatsApp works too.</li>
<li><b>Reject with a reason</b> (the criterion that was not met). Strong "not now" people go to the ${u('Talent pool & compliance')}.</li></ol>
<div class="rule">Every candidate gets a reply. Never judge by name, photo, age, gender, nationality or religion.</div>`},
 ar:{h:'التوظيف للموارد البشرية',b:`
<ol>
<li><b>نشر وظيفة</b>: افتح طلب التوظيف الموافق عليه. ${u('كتابة الوصف والإعلانات بالذكاء الاصطناعي')} يكتب الوصف الوظيفي والإعلان بالعربية والإنجليزية؛ اقرأ وعدّل قبل الحفظ. ضع أسلوب الشركة في ${u('صفحة الوظائف')} ← ${u('إرشادات للذكاء الاصطناعي')}.</li>
<li><b>في الفرع أو مختلط أو عن بُعد</b>: نوع العمل من الطلب يظهر في إعلان الوظيفة وفي صفحة الوظائف.</li>
<li><b>الطلبات الجديدة</b> تصل إلى ${u('المرشحون')}. تصل للموارد البشرية رسالة لأول طلب، ثم ملخص كل 15 دقيقة.</li>
<li><b>الفرز</b>: افتح المرشح واضغط ${u('تلخيص السيرة الذاتية')}. يقرأ الذكاء الاصطناعي السيرة ويقترح درجة لكل شرط أساسي مع الدليل. <b>هذا اقتراح: تحقق منه مقابل السيرة. القرار للإنسان.</b></li>
<li><b>المقابلات</b>: ${u('دعوة للمقابلة')} يرسل للمرشح رابطاً لاختيار الموعد؛ ويمكن عبر واتساب أيضاً.</li>
<li><b>ارفض مع ذكر السبب</b> (الشرط غير المستوفى). المرشحون الجيدون "ليس الآن" يذهبون إلى ${u('بنك المواهب والامتثال')}.</li></ol>
<div class="rule">كل متقدم يحصل على رد. لا تحكم بالاسم أو الصورة أو العمر أو الجنس أو الجنسية أو الدين.</div>`}},

{id:'ceo',app:'app',roles:['ceo'],en:{h:'For the CEO',b:`
<ul>
<li>${u('People and access')} on the Forka App home: add a person, choose their clearance (staff, manager, CEO), the apps they can open and their Procurement sections. Confirm or reject access requests.</li>
<li>Procurement ${u('CEO')} → ${u('Approvals')}: purchases waiting for your OK. Check the supplier and quotation, then approve or send back.</li>
<li>Hire ${u('CEO approvals')}: vacancies (step 2) and final candidates (step 14), two working days each.</li>
<li>Board ${u('People')}: set the departments and who heads each one.</li>
<li>${u('Activity')}: who did what, and when.</li></ul>
<div class="tip">As an active CEO you open every app and every section automatically. Nothing to tick for yourself.</div>`},
 ar:{h:'للرئيس التنفيذي',b:`
<ul>
<li>${u('الأشخاص والصلاحيات')} في الصفحة الرئيسية لتطبيق فوركا: أضف شخصاً، واختر مستوى الصلاحية (موظف، مدير، رئيس تنفيذي)، والتطبيقات المسموحة، وأقسام المشتريات. وافق على طلبات الدخول أو ارفضها.</li>
<li>المشتريات ${u('الرئيس التنفيذي')} ← ${u('الموافقات')}: مشتريات تنتظر موافقتك. راجع المورد والعرض، ثم وافق أو أعد.</li>
<li>التوظيف ${u('موافقات الرئيس')}: الشواغر (الخطوة 2) والمرشحون النهائيون (الخطوة 14)، يوما عمل لكل منهما.</li>
<li>اللوحات ${u('الأشخاص')}: حدّد الأقسام ومسؤول كل قسم.</li>
<li>${u('سجل النشاط')}: من فعل ماذا ومتى.</li></ul>
<div class="tip">بصفتك الرئيس التنفيذي النشط تفتح كل التطبيقات والأقسام تلقائياً. لا حاجة لتحديد أي شيء لنفسك.</div>`}},

{id:'help',app:'app',roles:['all'],en:{h:'Problems and what to do',b:`
<table><tr><th>You see</th><th>Do this</th></tr>
<tr><td>Please sign in again.</td><td>Your session ended. Sign in again at erp.forka.com.</td></tr>
<tr><td>Could not reach the server.</td><td>Check the internet, wait a minute, try again.</td></tr>
<tr><td>No apps are switched on for you yet.</td><td>Ask the CEO to turn on the apps you need.</td></tr>
<tr><td>Boxes in red.</td><td>They are required. Fill them, then save.</td></tr>
<tr><td>The page looks old after an update.</td><td>Refresh the page (F5, or pull down on a phone).</td></tr></table>
<p>Still stuck? Send a screenshot and what you pressed to your department head, or to Ruby (admin@forka.com).</p>`},
 ar:{h:'المشاكل وما تفعله',b:`
<table><tr><th>ما يظهر لك</th><th>ماذا تفعل</th></tr>
<tr><td>سجّل الدخول مرة أخرى.</td><td>انتهت الجلسة. سجّل الدخول من جديد في erp.forka.com.</td></tr>
<tr><td>تعذر الوصول إلى الخادم.</td><td>تأكد من الإنترنت، انتظر دقيقة، ثم حاول مرة أخرى.</td></tr>
<tr><td>لا توجد تطبيقات مفعّلة لك بعد.</td><td>اطلب من الرئيس التنفيذي تفعيل ما تحتاجه.</td></tr>
<tr><td>خانات باللون الأحمر.</td><td>هي مطلوبة. عبّئها ثم احفظ.</td></tr>
<tr><td>الصفحة تبدو قديمة بعد تحديث.</td><td>حدّث الصفحة (F5، أو اسحب للأسفل على الهاتف).</td></tr></table>
<p>ما زلت تواجه مشكلة؟ أرسل صورة الشاشة وما ضغطت عليه لمسؤول قسمك، أو لروبي (admin@forka.com).</p>`}}
];
let lang=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q==='ar'?'ar':'en';return localStorage.getItem('fa-lang')==='ar'||localStorage.getItem('fh-lang')==='ar'?'ar':'en'}catch(e){return 'en'}})();
let who=(()=>{const m=location.hash.match(/^#for-(staff|head|store|hr|ceo)$/);return m?m[1]:'all'})();
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const w=W[lang];document.title=(lang==='ar'?'تطبيق فوركا - ':'Forka App - ')+w.tt;
  document.getElementById('tt').textContent=w.tt;document.getElementById('homel').textContent=w.home;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const shown=s=>who==='all'||s.roles.includes('all')||s.roles.includes(who);
  document.getElementById('hero').innerHTML=`<div class="hero"><div class="mark"><img src="../logos/forka-app-icon.svg" alt=""></div><div><h1>${w.title}</h1><p>${w.lead}</p></div></div>
    <div class="who"><span>${w.iam}</span>${ROLES.map(r=>`<button data-r="${r}" class="${who===r?'on':''}">${R[lang][r]}</button>`).join('')}<button class="print" onclick="print()">${w.print}</button></div>`;
  document.getElementById('main').innerHTML=S.map(s=>{const a=APP[s.app];return `<section id="${s.id}" style="--ac:${a.c}" class="${shown(s)?'':'hidden'}"><div class="sh"><img src="${a.i}" alt=""><div><span class="for">${w.for}${s.roles.map(r=>R[lang][r]).join(' · ')}</span><h2>${s[lang].h}</h2></div></div>${s[lang].b}</section>`}).join('')+`<p class="foot">${w.foot}</p>`;
  document.getElementById('toc').innerHTML=`<h5>${w.contents}</h5>`+S.filter(shown).map(s=>`<a href="#${s.id}" data-s="${s.id}" style="--ac:${APP[s.app].c}"><img src="${APP[s.app].i}" alt="">${s[lang].h}</a>`).join('');
  spy();
}
function spy(){const secs=[...document.querySelectorAll('section:not(.hidden)')];let cur=secs[0];for(const s of secs){if(s.getBoundingClientRect().top<140)cur=s}
  document.querySelectorAll('nav.toc a').forEach(a=>a.classList.toggle('on',!!cur&&a.dataset.s===cur.id))}
addEventListener('scroll',spy,{passive:true});
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('fa-lang',lang)}catch(x){}render();return}
  const r=e.target.closest('[data-r]');if(r){who=r.dataset.r;history.replaceState(null,'',who==='all'?location.pathname+location.search:location.search+'#for-'+who);render()}});
render();
</script>
</body>
</html>
