<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forka suite components</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="suite.css"><style>body{margin:0;background:var(--fs-canvas);font-family:var(--fs-sans);color:var(--fs-ink)} main{padding:24px} .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style></head>
<body style="--fs-accent:#3D7C8C"><div id="app"></div><script src="suite.js"></script><script>
let L=new URLSearchParams(location.search).get('lang')||'en';
const items=['Dashboard','CEO approvals','Hiring requests','Candidates','Talent pool & compliance','Careers page','Reports','Settings','Team & access'].map((x,i)=>({label:x,on:i===0,badge:i===1?'2':'',attrs:`data-go="${i}"`}));
function render(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.getElementById('app').innerHTML=FS.header({app:'hire',lang:L,menu:true,user:{name:'Khaled Alamer',role:'HR · CEO'},alerts:`<button class="fs-iconbtn" aria-label="Alerts">${FS.icon('bell',20)}<span class="fs-dot"></span></button>`})+FS.menu(items)+
 `<main><h1 style="font-family:var(--fs-serif)">Components</h1><div class="row"><span class="fs-badge fs-p-urgent">${FS.icon('alert',13)}Urgent</span><span class="fs-badge fs-p-high">High</span><span class="fs-badge fs-p-normal">Normal</span><span class="fs-badge fs-p-low">Low</span></div>
 <div class="row"><span class="fs-badge fs-b-ok">${FS.icon('check',13)}Approved</span><span class="fs-badge fs-b-warn">${FS.icon('clock',13)}Waiting</span><span class="fs-badge fs-b-bad">${FS.icon('x',13)}Rejected</span></div>
 <div class="row"><button class="fs-btn">Primary action</button><button class="fs-btn fs-ghost">Secondary</button><span class="fs-density"><button aria-pressed="true">Comfortable</button><button aria-pressed="false">Compact</button></span></div>
 <div class="fs-state"><b>Nothing waiting for you</b>None of your 3 open roles is posted yet.<br><button class="fs-btn">Post a role</button></div></main>`+
 FS.bottom([{label:'Home',icon:'home',on:true},{label:'Approve',icon:'check',badge:'2'},{label:'New',icon:'plus'},{label:'Me',icon:'user'}]);
 FS.after({app:'hire',bottom:true})}
FS.onLang=l=>{L=l;render()};render();
</script></body></html>
