<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Careers at Forka</title>
<meta name="description" content="Open jobs at Forka restaurants in the UAE and Oman. Apply in a few minutes.">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="../config.js"></script>
<style>
:root{--ink:#23211F;--ink2:#4a4642;--mute:#8a847c;--line:#e4ded4;--bg:#F5F2EC;--card:#fffdf9;--bronze:#A57C52;--bronze2:#8a6440;--bad:#b0412e;--badbg:#fbeae6;--ok:#3f7a52}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter Tight",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter Tight",system-ui,sans-serif}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:600;margin:0}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3{font-family:"IBM Plex Sans Arabic",serif}
a{color:inherit}
header{background:var(--ink);color:#fff}
.bar{max-width:980px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.logo{font-family:"EB Garamond",serif;font-size:24px;letter-spacing:.5px}.logo b{color:#d7b48a;font-weight:600}
.sp{flex:1}
.lang{background:none;border:1px solid #5a554f;color:#fff;border-radius:8px;height:34px;padding:0 12px;cursor:pointer;font:inherit}
.hero{max-width:980px;margin:0 auto;padding:44px 20px 26px}
.kick{letter-spacing:2px;font-size:12px;color:var(--bronze2);font-weight:600}
.hero h1{font-size:40px;line-height:1.1;margin:8px 0 12px;max-width:720px}
.hero p{max-width:680px;color:var(--ink2);margin:0}
.vals{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.vals span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:6px 20px 60px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.job:hover{border-color:var(--bronze)}
.job h3{font-size:21px}
.meta{font-size:13px;color:var(--mute)}
.job .go{margin-top:auto;padding-top:8px;color:var(--bronze2);font-weight:600;font-size:14px}
.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.back{background:none;border:0;padding:0;color:var(--bronze2);font:inherit;font-weight:600;cursor:pointer;margin-bottom:14px}
.ad{white-space:pre-wrap;color:var(--ink2);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 5px}
label .hint{font-weight:400;color:var(--mute)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bronze);outline-offset:-1px;border-color:var(--bronze)}
.miss{border-color:var(--bad)!important;background:var(--badbg)!important}
.q{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.q span{flex:1}
.yn{display:flex;gap:6px}
.yn button{height:34px;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;cursor:pointer}
.yn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border:0;border-radius:10px;background:var(--bronze);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:20px}
.btn:hover{background:var(--bronze2)}.btn:disabled{opacity:.5;cursor:wait}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:10px 12px;margin-top:16px;font-size:14px}
.done{text-align:center;padding:40px 24px}
.done .ref{display:inline-block;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:600;letter-spacing:1px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.dayc{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.dayc b{display:block;margin-bottom:8px}
.dayc div{display:flex;flex-wrap:wrap;gap:6px}.tm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;cursor:pointer}
.tm.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tm:disabled{color:var(--mute);text-decoration:line-through;cursor:default;background:var(--bg)}
.okbox{background:#e9f3ec;color:var(--ok);border-radius:8px;padding:10px 12px;margin-top:12px;font-weight:600}
.pv{background:#f8eedc;color:#7a5410;text-align:center;font-size:13px;padding:6px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}
footer{max-width:980px;margin:0 auto;padding:0 20px 40px;color:var(--mute);font-size:13px}
@media(max-width:640px){.hero h1{font-size:30px}.grid{grid-template-columns:1fr}.panel{padding:18px}.q{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="pv"></div>
<header><div class="bar"><div class="logo">FORKA <b>Careers</b></div><span class="sp"></span><button class="lang" id="lang"></button></div></header>
<div id="app"></div>
<footer id="ft"></footer>
<script>
const CFG=window.FORKA_APPS||{};const HURL=CFG.HIRING_URL||"";
const T={en:{lang:"عربي",kick:"FORKA COLLECTIVE · CAREERS",h1:"Build the region's best restaurants with us",
  open:"Open jobs",none:"No open jobs right now. Please check again soon.",loading:"Loading jobs…",netErr:"We couldn't load the jobs. Please check your connection and try again.",
  view:"View and apply",back:"All jobs",apply:"Apply for this job",name:"Full name",email:"Email",phone:"Phone / WhatsApp",loc:"Where do you live now?",
  yrs:"Years of relevant experience",notice:"Notice period (days)",sal:"Expected monthly salary (AED or OMR)",visa:"Visa status",
  visas:["Own visa / residency","Employer visa, transferable","Visit visa","Needs a visa"],qs:"A few quick questions",yes:"Yes",no:"No",
  cv:"Your CV",cvHint:"PDF, Word or a photo, up to 5 MB",cvText:"Or paste your CV or LinkedIn link",opt:"optional",

  cvbig:"The CV file is over 5 MB. Please send a smaller file or paste the text.",cvtype:"Please upload a PDF, Word file or a photo.",busy:"Too many applications right now. Please try again later.",
  thanks:"Thank you, your application was sent.",thanksTxt:"Our HR team reviews every application and replies to everyone. Keep this reference:",more:"See other jobs",
  preview:"Preview: sample jobs only. Nothing is sent.",privacy:"Your details are used only for hiring at Forka and kept private.",posted:"Posted",
  bkHi:"Hello",bkCall:"Pick a time for your HR call",bkIv:"Pick a time for your interview",bkFor:"for the role of",bkTz:"Times are UAE time (same as Oman).",bkMins:"minutes",

 ar:{lang:"English",kick:"فوركا · الوظائف",h1:"ابنِ معنا أفضل مطاعم المنطقة",
  open:"الوظائف المتاحة",none:"لا توجد وظائف متاحة الآن. يرجى المحاولة لاحقاً.",loading:"جاري تحميل الوظائف...",netErr:"تعذّر تحميل الوظائف. تحقق من الاتصال وحاول مرة أخرى.",
  view:"التفاصيل والتقديم",back:"كل الوظائف",apply:"قدّم على هذه الوظيفة",name:"الاسم الكامل",email:"البريد الإلكتروني",phone:"الهاتف / واتساب",loc:"مكان إقامتك الحالي",
  yrs:"سنوات الخبرة في نفس المجال",notice:"فترة الإشعار (بالأيام)",sal:"الراتب الشهري المتوقع (درهم أو ريال عماني)",visa:"حالة التأشيرة",
  visas:["إقامة / تأشيرة خاصة","تأشيرة عمل قابلة للنقل","تأشيرة زيارة","أحتاج تأشيرة"],qs:"أسئلة سريعة",yes:"نعم",no:"لا",
  cv:"السيرة الذاتية",cvHint:"PDF أو Word أو صورة، حتى 5 ميغابايت",cvText:"أو الصق سيرتك الذاتية أو رابط لينكدإن",opt:"اختياري",
  consent:"أوافق على أن تحتفظ فوركا ببياناتي لهذه الوظيفة ووظائف مشابهة لمدة تصل إلى 12 شهراً.",send:"إرسال الطلب",sending:"جاري الإرسال...",
  need:"يرجى تعبئة الحقول المظللة بالأحمر.",again:"قدّمت على هذه الوظيفة خلال الساعة الماضية. طلبك وصلنا.",closed:"هذه الوظيفة لم تعد متاحة.",
  cvbig:"ملف السيرة الذاتية أكبر من 5 ميغابايت. أرسل ملفاً أصغر أو الصق النص.",cvtype:"يرجى رفع ملف PDF أو Word أو صورة.",busy:"عدد كبير من الطلبات الآن. يرجى المحاولة لاحقاً.",
  thanks:"شكراً لك، تم إرسال طلبك.",thanksTxt:"فريق الموارد البشرية يراجع كل الطلبات ويرد على الجميع. احتفظ بهذا الرقم المرجعي:",more:"شاهد وظائف أخرى",
  preview:"معاينة: وظائف تجريبية فقط. لا يتم إرسال أي شيء.",privacy:"تُستخدم بياناتك للتوظيف في فوركا فقط وتبقى سرية.",posted:"نُشرت",
  bkHi:"مرحباً",bkCall:"اختر موعد المكالمة مع الموارد البشرية",bkIv:"اختر موعد المقابلة",bkFor:"لوظيفة",bkTz:"المواعيد بتوقيت الإمارات (نفس توقيت عُمان).",bkMins:"دقيقة",
  bkConfirm:"تأكيد هذا الموعد",bkPick:"اختر موعداً من الأعلى",bkDone:"تم تأكيد موعدك",bkDoneTxt:"أرسلنا لك رسالة تأكيد بالبريد مع دعوة تقويم. نراك قريباً.",
  bkHave:"موعدك الحالي:",bkChange:"تريد تغييره؟ اختر موعداً آخر من الأسفل.",bkTaken:"عذراً، تم حجز هذا الموعد للتو. اختر موعداً آخر.",bkLate:"الموعد قريب جداً ولا يمكن تغييره عبر الإنترنت. يرجى الرد على رسالتنا.",

  modes:{"In person":"حضورياً","Phone":"مكالمة هاتفية","Video call":"مكالمة فيديو"},taken:"محجوز",bkLoading:"جاري تحميل المواعيد..."}};
let lang=(()=>{try{const s=localStorage.getItem("fc-lang");if(s)return s}catch(e){}return /^ar/i.test(navigator.language||"")?"ar":"en"})();
const t=k=>T[lang][k];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SAMPLE={jobs:[{id:"demo1",title:"Line Cook",dept:"Kitchen",branch:"Sharjah",ad:"Join the kitchen team at Al Matbakh Al Kuwaiti, Sharjah. Prepare Kuwaiti dishes to our standards, keep your station clean and work as one team at rush hour.",adAr:"انضم إلى فريق المطبخ في المطبخ الكويتي بالشارقة. تحضير الأطباق الكويتية حسب معاييرنا، والحفاظ على نظافة المحطة، والعمل كفريق واحد وقت الذروة.",knockout:["Do you have at least 2 years of kitchen experience?","Can you work evening shifts?"],postedAt:Date.now()-864e5},
  {id:"demo2",title:"Barista",dept:"Service",branch:"Mayar Cafe",ad:"Specialty coffee bar. Dial in espresso, serve guests with care, and help run tastings.",adAr:"مقهى قهوة مختصة. ضبط الإسبريسو وخدمة الضيوف باهتمام والمساعدة في جلسات التذوق.",knockout:["Have you worked on an espresso machine before?"],postedAt:Date.now()-3*864e5}],brand:null};
let BK=null,bkTok="",bkSel=null,bkMsg="",bkBusy=false;
let D=null,err="",job=null,form={ans:[],bad:[]},state="list",ref="",sending=false,fileSel=null;
const BRAND_AR={intro:"ندير مطاعم في الإمارات وعُمان، منها المطبخ الكويتي ومقهى ميار، ونحن في توسّع مستمر. نرد على كل متقدّم.",values:["الطعام أولاً","معايير واضحة تُقاس","تطوّر مع المجموعة","نرد على كل متقدّم"]};
const brand=()=>Object.assign({intro:"We run restaurants across the UAE and Oman, including Al Matbakh Al Kuwaiti and Mayar Cafe, and we are growing. Every candidate gets a reply.",values:["Food first","Standards you can measure","Grow with the group","Every candidate gets a reply"]},(D&&D.brand)||{});
// Arabic page: Arabic intro and values (HR's own Arabic wording if they wrote it, otherwise the standard Arabic text)
const introOf=b=>lang==="ar"?(b.introAr||BRAND_AR.intro):b.intro;
const valuesOf=b=>lang==="ar"?(b.valuesAr&&b.valuesAr.length?b.valuesAr:BRAND_AR.values):(b.values||[]);
const DEPT_AR={"Operations":"العمليات","Kitchen":"المطبخ","Service":"الخدمة","Marketing":"التسويق","Finance":"المالية","HR":"الموارد البشرية","Procurement & Store":"المشتريات والمخزن","Administration":"الإدارة"};
const BRANCH_AR={"Sharjah":"الشارقة","Fujairah":"الفجيرة","Umm Al Quwain":"أم القيوين","Mayar Cafe":"مقهى ميار","Oman":"عُمان","Ajman Central Store":"مخزن عجمان المركزي","Head Office":"المكتب الرئيسي"};
const where=j=>[lang==="ar"?(DEPT_AR[j.dept]||j.dept):j.dept,lang==="ar"?(BRANCH_AR[j.branch]||j.branch):j.branch].filter(Boolean).join(" · ");
const titleOf=j=>lang==="ar"&&j.titleAr?j.titleAr:j.title;
const qOf=(j,i)=>lang==="ar"&&j.knockoutAr&&j.knockoutAr[i]?j.knockoutAr[i]:j.knockout[i];
function adOf(j){return lang==="ar"&&j.adAr?j.adAr:(j.ad||j.summary||j.jd||"")}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.getElementById("lang").textContent=t("lang");
  document.getElementById("pv").innerHTML=HURL?"":`<div class="pv">${t("preview")}</div>`;
  document.getElementById("ft").textContent=t("privacy");
  const A=document.getElementById("app"),b=brand();
  const hero=`<section class="hero"><div class="kick">${t("kick")}</div><h1>${t("h1")}</h1><p>${esc(introOf(b))}</p><div class="vals">${valuesOf(b).map(v=>`<span>${esc(v)}</span>`).join("")}</div></section>`;
  if(state==="book"){A.innerHTML=`<main style="padding-top:30px">${bookHtml()}</main>`;return}
  if(state==="done"){A.innerHTML=`<main style="padding-top:30px"><div class="panel done"><h2>${t("thanks")}</h2><p>${t("thanksTxt")}</p><div class="ref">${esc(ref)}</div><div><button class="btn" data-a="more">${t("more")}</button></div></div></main>`;return}
  if(state==="job"&&job){A.innerHTML=`<main style="padding-top:30px">${jobHtml()}</main>`;return}
  let list;
  if(err)list=`<div class="empty">${t("netErr")}</div>`;
  else if(!D)list=`<div class="empty">${t("loading")}</div>`;
  else if(!D.jobs.length)list=`<div class="empty">${t("none")}</div>`;
  else list=`<div class="jobs">${D.jobs.map(j=>`<button class="job" data-job="${esc(j.id)}"><div class="meta">${esc(where(j))}</div><h3 dir="auto">${esc(titleOf(j))}</h3><div class="meta">${esc(adOf(j)).slice(0,140)}${adOf(j).length>140?"…":""}</div><span class="go">${t("view")} ${lang==="ar"?"←":"→"}</span></button>`).join("")}</div>`;
  A.innerHTML=hero+`<main><h2 style="margin-bottom:14px">${t("open")}</h2>${list}</main>`}
function jobHtml(){const j=job,f=form,m=k=>f.bad.includes(k)?"miss":"";
  return `<button class="back" data-a="back">${lang==="ar"?"→":"←"} ${t("back")}</button><div class="panel">
  <div class="meta">${esc(where(j))}</div><h1 style="font-size:32px" dir="auto">${esc(titleOf(j))}</h1><div class="ad">${esc(adOf(j))}</div>
  <h2 style="margin-top:22px">${t("apply")}</h2><form id="f" novalidate>
  <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
  <div class="grid"><div><label>${t("name")}</label><input name="name" class="${m("name")}" autocomplete="name"></div><div><label>${t("email")}</label><input name="email" type="email" class="${m("email")}" autocomplete="email" dir="ltr"></div>
  <div><label>${t("phone")}</label><input name="phone" type="tel" class="${m("phone")}" autocomplete="tel" dir="ltr"></div><div><label>${t("loc")}</label><input name="location"></div>
  <div><label>${t("yrs")}</label><input name="years" type="number" min="0" max="60" inputmode="numeric"></div><div><label>${t("notice")}</label><input name="notice" type="number" min="0" inputmode="numeric"></div>
  <div><label>${t("sal")}</label><input name="salary" type="number" min="0" inputmode="numeric"></div><div><label>${t("visa")}</label><select name="visa">${T.en.visas.map((v,i)=>`<option value="${esc(v)}">${esc(t("visas")[i])}</option>`).join("")}</select></div></div>
  ${(j.knockout||[]).length?`<label>${t("qs")}</label>${j.knockout.map((q,i)=>`<div class="q ${f.bad.includes("q"+i)?"miss":""}"><span dir="auto">${esc(qOf(j,i))}</span><div class="yn"><button type="button" data-yn="${i}" data-v="Yes" class="${f.ans[i]==="Yes"?"on":""}">${t("yes")}</button><button type="button" data-yn="${i}" data-v="No" class="${f.ans[i]==="No"?"on":""}">${t("no")}</button></div></div>`).join("")}`:""}
  <label>${t("cv")} <span class="hint">${t("cvHint")}</span></label>${fileSel?`<div class="meta" id="fsel">${esc(fileSel.name)}</div>`:""}<input type="file" name="cv" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*">
  <label>${t("cvText")} <span class="hint">${t("opt")}</span></label><textarea name="cvText"></textarea>
  <label class="chk ${m("consent")}" style="font-weight:400"><input type="checkbox" name="consent"><span>${t("consent")}</span></label>
  <div id="ferr"></div><button class="btn" type="submit" ${sending?"disabled":""}>${sending?t("sending"):t("send")}</button></form></div>`}
// ---------- booking: candidate picks an interview / HR call time ----------
const DAYN={en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],ar:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]};
const MONN={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ar:["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]};
const uae=t=>{const d=new Date(t+4*3600000);return{wd:d.getUTCDay(),d:d.getUTCDate(),m:d.getUTCMonth(),h:d.getUTCHours(),mi:d.getUTCMinutes()}};
const dayTxt=t=>{const p=uae(t);return DAYN[lang][p.wd]+" "+p.d+" "+MONN[lang][p.m]};
const hourTxt=t=>{const p=uae(t),am=p.h<12;return ((p.h+11)%12+1)+":"+String(p.mi).padStart(2,"0")+" "+(lang==="ar"?(am?"ص":"م"):(am?"AM":"PM"))};
function bookHtml(){
  if(bkMsg&&!BK)return `<div class="panel">${esc(t(bkMsg))}</div>`;
  if(!BK)return `<div class="panel">${t("bkLoading")}</div>`;
  const b=BK,job=lang==="ar"&&b.jobAr?b.jobAr:b.job;
  if(state==="book"&&b.done)return `<div class="panel done"><h2>${t("bkDone")}</h2><p style="font-size:18px;margin:12px 0"><b>${esc(dayTxt(b.pick))} · ${esc(hourTxt(b.pick))}</b></p><p>${esc(t("modes")[b.mode]||b.mode)}${b.place?" · "+esc(b.place):""}</p><p class="meta">${t("bkDoneTxt")}</p></div>`;
  const groups={};b.slots.forEach(x=>{const k=dayTxt(x.t);(groups[k]=groups[k]||[]).push(x)});
  const anyFree=b.slots.some(x=>x.free&&x.t!==b.pick);
  return `<div class="panel"><div class="meta">${t("bkHi")} ${esc(b.name)}</div><h1 style="font-size:30px">${b.kind==="call"?t("bkCall"):t("bkIv")}</h1>
  <p>${t("bkFor")} <b dir="auto">${esc(job)}</b> · ${esc(t("modes")[b.mode]||b.mode)}${b.place?` · <bdi>${esc(b.place)}</bdi>`:""} · ${b.mins} ${t("bkMins")}</p>${b.note?`<p class="ad" dir="auto">${esc(b.note)}</p>`:""}
  ${b.pick?`<div class="okbox">${t("bkHave")} ${esc(dayTxt(b.pick))} · ${esc(hourTxt(b.pick))}</div><p class="meta">${t("bkChange")}</p>`:""}
  <p class="meta">${t("bkTz")}</p>
  ${anyFree?`<div class="days">${Object.keys(groups).map(k=>`<div class="dayc"><b>${esc(k)}</b><div>${groups[k].map(x=>`<button class="tm ${bkSel===x.t?"on":""}" data-tm="${x.t}" ${x.free&&x.t!==b.pick?"":"disabled"}>${esc(hourTxt(x.t))}${x.free||x.t===b.pick?"":" · "+t("taken")}</button>`).join("")}</div></div>`).join("")}</div>`:`<div class="err">${t("bkNone")}</div>`}
  <div id="ferr">${bkMsg?`<div class="err">${esc(t(bkMsg))}</div>`:""}</div>
  ${anyFree?`<button class="btn" data-a="book" ${bkSel&&!bkBusy?"":"disabled"}>${bkSel?t("bkConfirm")+" — "+esc(dayTxt(bkSel))+" · "+esc(hourTxt(bkSel)):t("bkPick")}</button>`:""}</div>`}
async function bookLoad(){ state="book";render();
  if(!HURL){const n=Date.now(),D1=864e5,base=Math.floor(n/D1)*D1+6*3600000;BK={ok:true,kind:"interview",name:"Omar",job:"Line Cook",jobAr:"طباخ خط",mins:45,mode:"In person",place:"Sharjah branch",note:"",pick:null,slots:[1,2,3].flatMap(d=>[0,3600000*2].map((h,i)=>({t:base+d*D1+h,free:!(d===2&&i===1)})))};render();return}
  let r;try{r=await (await fetch(HURL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"slot",token:bkTok})})).json()}catch(x){r={ok:false,error:"net"}}
  if(r.ok){BK=r;bkMsg="";if(r.lang==="ar"&&(()=>{try{return !localStorage.getItem("fc-lang")}catch(e){return true}})())lang="ar"}else{BK=null;bkMsg=r.error==="closed"?"bkClosed":r.error==="missing"?"bkMissing":"netErr"}
  render()}
async function bookGo(){ if(!bkSel||bkBusy)return;bkBusy=true;bkMsg="";render();
  let r;if(!HURL)r={ok:true,pick:bkSel};else{try{r=await (await fetch(HURL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"book",token:bkTok,t:bkSel})})).json()}catch(x){r={ok:false,error:"net"}}}
  bkBusy=false;
  if(r.ok){BK.pick=r.pick;BK.done=true;bkSel=null;render();window.scrollTo(0,0);return}
  bkMsg=r.error==="taken"?"bkTaken":r.error==="late"?"bkLate":r.error==="closed"?"bkClosed":"netErr";
  if(r.error==="taken"){const x=BK.slots.find(y=>y.t===bkSel);if(x)x.free=false;bkSel=null}
  render()}
function keepForm(){const F=document.getElementById("f");if(!F)return null;const o={};[...F.elements].forEach(e=>{if(e.name&&e.type!=="file")o[e.name]=e.type==="checkbox"?e.checked:e.value});return o}
function restoreForm(o){const F=document.getElementById("f");if(!F||!o)return;[...F.elements].forEach(e=>{if(e.name&&o[e.name]!==undefined&&e.type!=="file"){if(e.type==="checkbox")e.checked=o[e.name];else e.value=o[e.name]}})}
async function load(){
  if(!HURL){D=SAMPLE;render();return}
  for(let i=0;i<3;i++){if(i)await new Promise(z=>setTimeout(z,i*2000));   // busy server: try again by itself
    try{const r=await fetch(HURL+(HURL.includes("?")?"&":"?")+"jobs=1");const j=await r.json();if(!j.ok)throw 0;D=j;err="";break}catch(e){err="net"}}
  render();openFromHash()}
function openFromHash(){const m=location.hash.match(/job=([\w-]+)/);if(m&&D){const j=D.jobs.find(x=>x.id===m[1]);if(j){job=j;form={ans:[],bad:[]};state="job";render();window.scrollTo(0,0)}}}
async function readFile(file){if(!file)return null;
  if(file.size>5*1024*1024)throw "cvbig";
  const ok=/pdf|msword|wordprocessingml|^image\//.test(file.type)||/\.(pdf|docx?|jpe?g|png|webp)$/i.test(file.name);if(!ok)throw "cvtype";
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(file)});
  let type=file.type;if(!type)type=/\.pdf$/i.test(file.name)?"application/pdf":/\.docx$/i.test(file.name)?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":/\.doc$/i.test(file.name)?"application/msword":"image/jpeg";
  return {name:file.name,type,data}}
async function submit(e){e.preventDefault();if(sending)return;
  const F=document.getElementById("f"),v=n=>F.elements[n].value.trim(),bad=[];
  if(!v("name"))bad.push("name");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email")))bad.push("email");if(!/^[+\d][\d\s-]{6,}$/.test(v("phone")))bad.push("phone");
  (job.knockout||[]).forEach((q,i)=>{if(!form.ans[i])bad.push("q"+i)});if(!F.elements.consent.checked)bad.push("consent");
  const kept=keepForm();form.bad=bad;
  if(bad.length){render();restoreForm(kept);document.getElementById("ferr").innerHTML=`<div class="err">${t("need")}</div>`;const x=document.querySelector(".miss");x&&x.scrollIntoView({block:"center"});return}
  let cv=null;try{cv=await readFile(F.elements.cv.files[0]||fileSel)}catch(k){document.getElementById("ferr").innerHTML=`<div class="err">${t(String(k))}</div>`;return}
  const body={action:"apply",job:job.id,name:v("name"),email:v("email"),phone:v("phone"),location:v("location"),years:v("years"),notice:v("notice"),salary:v("salary"),visa:F.elements.visa.value,
    cvText:v("cvText"),answers:form.ans,consent:true,website:F.elements.website.value,lang,source:"Careers page"+(document.referrer?"":""),cv};
  if(!HURL){ref="PREVIEW";state="done";render();window.scrollTo(0,0);return}
  sending=true;render();restoreForm(kept);
  // When many people apply at once the server can be briefly busy: try again by itself (after 3 s, then 6 s).
  let r;for(let i=0;i<3;i++){if(i)await new Promise(z=>setTimeout(z,i*3000));
    try{r=await (await fetch(HURL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})).json()}catch(x){r={ok:false,error:"net"}}
    if(i&&r.error==="again")r={ok:true,ref:""};                          // an earlier try did arrive
    if(r.ok||!["net","server"].includes(r.error))break}
  sending=false;
  if(r.ok){ref=r.ref||"";state="done";render();window.scrollTo(0,0);return}
  form.bad=r.fields||[];render();restoreForm(kept);
  document.getElementById("ferr").innerHTML=`<div class="err">${t(r.error==="net"?"netErr":["need","again","closed","cvbig","cvtype","busy"].includes(r.error)?r.error:"netErr")}</div>`}
document.addEventListener("click",e=>{
  const l=e.target.closest("#lang");if(l){const kept=keepForm();lang=lang==="ar"?"en":"ar";try{localStorage.setItem("fc-lang",lang)}catch(x){}render();restoreForm(kept);return}
  const j=e.target.closest("[data-job]");if(j){job=D.jobs.find(x=>x.id===j.dataset.job);form={ans:[],bad:[]};fileSel=null;state="job";history.replaceState(null,"","#job="+job.id);render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-a]");if(a){if(a.dataset.a==="book"){bookGo();return}if(a.dataset.a==="back"||a.dataset.a==="more"){state="list";job=null;history.replaceState(null,"",location.pathname);render();window.scrollTo(0,0)}return}
  const tm=e.target.closest("[data-tm]");if(tm){bkSel=+tm.dataset.tm;bkMsg="";render();return}
  const y=e.target.closest("[data-yn]");if(y){const kept=keepForm();form.ans[+y.dataset.yn]=y.dataset.v;form.bad=form.bad.filter(b=>b!=="q"+y.dataset.yn);render();restoreForm(kept)}});
document.addEventListener("submit",e=>{if(e.target.id==="f")submit(e)});
document.addEventListener("change",e=>{if(e.target.name==="cv"){fileSel=e.target.files[0]||null}});
{const m=location.hash.match(/book=([A-Za-z0-9-]{20,60})/);if(m){bkTok=m[1];bookLoad()}else{render();load()}}
</script>
</body>
