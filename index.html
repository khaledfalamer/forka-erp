<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Forka Apps</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without holding up the page; the system font shows for a moment if they are slow -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --fk-charcoal:#23211f;--fk-charcoal-dark:#171513;--fk-charcoal-soft:#3a3631;
  --fk-paper:#f6f3ee;--fk-card:#fffdf9;--fk-line:#e5dfd5;
  --fk-bronze:#9a6b3f;--fk-bronze-hover:#86592f;--fk-bronze-light:#b8875a;--fk-bronze-soft:#e9dccb;
  --fk-text:#23211f;--fk-text-2:#5c5852;--fk-muted:#8d877e;
  --fk-success:#4f7a3a;--fk-success-bg:#eef3e8;--fk-warning:#a8731c;--fk-warning-bg:#fbf2e2;
  --fk-danger:#a33a2c;--fk-danger-bg:#f8e9e5;--fk-info:#3e5c8a;--fk-info-bg:#eaeff6;
  --fk-radius:14px;--fk-radius-sm:10px;
  --fk-sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;
  --fk-serif:'EB Garamond','IBM Plex Sans Arabic',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fk-sans);background:var(--fk-paper);color:var(--fk-text);font-size:14px;line-height:1.45;min-height:100vh}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
h1,h2,h3{font-family:var(--fk-serif);font-weight:600;margin:0}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:'IBM Plex Sans Arabic',serif}
button,input,select,textarea{font-family:inherit;font-size:14px}
.btn{border:1px solid var(--fk-line);background:var(--fk-card);color:var(--fk-text);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--fk-bronze-light)}
.btn.pri{background:var(--fk-bronze);border-color:var(--fk-bronze);color:#fff;box-shadow:0 3px 0 var(--fk-bronze-hover)}
.btn.pri:hover{background:var(--fk-bronze-hover)}
.btn.dan{color:var(--fk-danger);border-color:#e6c4bd}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{border:0;background:none;color:var(--fk-bronze);cursor:pointer;font-weight:600;padding:4px;text-decoration:underline}
input[type=text],input[type=email],input[type=password],select,textarea{border:1px solid var(--fk-line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--fk-text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--fk-bronze-soft);border-color:var(--fk-bronze-light)}
.miss{border-color:var(--fk-danger)!important;background:var(--fk-danger-bg)!important}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fk-text-2);font-weight:600}
/* sign in */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;background:radial-gradient(900px 500px at 50% 25%,rgba(184,135,90,.2),transparent 65%),radial-gradient(circle at 50% 30%,#2a2724,#141210);color:#fff;position:relative}
.gate .brand-sub:before,.gate .brand-sub:after{content:"";display:inline-block;width:34px;height:1px;background:rgba(199,154,107,.6);vertical-align:middle;margin:0 14px}
.gate .lang{position:absolute;top:16px;right:18px}
.lang{direction:ltr}
.top{direction:ltr}
.top .me .txt{text-align:left}
.brand{font-family:var(--fk-serif);font-weight:600;font-size:72px;letter-spacing:14px;text-transform:uppercase;line-height:1}
.brand-sub{color:#d6b58d;letter-spacing:6px;text-transform:uppercase;font-size:20px;margin-top:10px;font-weight:600}
.gcard{margin-top:38px;border:1px solid rgba(199,154,107,.35);background:var(--fk-card);color:var(--fk-text);border-radius:18px;padding:26px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.gcard h2{font-size:24px}
.gcard p{margin:0;color:var(--fk-text-2)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #dadce0;background:#fff;border-radius:10px;padding:11px;font-weight:600;cursor:pointer;min-height:46px;color:#3c4043}
.gbtn:hover{background:#f8f9fa}
.plink{margin-top:18px;color:#cbbfae;font-size:12px;text-decoration:underline}
.gbox{min-height:44px;display:flex;justify-content:center}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--fk-muted);font-size:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--fk-line)}
.note{font-size:12px;color:var(--fk-muted)}
.prev{background:var(--fk-warning-bg);color:var(--fk-warning);border-radius:10px;padding:8px 10px;font-size:12px}
.err{background:var(--fk-danger-bg);color:var(--fk-danger);border-radius:10px;padding:9px 11px;font-size:13px}
.ok{background:var(--fk-success-bg);color:var(--fk-success);border-radius:10px;padding:9px 11px;font-size:13px}
/* top */
.top{background:rgba(253,251,247,.92);backdrop-filter:blur(10px);color:var(--fk-text);padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:6;border-bottom:1px solid #eadfce}
.logo{font-family:var(--fk-serif);font-weight:600;font-size:22px;letter-spacing:5px;text-transform:uppercase;white-space:nowrap;cursor:pointer;color:var(--fk-charcoal)}
.top .sub{color:var(--fk-bronze);font-size:11px;letter-spacing:3px;text-transform:uppercase;padding-inline-start:14px;border-inline-start:1px solid #e0cfb8}
.sp{flex:1}
.lang{display:flex;gap:3px;background:#f1ebe2;border-radius:999px;padding:3px;border:1px solid #e6dccd}
.lang button{border:0;background:none;color:var(--fk-text-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600}
.lang button.on{background:linear-gradient(135deg,#c79a6b,#9a6b3f);color:#fff}
.gate .lang{background:rgba(255,255,255,.07);border-color:rgba(184,135,90,.25)}.gate .lang button{color:#d9d3c9}.gate .lang button.on{color:#fff}
.me{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#c79a6b,#86592f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;box-shadow:0 0 0 3px #f3e7d6}
.me .nm{font-weight:600;font-size:13px;line-height:1.2}
.me .lv{color:var(--fk-bronze);font-size:11px;letter-spacing:.5px}
.top .btn{background:#fff;color:var(--fk-text);border-color:#e6dccd;box-shadow:none}
.top .btn:hover{border-color:#c79a6b}
.page{padding:22px 28px 70px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.page.lift{margin-top:-40px;position:relative}
/* hero */
.hero{background:radial-gradient(700px 320px at 8% 0%,rgba(214,170,120,.32),transparent 70%),radial-gradient(640px 300px at 92% 8%,rgba(120,170,160,.22),transparent 70%),radial-gradient(600px 260px at 55% 110%,rgba(160,130,170,.14),transparent 70%),linear-gradient(180deg,#fbf6ee 0%,#f7f0e6 60%,var(--fk-paper) 100%);color:var(--fk-text);padding:40px 28px 70px}
.hero-in{max-width:1200px;margin:0 auto}
.hero .date{color:var(--fk-bronze);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700}
.hero h1{font-size:44px;margin-top:8px;letter-spacing:.3px;color:var(--fk-charcoal)}
.hero p{color:var(--fk-text-2);margin:6px 0 0;font-size:15px}
.card{background:var(--fk-card);border:1px solid var(--fk-line);border-radius:var(--fk-radius);padding:18px}
/* ceo box */
.ceo{margin-top:26px;background:rgba(255,255,255,.82);border:1px solid #eadfce;border-radius:20px;padding:20px;color:var(--fk-text);box-shadow:0 18px 40px -28px rgba(120,80,40,.45);backdrop-filter:blur(6px)}
.ceo .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ceo .hd h3{font-size:20px}
.tag{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:#f6ead9;color:#86592f;border:1px solid #ead6b9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{--k:#a8703d;background:linear-gradient(180deg,#fff,#fbf8f3);padding:14px 16px;border-radius:14px;border:1px solid #efe6d9;border-top:3px solid var(--k)}
.kpi .v{font-family:var(--fk-serif);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--k)}
.kpi .l{color:var(--fk-text-2);font-size:12px;margin-top:2px}
.kpi.warn{background:linear-gradient(180deg,#fff8ee,#fdf1e2)}
.grp{color:var(--fk-bronze);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin:16px 0 8px}
/* apps */
.sec h2{font-family:var(--fk-sans);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--fk-bronze);margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sec h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(154,107,63,.4),transparent)}
[dir=rtl] .sec h2:after{background:linear-gradient(270deg,rgba(154,107,63,.4),transparent)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.app{--c:#a8703d;background:radial-gradient(420px 160px at 100% 0%,color-mix(in srgb,var(--c) 12%,transparent),transparent 70%),linear-gradient(170deg,#fff,#fdfaf5);border:1px solid #ebe1d3;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:start;color:inherit;position:relative;min-height:210px;overflow:hidden;box-shadow:0 14px 34px -26px rgba(60,40,20,.5);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.app:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff))}
.app:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:0 24px 44px -26px color-mix(in srgb,var(--c) 70%,#000)}
.app.off{cursor:default;background:#f7f3ed;box-shadow:none}.app.off:before{background:#e3dbd0}
.app.off:hover{transform:none;box-shadow:none;border-color:#ebe1d3}
.app.off .ic{background:#e3dbd0;color:#fff;box-shadow:none}
.app.off h3,.app.off p{color:var(--fk-muted)}
.ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000));color:#fff;box-shadow:0 10px 20px -10px var(--c),inset 0 1px 0 rgba(255,255,255,.35);margin-bottom:6px}
.ic svg{width:27px;height:27px}
.app h3{font-size:23px;color:var(--fk-charcoal)}
.app p{margin:0;color:var(--fk-text-2);font-size:13.5px;line-height:1.5}
.app .meta{font-size:12px;color:var(--c);font-weight:700}
.app .go{margin-top:auto;padding-top:10px;font-size:13px;font-weight:700;color:var(--c);letter-spacing:.3px;opacity:.8;transition:opacity .18s}
.app .go i{font-style:normal;display:inline-block;transition:transform .18s}
[dir=rtl] .app .go i{transform:scaleX(-1)}
.app:hover .go{opacity:1}.app:hover .go i{transform:translateX(4px)}
[dir=rtl] .app:hover .go i{transform:scaleX(-1) translateX(4px)}
.badge{position:absolute;top:18px;inset-inline-end:18px;background:var(--fk-danger);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px}
.soon{font-size:11px;font-weight:600;color:var(--fk-muted);background:#fff;border:1px solid var(--fk-line);border-radius:999px;padding:3px 10px;align-self:flex-start}
.soon.gold{color:color-mix(in srgb,var(--c) 85%,#000);background:color-mix(in srgb,var(--c) 12%,#fff);border-color:transparent}
.empty-apps{background:var(--fk-card);border:1px dashed var(--fk-line);border-radius:18px;padding:26px;color:var(--fk-muted);text-align:center}
/* people */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:28px}
.back{border:0;background:none;color:var(--fk-text-2);cursor:pointer;font-weight:600;padding:6px 0;align-self:flex-start}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.req{border:1px solid #ecd9b8;background:var(--fk-warning-bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.req .who{font-weight:700}
.req .em{color:var(--fk-text-2);font-size:13px}
.req .why{font-size:13px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--fk-muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--fk-line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--fk-line);vertical-align:middle;overflow-wrap:anywhere}
.tw{overflow-x:auto}
.tbl .mst{display:none}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fbf8f3}
.pill{display:inline-block;border-radius:999px;font-size:12px;font-weight:600;padding:3px 10px;white-space:nowrap}
.p-active{background:var(--fk-success-bg);color:var(--fk-success)}
.p-pending{background:var(--fk-warning-bg);color:var(--fk-warning)}
.p-blocked{background:var(--fk-danger-bg);color:var(--fk-danger)}
.p-lv{background:var(--fk-bronze-soft);color:var(--fk-bronze-hover)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--fk-paper);border:1px solid var(--fk-line);border-radius:8px;padding:2px 8px}
.sm-t{font-size:12px;color:var(--fk-muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{width:240px}
.filters select{width:160px}
.nw{white-space:nowrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(23,21,19,.55);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:30px 14px;overflow:auto}
.md{background:var(--fk-card);border-radius:16px;width:100%;max-width:620px;padding:22px;display:flex;flex-direction:column;gap:14px}
.md h2{font-size:24px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--fk-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box .t{font-weight:700;font-size:13px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--fk-bronze)}
.subs{display:flex;flex-wrap:wrap;gap:6px 16px;padding-inline-start:26px}
.seg{display:flex;gap:4px;background:var(--fk-paper);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--fk-text-2)}
.seg button.on{background:#fff;color:var(--fk-text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acts .sp{flex:1}
/* activity */
.log{display:flex;flex-direction:column}
.log .it{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--fk-line);align-items:flex-start}
.log .it:last-child{border-bottom:0}
.log .tm{color:var(--fk-muted);font-size:12px;min-width:120px}
.log .tx b{font-weight:600}
.empty{color:var(--fk-muted);padding:16px 0;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fk-charcoal);color:#fff;border-radius:10px;padding:10px 16px;z-index:30;font-weight:600}
@media (max-width:720px){
  .top{padding:10px 14px}.page{padding:16px 14px 50px}
  .g2{grid-template-columns:1fr}
  .brand{font-size:52px;letter-spacing:9px}.brand-sub{font-size:16px;letter-spacing:4px}
  .tbl .hm{display:none}
  .tbl th,.tbl td{padding:9px 6px}
  .tbl .mst{display:block;margin-top:6px}.tbl .dst{display:none}
  .filters,.filters input,.filters select{max-width:none;width:100%}
  .bar h1{font-size:24px}
  .me .txt{display:none}
  .top{flex-wrap:nowrap;gap:10px;padding:10px 14px}.top .sub{display:none}.logo{font-size:19px;letter-spacing:3px}
  .hero{padding:26px 14px 56px}.hero h1{font-size:32px}.page.lift{margin-top:-34px}
  .kpi .v{font-size:28px}.app{min-height:0}
  .top .btn{padding:5px 9px}
}
</style>
</head>

<script>
'use strict';
const CFG=window.FORKA_APPS||{};
const LIVE=!!(CFG.ACCOUNTS_URL&&CFG.GOOGLE_CLIENT_ID);
/* ---------- settings ---------- */
const PROCUREMENT_URL='https://procurement.forka.com/';

  act:'<path d="M3 12.5h4l2.6-7 4.6 14 2.6-7H21"/>'};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>';
const SEED=[
  {email:'ceo@forka.com',name:'Khaled Alamer',title:'CEO',level:'ceo',status:'active',apps:{proc:1,hire:1,branch:1},sides:['plan','ops','fin','dept','ceo']},
  {email:'abu.ali@forka.com',name:'Mohammad Abu Ali',title:'Operations Manager',level:'manager',status:'pending',apps:{proc:1,hire:1,branch:1},sides:['ops']},

  {email:'arman@kuwaitikitchen.com',name:'Arman',title:'Operations',level:'staff',status:'pending',apps:{proc:1,hire:0,branch:0},sides:['ops']},
  {email:'tahani@forka.com',name:'Tahani Alamer',title:'',level:'manager',status:'pending',apps:{proc:1,hire:1,branch:1},sides:['dept']},
  {email:'jennifer@forka.com',name:'Jennifer Tudara',title:'HR',level:'manager',status:'pending',apps:{proc:0,hire:1,branch:0},sides:[]},
  {email:'admin@forka.com',name:'Ruby Ann Margate',title:'Admin',level:'staff',status:'pending',apps:{proc:1,hire:1,branch:0},sides:['dept']},
  {email:'hr@kuwaitikitchen.com',name:'HR Officer (Kuwaiti Kitchen)',title:'HR',level:'staff',status:'pending',apps:{proc:0,hire:1,branch:0},sides:[]},
  {email:'operations@kuwaitikitchen.com',name:'Operations (Kuwaiti Kitchen)',title:'Operations',level:'staff',status:'pending',apps:{proc:1,hire:0,branch:1},sides:['ops']}
];

/* ---------- storage (Claude preview db, or memory) ---------- */
let db=null;const DATA={people:{},requests:{},activity:{}};
function put(coll,id,obj){DATA[coll][id]=obj;if(db){try{db.collection(coll).doc(id).set(obj).catch(()=>{})}catch(_){}}}
const key=e=>String(e||'').trim().toLowerCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function log(by,verb,target,extra){const id=uid();put('activity',id,{at:new Date().toISOString(),by:by||'',verb,target:target||'',extra:extra||''})}
function seed(){SEED.forEach(p=>put('people',key(p.email),Object.assign({method:'google',addedBy:'Sheet',at:new Date().toISOString()},p,{email:key(p.email)})))}

const P=()=>DATA.people;
// An active CEO opens every app and every section automatically (the server does the same).
const ceoAll=p=>p&&p.level==='ceo'&&p.status==='active'?Object.assign({},p,{apps:Object.fromEntries(APPS.map(a=>[a.id,1])),sides:SIDES.slice()}):p;
const person=id=>ceoAll(P()[id]);
const isCeo=p=>p&&p.level==='ceo'&&p.status==='active';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const lvName=l=>t(l+'Lv');
const fmtT=iso=>{try{return new Date(iso).toLocaleString(lang==='ar'?'ar':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(_){return iso}};
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

/* ---------- sign in ---------- */
function signInEmail(email){
  const e=key(email);if(!validEmail(e)){gate.err=t('badMail');render();return}
  gate.email=e;gate.err='';const p=person(e);
  if(p){
    if(p.status==='active'){doSignIn(e);return}
    gate.step=p.status==='blocked'?'blocked':'pending';render();return}
  const r=DATA.requests[e];
  if(r&&r.state==='waiting'){gate.step='waiting';render();return}
  if(r&&r.state==='rejected'){gate.step='rejected';render();return}
  gate.step='request';render()}
function signInPin(pin){
  const v=String(pin||'').trim();
  const p=Object.values(P()).find(x=>x.method==='pin'&&x.pin&&x.pin===v&&x.status==='active');
  if(!p){gate.pinErr=t('badPin');render();return}
  doSignIn(p.email)}
function doSignIn(id){me=id;try{sessionStorage.setItem('fa-me',id)}catch(_){}log(id,'signin');view='home';gate={step:'start',email:'',err:'',pinErr:''};render()}
function signOut(){if(me)log(me,'signout');me=null;try{sessionStorage.removeItem('fa-me')}catch(_){}view='gate';modal=null;render()}
function sendRequest(f){
  const name=f.name.value.trim(),title=f.title.value.trim(),why=f.why.value.trim();
  gate.rq={name:f.name.value,title:f.title.value,why:f.why.value,bad:[!name&&'name',!why&&'why'].filter(Boolean)};
  if(!name||!why){gate.err=t('need');render();return}
  put('requests',gate.email,{email:gate.email,name,title,why,at:new Date().toISOString(),state:'waiting'});
  log(gate.email,'req','','');gate.step='waiting';gate.err='';gate.rq=null;render()}

/* ---------- people actions ---------- */
function openPerson(id,fromReq){
  const base=id&&person(id)?JSON.parse(JSON.stringify(person(id))):{email:'',name:'',title:'',level:'staff',status:'active',apps:{proc:0,hire:0,branch:0},sides:[],method:'google'};
  if(fromReq){const r=DATA.requests[fromReq];base.email=r.email;base.name=r.name;base.title=r.title||'';base.status='active'}
  base.pinNew='';modal={kind:'person',id:id||null,fromReq:fromReq||null,draft:base,err:''};render()}
function readDraft(){
  const d=modal.draft,m=document.getElementById('pm');if(!m)return d;
  ['name','title','email','pinNew'].forEach(k=>{const el=m.querySelector('[data-k="'+k+'"]');if(el)d[k]=el.value});
  return d}
function savePerson(){
  const d=readDraft();const errs=[];
  d.email=key(d.email);d.name=d.name.trim();
  const isNew=!modal.id;
  if(!d.name)errs.push('name');
  if(d.method==='google'&&!validEmail(d.email))errs.push('email');
  if(d.method==='pin'&&!d.email)d.email='pin-'+uid();
  if(isNew&&person(d.email))return modalErr(t('dupe'),['email']);
  if(d.method==='pin'){
    const pn=String(d.pinNew||'').trim();
    if(pn&&!/^\d{4,8}$/.test(pn))return modalErr(t('pinBad'),['pinNew']);
    if(!pn&&!(modal.id&&person(modal.id).pin))return modalErr(t('pinBad'),['pinNew']);
    if(pn&&Object.values(P()).some(x=>x.pin===pn&&x.email!==(modal.id||d.email)))return modalErr(t('pinDupe'),['pinNew']);
    if(pn)d.pin=pn}
  if(errs.length)return modalErr(t('need'),errs);
  // keep one active CEO
  if(modal.id){const old=person(modal.id);if(isCeo(old)&&!(d.level==='ceo'&&d.status==='active')&&Object.values(P()).filter(isCeo).length<2)return modalErr(t('lastCeo'),[])}
  if(!d.apps.proc)d.sides=[];
  const id=modal.id||d.email;const old=modal.id?person(modal.id):null;
  delete d.pinNew;d.updatedBy=me;d.updatedAt=new Date().toISOString();
  if(isNew){d.addedBy=me;d.at=d.updatedAt}
  put('people',id,d);
  if(modal.fromReq){const r=DATA.requests[modal.fromReq];put('requests',modal.fromReq,Object.assign({},r,{state:'approved',decidedBy:me,decidedAt:d.updatedAt}));log(me,'allow',id)}
  else if(isNew)log(me,'add',id);
  else log(me,'edit',id,diff(old,d));
  modal=null;toast(t('saved'));render()}
function diff(a,b){const out=[];if(!a)return '';
  if(a.level!==b.level)out.push(lvName(a.level)+' > '+lvName(b.level));
  if(a.status!==b.status)out.push(t('st_'+a.status)+' > '+t('st_'+b.status));
  APPS.forEach(x=>{if(!!a.apps[x.id]!==!!b.apps[x.id])out.push((b.apps[x.id]?'+ ':'- ')+t('a_'+x.id))});
  SIDES.forEach(s=>{const h1=(a.sides||[]).includes(s),h2=(b.sides||[]).includes(s);if(h1!==h2)out.push((h2?'+ ':'- ')+t('s_'+s))});
  if(a.method!==b.method)out.push(t('m_'+b.method));
  return out.join(', ')}
function modalErr(msg,fields){modal.err=msg;modal.bad=fields;render()}
function setStatus(id,st){const p=person(id);if(!p)return;
  if(isCeo(p)&&st!=='active'&&Object.values(P()).filter(isCeo).length<2){toast(t('lastCeo'));return}
  put('people',id,Object.assign({},p,{status:st,updatedBy:me,updatedAt:new Date().toISOString()}));
  log(me,st==='active'?(p.status==='blocked'?'unblock':'confirm'):'block',id);render()}
function rejectReq(id,reason){const r=DATA.requests[id];
  put('requests',id,Object.assign({},r,{state:'rejected',reason:reason||'',decidedBy:me,decidedAt:new Date().toISOString()}));
  log(me,'reject',id,reason||'');modal=null;render()}
function canOpen(a,p){return !!a.url&&!!p.apps[a.id]&&(!a.ceoOnlyUntilMoved||isCeo(p))}
function openApp(a){const p=person(me);if(!canOpen(a,p))return;log(me,'open','',t('a_'+a.id));try{window.open(a.url,'_blank','noopener')}catch(_){}}
function toast(m){toastMsg=m;render();setTimeout(()=>{toastMsg='';const el=document.querySelector('.toast');if(el)el.remove()},1800)}

/* ---------- counts for CEO box ---------- */
function stats(){
  const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const A=Object.values(DATA.activity);const at=x=>new Date(x.at).getTime();
  const td=A.filter(x=>at(x)>=d0),mo=A.filter(x=>at(x)>=m0);
  return{
    sign:td.filter(x=>x.verb==='signin').length,
    act:td.filter(x=>!['signin','signout'].includes(x.verb)).length,
    wait:Object.values(DATA.requests).filter(r=>r.state==='waiting').length,
    conf:Object.values(P()).filter(p=>p.status==='pending').length,
    active:Object.values(P()).filter(p=>p.status==='active').length,
    open:mo.filter(x=>x.verb==='open').length,
    chg:mo.filter(x=>['allow','reject','add','edit','confirm','block','unblock'].includes(x.verb)).length}}

function vGate(){
  let body='';const g=gate;
  if(g.step==='start')body='<h2>'+t('signin')+'</h2><p>'+t('signinTxt')+'</p>'+
    (LIVE?'<div id="gbtn" class="gbox"><div class="note">'+t('gWait')+'</div></div>'+(g.err?'<div class="err">'+esc(g.err)+'</div>':''):'<button class="gbtn" data-a="g-open">'+G_ICON+'<span>'+t('google')+'</span></button>')+

document.addEventListener('click',e=>{
  const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;try{localStorage.setItem('fa-lang',lang)}catch(_){}render();return}
  const ap=e.target.closest('[data-app]');if(ap){openApp(APPS.find(a=>a.id===ap.dataset.app));return}
  const b=e.target.closest('[data-a]');
  if(!b){const r=e.target.closest('tr.row');if(r&&!e.target.closest('button'))openPerson(r.dataset.pid);
    else if(e.target.classList&&e.target.classList.contains('ov')){modal=null;render()}return}
  const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  if(modal&&modal.kind==='person'&&a.startsWith('d-'))readDraft();
  switch(a){
    case 'g-open':gate.step='pick';gate.err='';break;
    case 'g-pin':gate.step='pin';gate.pinErr='';break;
    case 'g-start':gate={step:'start',email:'',err:'',pinErr:'',rq:null,typed:''};break;
    case 'g-go':{const s=document.getElementById('gpick').value,o=document.getElementById('gmail').value;signInEmail(o.trim()||s);return}
    case 'p-go':signInPin(document.getElementById('gpin').value);return;
    case 'r-send':sendRequest(document.getElementById('rq'));return;
    case 'out':signOut();return;
    case 'home':view='home';modal=null;break;
    case 'v-people':view='people';break;
    case 'v-act':view='activity';break;
    case 'p-add':openPerson(null);return;
    case 'p-confirm':setStatus(id,'active');return;
    case 'r-allow':openPerson(null,id);return;
    case 'r-rej':modal={kind:'reject',id};break;
    case 'r-rejgo':rejectReq(modal.id,document.getElementById('rjw').value.trim());return;
    case 'm-close':modal=null;break;
    case 'p-save':savePerson();return;
    case 'd-method':modal.draft.method=v;break;
    case 'd-level':modal.draft.level=v;break;
    case 'd-status':modal.draft.status=v;break;
    case 'd-app':modal.draft.apps[v]=b.checked?1:0;if(v==='proc'&&b.checked&&!(modal.draft.sides||[]).length)modal.draft.sides=['dept'];break;
    case 'd-side':{const s=new Set(modal.draft.sides||[]);b.checked?s.add(v):s.delete(v);modal.draft.sides=SIDES.filter(x=>s.has(x));break}
    case 'd-block':{const pid=modal.id;modal=null;setStatus(pid,'blocked');return}
    case 'reset':modal={kind:'reset'};break;
    case 'reset-go':resetAll();return;
  }
  render()});

if(CFG.PROCUREMENT_URL)APPS[0].url=CFG.PROCUREMENT_URL;

if(CFG.HIRING_URL){const h=APPS.find(x=>x.id==='hire');h.url=new URL('hiring/',location.href).href;delete h.ceoOnlyUntilMoved}
let TOKEN='',ID_TOKEN='',gReady=false;
async function api(action,payload){
  try{const r=await fetch(CFG.ACCOUNTS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOKEN},payload||{}))});return await r.json()}
  catch(e){return {ok:false,error:'net'}}}
/* The last answer is kept in this browser so the page opens at once next time;
   the server is asked in the background and only a change redraws the page. */
let VER='';
function keepBundle(b){try{const c=Object.assign({},b);delete c.token;delete c.same;localStorage.setItem('fa-cache',JSON.stringify(c))}catch(_){}}
function cachedBundle(){try{const c=JSON.parse(localStorage.getItem('fa-cache')||'null');return c&&c.me&&c.me.email?c:null}catch(_){return null}}
// Wake the Hiring and Procurement servers in the background while the person looks at the tiles,
// so the app they open does not wait for a sleeping server (the first call after a quiet spell can take 5-10 seconds).
let woke=false;function wakeApps(m){if(woke||!m||m.status!=='active')return;woke=true;const a=m.apps||{};
  [a.hire&&CFG.HIRING_URL,a.proc&&CFG.PROCUREMENT_SERVER].forEach(u=>{if(u)try{fetch(u,{method:'GET',mode:'no-cors'}).catch(()=>{})}catch(_){}})}
function applyBundle(b){
  if(b.token){TOKEN=b.token;try{localStorage.setItem('fa-token',TOKEN)}catch(_){}}
  if(b.ver)VER=b.ver;if(!b.fromCache)keepBundle(b);wakeApps(b.me);
  const P0={};(b.people||[b.me]).forEach(p=>{P0[p.email]=p});P0[b.me.email]=b.me;DATA.people=P0;
  const R0={};(b.requests||[]).forEach(r=>{R0[r.email]=r});DATA.requests=R0;
  const A0={};(b.activity||[]).forEach((a,i)=>{A0['a'+i]=a});DATA.activity=A0;
  me=b.me.email}
function sessionGone(msg){TOKEN='';VER='';try{localStorage.removeItem('fa-token');localStorage.removeItem('fa-cache')}catch(_){}me=null;view='gate';modal=null;gate={step:'start',email:'',err:msg||'',pinErr:''};render()}
const errText=e=>e==='net'?t('netErr'):e==='noclient'?t('noClient'):e==='need'?t('need'):e==='dupe'?t('dupe'):e==='pinBad'?t('pinBad'):e==='pinDupe'?t('pinDupe'):e==='lastCeo'?t('lastCeo'):e==='pin'?t('badPin'):e==='locked'?t('badPin'):e==='session'?t('sessionEnd'):String(e||'');
function drawGoogle(){
  const el=document.getElementById('gbtn');if(!el)return;
  const go=()=>{try{google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:onGoogle,ux_mode:'popup',auto_select:false});
    el.innerHTML='';google.accounts.id.renderButton(el,{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:300,locale:lang==='ar'?'ar':'en'})}catch(e){el.innerHTML='<div class="err">'+t('noClient')+'</div>'}};
  if(window.google&&google.accounts&&google.accounts.id){go();return}
  if(!gReady){gReady=true;const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=()=>{const e2=document.getElementById('gbtn');if(e2)go()};document.head.appendChild(sc)}}
async function onGoogle(resp){
  ID_TOKEN=resp.credential;gate={step:'busy',email:'',err:'',pinErr:''};render();
  const r=await api('google',{idToken:ID_TOKEN});
  if(r.ok){applyBundle(r);view='home';gate={step:'start',email:'',err:'',pinErr:''};render();return}
  if(r.status){gate={step:r.status==='unknown'?'request':r.status,email:r.email||'',err:'',pinErr:'',rq:{name:r.name||'',title:'',why:'',bad:[]}};
    if(r.status==='rejected')DATA.requests[r.email]={email:r.email,state:'rejected',reason:r.reason||''};render();return}
  gate={step:'start',email:'',err:errText(r.error),pinErr:''};render()}
if(LIVE){
  signInPin=async function(pin){const v=String(pin||'').trim();gate.pinErr='';gate.step='busy';render();
    const r=await api('pin',{pin:v});
    if(r.ok){applyBundle(r);view='home';gate={step:'start',email:'',err:'',pinErr:''};render();return}
    gate.step='pin';gate.pinErr=errText(r.error);render()};
  sendRequest=async function(f){
    const name=f.name.value.trim(),title=f.title.value.trim(),why=f.why.value.trim();
    gate.rq={name:f.name.value,title:f.title.value,why:f.why.value,bad:[!name&&'name',!why&&'why'].filter(Boolean)};
    if(!name||!why){gate.err=t('need');render();return}
    const r=await api('request',{idToken:ID_TOKEN,name,title,why});
    if(r.ok){gate.step='waiting';gate.err='';gate.rq=null;render();return}
    gate.err=errText(r.error);render()};
  signOut=function(){api('signout');sessionGone('')};
  savePerson=async function(){
    const d=readDraft();const id=modal.id,fromReq=modal.fromReq;
    const errs=[];if(!String(d.name||'').trim())errs.push('name');if(d.method==='google'&&!validEmail(key(d.email)))errs.push('email');
    if(errs.length)return modalErr(t('need'),errs);
    const r=await api('savePerson',{id:id||'',fromReq:fromReq||'',person:{email:key(d.email),name:d.name,title:d.title,level:d.level,status:d.status,apps:d.apps,sides:d.sides,method:d.method,pinNew:d.pinNew||''}});
    if(r.ok){applyBundle(r);modal=null;toast(t('saved'));render();return}
    if(r.error==='session')return sessionGone(t('sessionEnd'));
    modalErr(errText(r.error),r.error==='need'?(r.fields||[]):r.error==='dupe'?['email']:/^pin/.test(r.error)?['pinNew']:[])};
  setStatus=async function(id,st){const r=await api('setStatus',{id,status:st});
    if(r.ok){applyBundle(r);render();return}if(r.error==='session')return sessionGone(t('sessionEnd'));toast(errText(r.error))};
  rejectReq=async function(id,reason){const r=await api('reject',{id,reason});
    if(r.ok){applyBundle(r);modal=null;render();return}if(r.error==='session')return sessionGone(t('sessionEnd'));toast(errText(r.error))};
  openApp=function(a){const p=person(me);if(!canOpen(a,p))return;const u=a.id==='proc'?a.url+'#erp='+encodeURIComponent(TOKEN):a.url;try{window.open(u,'_blank','noopener')}catch(_){}api('open',{app:a.id})};
}
(async()=>{
  if(LIVE){
    let tok='';try{tok=localStorage.getItem('fa-token')||''}catch(_){}
    const refresh=async()=>{
      const r=await api('me',{ver:VER});
      if(r.ok){if(r.same){if(r.me&&me&&r.me.status!=='active')sessionGone('');return}
        const ae=document.activeElement;applyBundle(r);if(view==='gate')view='home';gate.step='start';
        if(modal||(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')))return;render();return}
      if(r.error==='session')sessionGone(view==='gate'?'':t('sessionEnd'));
      else if(view==='gate'&&gate.step==='busy'){gate.step='start';gate.err=errText(r.error);render()}};
    if(tok){TOKEN=tok;const c=cachedBundle();
      if(c){applyBundle(Object.assign(c,{fromCache:true}));VER=c.ver||'';view='home';render()}   // open at once from the last visit
      else{gate.step='busy';render()}
      refresh()}
    else{render();
      // wake the accounts server while the person reaches for the Google button
      try{fetch(CFG.ACCOUNTS_URL,{method:'GET'}).catch(()=>{})}catch(_){}}
    setInterval(()=>{if(!me||document.hidden||modal)return;refresh()},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&!modal)refresh()});
    return}
  render();
  try{
    let C=window.claude;for(let i=0;i<20&&!(C&&C.use);i++){await new Promise(r=>setTimeout(r,100));C=window.claude}
    db=C&&C.use?await C.use('db'):null}catch(_){db=null}
  if(!db){seed();render();return}
  let first=true;
  ['people','requests','activity'].forEach(c=>db.collection(c).onSnapshot(sn=>{
    const o={};sn.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});DATA[c]=o;
    if(c==='people'&&first&&!sn.metadata.fromCache){first=false;if(!Object.keys(o).length)seed()}
    const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&!modal)return;
    if(modal)return;render()},()=>{}));
})();
</script>
