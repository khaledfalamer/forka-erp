<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forka Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#23211f;--charcoal-2:#171513;--paper:#f6f3ee;--bronze:#9a6b3f;--bronze-l:#b8875a;--bronze-soft:#e9dccb;
  --ok:#4f7a3a;--warn:#e0a23a;--bad:#b8432f;
  --sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;--serif:'EB Garamond',Georgia,serif;
}
/* Dark theme (charcoal). Light theme (paper) below. Colours that sit on the board background use --on. */
.board{--list:#1c1a18;--card:#2c2926;--card-h:#363230;--line:#3b3631;--text:#f3eee6;--muted:#a9a196;--on:#f3eee6;
  --hover:rgba(255,255,255,.14);--soft:rgba(255,255,255,.07);--pill:rgba(255,255,255,.14);--barbg:rgba(0,0,0,.28);--notebg:rgba(0,0,0,.35);--notefg:#e9dccb;
  --field:#1c1a18;--pop:#26231f;--modal:#24211e;--scheme:dark;--shadow:rgba(0,0,0,.45);--dan:#e08b7d;--danline:#6b3a31;--danbg:#3a201b}
.board.light{--list:#ebe5db;--card:#fffdf9;--card-h:#ffffff;--line:#ddd5c8;--text:#23211f;--muted:#6b655c;--on:#23211f;
  --hover:rgba(35,33,31,.08);--soft:rgba(35,33,31,.05);--pill:rgba(35,33,31,.07);--barbg:rgba(255,253,249,.7);--notebg:rgba(154,107,63,.12);--notefg:#6b4a2a;
  --field:#ffffff;--pop:#fffdf9;--modal:#fbf8f3;--scheme:light;--shadow:rgba(35,33,31,.14);--dan:#a33a2c;--danline:#e3b8b0;--danbg:#f8e9e5}
.board.light .card{box-shadow:0 1px 2px var(--shadow)}
.board.light .list{box-shadow:none}
.board{color:var(--text)}
html[dir=rtl]{--sans:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--charcoal-2);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;flex-direction:column;height:100%}

/* top bar */
.top{color:#f3eee6;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--charcoal-2);border-bottom:1px solid #2c2925}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--serif);font-weight:600;letter-spacing:.32em;font-size:19px}
.brand span{color:var(--bronze-l);font-size:14px;font-weight:600}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid #3a3631;background:#22201d;padding:0 12px 0 34px;outline:none}
html[dir=rtl] .search input{padding:0 34px 0 12px}
.search input:focus{border-color:var(--bronze-l)}
.search svg{position:absolute;top:9px;inset-inline-start:11px;color:var(--muted)}
.seg{display:flex;background:#2a2724;border-radius:999px;padding:3px}
.seg button{padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--bronze);color:#fff}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* board bar */
.bbar{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--on);background:var(--barbg);backdrop-filter:blur(6px)}
.bname{font-family:var(--serif);font-size:22px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.bname:hover{background:var(--hover)}
.bname-in{font-family:var(--serif);font-size:22px;font-weight:600;background:#fff;color:var(--charcoal);border:0;border-radius:6px;padding:2px 8px;outline:2px solid var(--bronze-l)}
.ib{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.ib:hover,.ib.on{background:var(--hover)}
.sp{flex:1}
.members{display:flex}
.members .av{border:2px solid rgba(0,0,0,.35);margin-inline-start:-6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;background:var(--pill);font-size:14px;font-weight:600}
.pill:hover{background:var(--hover)}
.pill.on{background:var(--charcoal);color:#fff}.board:not(.light) .pill.on{background:var(--paper);color:var(--charcoal)}
.note{margin:0 16px;padding:6px 12px;border-radius:8px;background:var(--notebg);color:var(--notefg);font-size:12.5px;display:inline-block}

/* filter */
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;color:var(--on);background:var(--barbg);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--pill);font-weight:500}
.chip.on{background:var(--charcoal);color:#fff}.board:not(.light) .chip.on{background:var(--paper);color:var(--charcoal)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* canvas + lists */
.canvas{flex:1;display:flex;align-items:flex-start;gap:12px;padding:12px 16px 24px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}
.canvas::-webkit-scrollbar{height:12px}.canvas::-webkit-scrollbar-thumb{background:var(--hover);border-radius:8px}
.list{width:276px;flex:none;max-height:100%;display:flex;flex-direction:column;background:var(--list);border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.4);scroll-snap-align:start}
.lhead{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 14px;cursor:grab;user-select:none;-webkit-user-select:none}
html[dir=rtl] .lhead{padding:10px 14px 6px 8px}
.ltitle{flex:1;text-align:start;font-weight:700;font-size:14.5px;padding:4px 2px;border-radius:5px;overflow-wrap:anywhere}
.lin{flex:1;font-weight:700;font-size:14.5px;background:#fff;color:var(--charcoal);border:0;border-radius:5px;padding:4px 6px;outline:2px solid var(--bronze-l)}
.lcount{color:var(--muted);font-size:13px;padding:0 4px}
.lhead .ib{width:28px;height:28px;color:var(--muted)}
.lhead .ib:hover{color:var(--text)}
.cards{padding:2px 8px;overflow-y:auto;min-height:6px;display:flex;flex-direction:column;gap:8px}
.cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.card{background:var(--card);border-radius:10px;padding:9px 12px;box-shadow:0 1px 0 var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:1px solid transparent}
.card:hover{background:var(--card-h);outline-color:var(--line)}
.card .lbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.card .lbs span{height:8px;width:40px;border-radius:4px}
.card .ct{font-size:14.5px;line-height:1.38;overflow-wrap:anywhere}
.card.done .ct{color:var(--muted)}
.card .bd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:7px;color:var(--muted);font-size:12.5px}
.card .bd span{display:inline-flex;align-items:center;gap:4px}
.card .bd svg{width:14px;height:14px}
.due{padding:2px 6px;border-radius:5px}
.due.over{background:var(--bad);color:#fff}.due.soon{background:var(--warn);color:#241703}.due.ok{background:var(--ok);color:#fff}
.ckc.full{background:var(--ok);color:#fff;padding:2px 6px;border-radius:5px}
.card .who{margin-inline-start:auto;display:flex;gap:3px}
.card .who .av{width:24px;height:24px;font-size:10px}
.lfoot{padding:6px 8px 8px}
.addc{width:100%;display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;text-align:start}
.addc:hover{background:var(--hover);color:var(--text)}
.comp textarea,.comp input{width:100%;resize:none;border:0;border-radius:10px;background:var(--card);padding:9px 12px;outline:2px solid var(--bronze-l);font-size:14.5px;min-height:62px}
.comp input{min-height:auto;height:36px}
.row{display:flex;align-items:center;gap:6px;margin-top:8px}
.btn{height:34px;padding:0 14px;border-radius:7px;background:var(--bronze);color:#fff;font-weight:600;font-size:14px}
.btn:hover{background:#86592f}
.btn.sec{background:var(--pill);color:var(--text)}
.btn.sec:hover{background:var(--hover)}
.btn.dan{background:transparent;color:var(--dan);border:1px solid var(--danline)}
.btn.dan:hover{background:var(--danbg)}
.addl{width:276px;flex:none;border-radius:14px;background:var(--pill);color:var(--on);padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px;text-align:start}
.addl:hover{background:var(--hover)}
.addl.open{background:var(--list);color:var(--text);display:block}
.list.col{width:46px;cursor:grab}
.list.col .lhead{flex-direction:column;padding:10px 0;gap:10px;height:100%}
.list.col .ltitle{writing-mode:vertical-rl;flex:none}
html[dir=ltr] .list.col .ltitle{transform:rotate(180deg)}
.empty{color:var(--muted);font-size:13px;padding:6px 6px 2px}

/* drag */
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(3deg);box-shadow:0 12px 28px rgba(0,0,0,.5);opacity:.96}
.ph{border-radius:10px;background:var(--soft);outline:2px dashed var(--line)}
.lph{width:276px;flex:none;border-radius:14px;background:var(--soft);outline:2px dashed var(--line)}
body.dragging,body.dragging *{cursor:grabbing!important}

/* menus */
.pop{position:fixed;z-index:40;width:270px;background:var(--pop);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 32px rgba(0,0,0,.35);padding:8px}
.pop h4{margin:4px 6px 8px;font-size:13px;color:var(--muted);font-weight:600;text-align:center}
.pop .mi{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:14px;text-align:start}
.pop .mi:hover{background:var(--hover)}
.pop .mi.cur{color:var(--bronze-l);font-weight:600}
.pop .mi.dan{color:var(--dan)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px}
.sw button{height:44px;border-radius:8px;outline:2px solid transparent}
.sw button.on{outline-color:var(--bronze)}

/* card details */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:48px 14px}
.md{width:100%;max-width:760px;background:var(--modal);color:var(--text);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);position:relative}
.mhead{display:flex;gap:10px;align-items:flex-start;padding:22px 22px 8px}
.mt{flex:1;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.25;background:transparent;border:0;outline:none;resize:none;padding:2px 6px;border-radius:6px;width:100%;overflow:hidden}
.mt:focus{background:#fff;color:var(--charcoal)}
.msub{padding:0 28px 6px;color:var(--muted);font-size:13.5px}
.msub b{color:var(--text);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.mbody{display:grid;grid-template-columns:1fr 200px;gap:22px;padding:10px 28px 26px}
.sec{margin-top:18px}
.sec:first-child{margin-top:4px}
.sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.sh .sp{flex:1}
.kv{display:flex;flex-wrap:wrap;gap:16px}
.kv>div>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{height:30px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;opacity:.38;display:inline-flex;align-items:center;gap:5px}
.lchip.on{opacity:1}
.lchip svg{width:13px;height:13px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 3px;border-radius:999px;background:var(--soft);font-size:13px;opacity:.55}
html[dir=rtl] .pchip{padding:0 3px 0 10px}
.pchip.on{opacity:1;background:var(--pill)}
.fld{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--field);padding:0 10px;outline:none;color-scheme:var(--scheme)}
.fld:focus{border-color:var(--bronze-l)}
.donebx{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:7px;background:var(--pill);font-size:14px;font-weight:600}
.donebx.on{background:var(--ok);color:#fff}
.desc{width:100%;min-height:96px;border-radius:9px;border:1px solid var(--line);background:var(--field);padding:10px 12px;outline:none;resize:vertical;line-height:1.45}
.desc:focus{border-color:var(--bronze-l)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze-l);border-radius:5px}
.bar i.full{background:var(--ok)}
.cki{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:7px}
.cki:hover{background:var(--soft)}
.cki input{width:17px;height:17px;accent-color:var(--bronze)}
.cki span{flex:1;font-size:14px}
.cki.done span{text-decoration:line-through;color:var(--muted)}
.cki .ib{width:26px;height:26px;opacity:0}
.cki:hover .ib{opacity:1}
.act{display:flex;gap:10px;margin-top:12px}
.act .tx{flex:1;font-size:14px}
.act .tx b{font-weight:600}
.act .tm{color:var(--muted);font-size:12px;margin-top:2px}
.act .bub{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-top:4px;white-space:pre-wrap;line-height:1.4}
.side .sl{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.side .sl:first-child{margin-top:4px}
.side .btn{width:100%;margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:flex-start}
.side select{width:100%}
.x{position:absolute;top:14px;inset-inline-end:14px}

@media (max-width:760px){
  .mbody{grid-template-columns:1fr}
  .brand span{display:none}
  .search{max-width:none}
  .bname{font-size:19px;max-width:52vw}
  .list,.addl,.lph{width:84vw}
  .ov{padding:0}
  .md{border-radius:0;min-height:100%}
  .hide-sm{display:none}
}
/* ---- departments, sidebar, pages ---- */
.board{--sidebg:#1a1816;--pagebg:#201e1c}
.board.light{--sidebg:#fbf8f3;--pagebg:#f6f3ee}
.shell{flex:1;display:flex;min-height:0}
.side{width:240px;flex:none;background:var(--sidebg);border-inline-end:1px solid var(--line);padding:12px 10px 30px;overflow-y:auto;color:var(--text)}
.side .nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;text-align:start;color:var(--text)}
.side .nav:hover{background:var(--hover)}
.side .nav.on{background:var(--pill);font-weight:700}
.side .nav .n{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}
.side .nav .n.bad{color:var(--bad)}
.side .dot{width:10px;height:10px;border-radius:3px;flex:none}
.side h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 10px 6px;font-weight:600}
html[dir=rtl] .side h5{letter-spacing:0}
.side .sub{padding-inline-start:30px;font-size:13.5px;font-weight:400}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.page{flex:1;overflow:auto;padding:24px 28px 48px;background:var(--pagebg);color:var(--text)}
.page h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 4px}
.page .lead{color:var(--muted);margin:0 0 20px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.kpi.bad b{color:var(--bad)}
.tw{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.tbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl .num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .bad{color:var(--bad);font-weight:700}
.tbl .sm{color:var(--muted);font-size:12.5px}
.pbar{display:flex;align-items:center;gap:8px;min-width:130px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar .bar{height:7px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.st.on{background:#e3eedb;color:#35571f}.st.risk{background:#fbefd6;color:#7a4f06}.st.off{background:#f8e1dc;color:#8a2c1e}.st.none{background:var(--soft);color:var(--muted)}
.board:not(.light) .st.on{background:#2b3a24;color:#b9d9a3}.board:not(.light) .st.risk{background:#3d2f12;color:#f0c674}.board:not(.light) .st.off{background:#40211b;color:#f0a597}
button.st{cursor:pointer}
.h2{font-size:17px;font-weight:700;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:10px;min-height:160px;color:var(--text);position:relative;overflow:hidden}
.tile:hover{border-color:var(--bronze-l)}
.tile .band{position:absolute;inset:0 0 auto 0;height:6px}
.tile h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:4px 0 0;line-height:1.2}
.tile .meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px}
.tile .meta .bad{color:var(--bad);font-weight:700}
.tile .foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.tile .who{display:flex;margin-inline-start:auto}
.tile .who .av{width:24px;height:24px;font-size:10px;border:2px solid var(--card);margin-inline-start:-6px}
.tile.new{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-weight:600;gap:6px}
.mine-g{margin:22px 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.mine-g .c{color:var(--muted);font-weight:600}
.mine-g.bad{color:var(--bad)}
.empty-p{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center}
.viewas{height:30px;border-radius:7px;border:1px solid #3a3631;background:#22201d;color:#f3eee6;padding:0 8px;font-size:13px;max-width:210px}
.crumb{color:var(--on);opacity:.8;font-size:13.5px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap}
.crumb:hover{background:var(--hover);opacity:1}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:7px;text-align:start;font-size:14px}
.mrow:hover{background:var(--hover)}
.mrow .r{color:var(--muted);font-size:12px}
.mrow .tk{margin-inline-start:auto;color:var(--bronze);width:18px}
.pop.wide{width:300px;max-height:70vh;overflow-y:auto}
.pop textarea{width:100%;min-height:70px;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:8px 10px;outline:none;resize:vertical;margin-top:6px}
.menu-b{display:none}
.lock{font-size:12.5px;color:var(--muted);padding:6px 8px}
@media (max-width:760px){
  .menu-b{display:inline-flex}
  .side{position:fixed;top:52px;bottom:0;inset-inline-start:0;z-index:25;width:270px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  html[dir=rtl] .side{transform:translateX(105%)}
  .side.open{transform:none!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

  .viewas{max-width:120px}

}

const KEY='forka-boards-preview-v2';
let D=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.boards&&d.me)return d}catch(e){}return seed()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}

/* ---------- who may do what ---------- */
const ME=()=>D.me, meP=()=>person(D.me), isCEO=()=>!!meP().ceo;
const headOf=dep=>isCEO()||(meP().role==='head'&&meP().dept===dep);
const canSee=b=>!!b&&(isCEO()||headOf(b.dept)||b.members.includes(ME()));
const canAdmin=b=>!!b&&headOf(b.dept);
const boards=()=>D.order.map(id=>D.boards[id]).filter(canSee);
const depts=()=>DEPTS.filter(d=>isCEO()||headOf(d.id)||boards().some(b=>b.dept===d.id));
const theme=()=>D.dark&&D.dark[ME()]?'dark':'light';

/* ---------- view state ---------- */
const V={view:null,dept:null,board:null,comp:null,addList:false,editList:null,editBoard:false,pop:null,card:null,filter:false,side:false,f:{q:'',members:[],labels:[],due:''}};
let ASK=null;
function ask(msg,go){ASK={msg,go};V.pop=null;render();setTimeout(()=>{const b=document.querySelector('[data-a=ask-no]');b&&b.focus()},0)}
function home(){V.view=isCEO()?'progress':'mine';V.board=null;V.dept=null}
home();
const B=()=>D.boards[V.board];

/* ---------- helpers ---------- */
const fmtDay=ts=>new Date(ts).toLocaleDateString(lang==='ar'?'ar-AE':'en-GB',{day:'numeric',month:'short'});
function dueCls(c){if(!c.due)return '';if(c.done)return 'ok';const d=c.due-today();return d<0?'over':d<=day?'soon':''}
function ago(ts){const m=Math.round((Date.now()-ts)/6e4);if(m<1)return t('now');if(m<60)return t('mAgo',{n:m});const h=Math.round(m/60);if(h<24)return t('hAgo',{n:h});return fmtDay(ts)}
const av=(id,cls)=>{const p=person(id);return `<span class="av ${cls||''}" style="background:${p.color}" title="${esc(pname(id))}">${esc(p.ini)}</span>`};
const listOf=cid=>Object.values(D.lists).find(l=>l.cards.includes(cid));
const boardOfList=lid=>Object.values(D.boards).find(b=>b.lists.includes(lid));
const cardsOf=b=>b.lists.flatMap(l=>(D.lists[l]?D.lists[l].cards:[]).map(id=>D.cards[id])).filter(Boolean);
function stats(cards){const t0=today(),wk=t0+7*day,a7=Date.now()-7*day;const s={open:0,over:0,week:0,doneW:0,done:0,total:cards.length};
  cards.forEach(c=>{if(c.done){s.done++;if((c.doneAt||0)>=a7)s.doneW++}else{s.open++;if(c.due&&c.due<t0)s.over++;else if(c.due&&c.due<wk)s.week++}});
  s.pct=s.total?Math.round(s.done/s.total*100):0;return s}
const pbar=p=>`<div class="pbar"><div class="bar"><i class="${p===100?'full':''}" style="width:${p}%"></i></div><span>${p}%</span></div>`;
const stChip=(st,btn)=>{const k=st&&st.s?st.s:'none';return `<${btn?'button data-a="status"':'span'} class="st ${k}"><i></i>${t('st_'+k)}</${btn?'button':'span'}>`};
function match(c){const f=V.f;
  if(f.q&&!(c.title+' '+c.desc).toLowerCase().includes(f.q.toLowerCase()))return false;
  if(f.members.length&&!f.members.some(m=>c.members.includes(m)))return false;
  if(f.labels.length&&!f.labels.some(l=>c.labels.includes(l)))return false;
  if(f.due==='week'&&!(c.due&&!c.done&&c.due>=today()&&c.due<today()+7*day))return false;
  if(f.due==='over'&&!(c.due&&!c.done&&c.due<today()))return false;
  return true}
const filtering=()=>{const f=V.f;return !!(f.q||f.members.length||f.labels.length||f.due)};

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  if(V.view==='board'&&!canSee(B()))home();
  if(V.view==='progress'&&!isCEO())home();
  const cv=document.querySelector('.canvas'),sx=cv?cv.scrollLeft:0,ys={};document.querySelectorAll('.list[data-id] .cards').forEach(e=>ys[e.closest('.list').dataset.id]=e.scrollTop);
  const pg=document.querySelector('.page'),py=pg?pg.scrollTop:0;
  document.getElementById('app').innerHTML=`
  <div class="top">
    <button class="ib menu-b" data-a="side" aria-label="${t('departments')}">${ic('menu')}</button>
    <div class="brand"><b>FORKA</b><span>${t('app')}</span></div>
    <div class="search">${V.view==='board'?`${ic('search')}<input id="q" type="search" placeholder="${t('search')}" value="${esc(V.f.q)}" aria-label="${t('search')}">`:''}</div>
    <label class="hide-sm" style="font-size:12px;color:#a9a196">${t('viewAs')}</label>
    <select class="viewas" id="viewas" aria-label="${t('viewAs')}">${PEOPLE.map(p=>`<option value="${p.id}" ${p.id===ME()?'selected':''}>${esc(pname(p.id))}${p.ceo?' - '+t('ceoRole'):''}</option>`).join('')}</select>
    <div class="seg"><button data-a="lang" data-v="en" class="${lang==='en'?'on':''}">EN</button><button data-a="lang" data-v="ar" class="${lang==='ar'?'on':''}">عربي</button></div>
    ${av(ME())}
  </div>
  <div class="board ${theme()==='light'?'light':''} shell">
    ${sideHTML()}
    <div class="main">${V.view==='board'?boardHTML():V.view==='progress'?progressHTML():V.view==='dept'?deptHTML():mineHTML()}</div>
    ${V.card&&D.cards[V.card]?modalHTML(D.cards[V.card]):''}
    ${V.pop?popHTML():''}
    ${ASK?`<div class="ov" style="z-index:60;align-items:center"><div class="md" role="alertdialog" aria-modal="true" style="max-width:400px;padding:22px"><p style="margin:0 0 18px;font-size:15px;line-height:1.45">${esc(ASK.msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" data-a="ask-no">${t('cancel')}</button><button class="btn" style="background:#a33a2c" data-a="ask-yes">${t('yes')}</button></div></div></div>`:''}
  </div>`;
  const c2=document.querySelector('.canvas');if(c2)c2.scrollLeft=sx;
  document.querySelectorAll('.list[data-id] .cards').forEach(e=>{const y=ys[e.closest('.list').dataset.id];if(y)e.scrollTop=y});
  const p2=document.querySelector('.page');if(p2)p2.scrollTop=py;
  if(V.pop)placePop();
  const mt=document.getElementById('mt');if(mt){mt.style.height='auto';mt.style.height=mt.scrollHeight+'px'}
}
function sideHTML(){
  const mineN=boards().flatMap(cardsOf).filter(c=>!c.done&&c.members.includes(ME())).length;
  return `<nav class="side ${V.side?'open':''}" aria-label="${t('departments')}">
    <button class="nav ${V.view==='mine'?'on':''}" data-a="go" data-v="mine">${ic('inbox')}${t('mine')}<span class="n">${mineN||''}</span></button>
    ${isCEO()?`<button class="nav ${V.view==='progress'?'on':''}" data-a="go" data-v="progress">${ic('chart')}${t('progress')}</button>`:''}
    <h5>${t('departments')}</h5>
    ${depts().map(d=>{const bs=boards().filter(b=>b.dept===d.id),s=stats(bs.flatMap(cardsOf));
      return `<button class="nav ${V.view==='dept'&&V.dept===d.id?'on':''}" data-a="dept" data-id="${d.id}"><span class="dot" style="background:${d.dot}"></span>${esc(d[lang])}<span class="n ${s.over?'bad':''}">${s.over?s.over:''}</span></button>
        ${(V.dept===d.id||(V.view==='board'&&B()&&B().dept===d.id))?bs.map(b=>`<button class="nav sub ${V.view==='board'&&V.board===b.id?'on':''}" data-a="board" data-id="${b.id}">${esc(b.name)}</button>`).join(''):''}`}).join('')}
  </nav>`}

/* Company progress (CEO) */
function progressHTML(){
  const all=boards(),S=stats(all.flatMap(cardsOf));
  const rows=DEPTS.map(d=>{const bs=all.filter(b=>b.dept===d.id),s=stats(bs.flatMap(cardsOf)),h=headOfDept(d.id);
    return `<tr class="click" data-a="dept" data-id="${d.id}"><td><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${d.dot};margin-inline-end:8px"></span><b>${esc(d[lang])}</b></td>
      <td class="sm">${h?esc(pname(h.id)):'-'}</td><td class="num">${bs.length}</td><td class="num">${s.open}</td><td class="num ${s.over?'bad':''}">${s.over}</td><td class="num">${s.week}</td><td class="num">${s.doneW}</td><td>${pbar(s.pct)}</td></tr>`}).join('');
  const order={off:0,risk:1,on:2};
  const proj=all.slice().sort((a,b)=>(order[a.status&&a.status.s]??3)-(order[b.status&&b.status.s]??3)).map(b=>{const s=stats(cardsOf(b));
    return `<tr class="click" data-a="board" data-id="${b.id}"><td><b>${esc(b.name)}</b><div class="sm">${esc(deptName(b.dept))}</div></td><td>${stChip(b.status)}</td>
      <td class="sm" style="max-width:280px">${b.status&&b.status.note?esc(b.status.note)+`<div>${esc(pname(b.status.by))} · ${ago(b.status.at)}</div>`:'-'}</td>
      <td>${pbar(s.pct)}</td><td class="num ${s.over?'bad':''}">${s.over}</td><td><div style="display:flex">${b.members.slice(0,5).map(m=>av(m)).join('')}</div></td></tr>`}).join('');
  const load=PEOPLE.map(p=>{const cs=all.flatMap(cardsOf).filter(c=>c.members.includes(p.id));return {p,s:stats(cs)}}).filter(x=>x.s.total).sort((a,b)=>b.s.over-a.s.over||b.s.open-a.s.open)
    .map(({p,s})=>`<tr><td><div style="display:flex;align-items:center;gap:8px">${av(p.id)}<span>${esc(pname(p.id))}</span></div></td><td class="sm">${p.ceo?t('ceoRole'):esc(deptName(p.dept))}</td><td class="num">${s.open}</td><td class="num ${s.over?'bad':''}">${s.over}</td><td class="num">${s.week}</td><td class="num">${s.doneW}</td></tr>`).join('');
  return `<div class="page">
    <h1>${t('progress')}</h1><p class="lead">${t('progLead')}</p>
    <div class="kpis"><div class="kpi"><b>${S.open}</b><span>${t('k_open')}</span></div><div class="kpi ${S.over?'bad':''}"><b>${S.over}</b><span>${t('k_over')}</span></div>
      <div class="kpi"><b>${S.week}</b><span>${t('k_week')}</span></div><div class="kpi"><b>${S.doneW}</b><span>${t('k_done')}</span></div></div>
    <div class="tw"><table class="tbl"><tr><th>${t('t_dept')}</th><th>${t('t_head')}</th><th class="num">${t('t_boards')}</th><th class="num">${t('t_open')}</th><th class="num">${t('t_over')}</th><th class="num">${t('t_week')}</th><th class="num">${t('t_done')}</th><th>${t('t_prog')}</th></tr>${rows}</table></div>
    <div class="h2">${ic('flag')}${t('projects')}</div>
    <div class="tw"><table class="tbl"><tr><th>${t('t_board')}</th><th>${t('t_status')}</th><th>${t('t_note')}</th><th>${t('t_prog')}</th><th class="num">${t('t_over')}</th><th>${t('t_members')}</th></tr>${proj}</table></div>
    <div class="h2">${ic('users')}${t('workload')}</div>
    <div class="tw"><table class="tbl"><tr><th>${t('t_person')}</th><th>${t('t_dept')}</th><th class="num">${t('t_open')}</th><th class="num">${t('t_over')}</th><th class="num">${t('t_week')}</th><th class="num">${t('t_done')}</th></tr>${load}</table></div>
    <p class="lead" style="margin-top:18px"><span class="note" style="margin:0">${t('preview')}</span></p>
  </div>`}

/* My tasks */
function mineHTML(){
  const mine=[];boards().forEach(b=>cardsOf(b).forEach(c=>{if(!c.done&&c.members.includes(ME()))mine.push({c,b})}));
  const t0=today(),G={over:[],today:[],week:[],later:[],none:[]};
  mine.forEach(x=>{const d=x.c.due;G[!d?'none':d<t0?'over':d<t0+day?'today':d<t0+7*day?'week':'later'].push(x)});
  Object.values(G).forEach(a=>a.sort((x,y)=>(x.c.due||0)-(y.c.due||0)));
  const grp=(k,cls)=>G[k].length?`<div class="mine-g ${cls||''}">${t('g_'+k)} <span class="c">${G[k].length}</span></div><div class="tw"><table class="tbl">${G[k].map(({c,b})=>{const dc=dueCls(c);
    return `<tr class="click" data-a="open" data-id="${c.id}"><td><b dir="auto">${esc(c.title)}</b>${c.labels.length?`<div style="display:flex;gap:4px;margin-top:5px">${c.labels.map(l=>`<span style="height:6px;width:28px;border-radius:3px;background:${label(l).color}"></span>`).join('')}</div>`:''}</td>
      <td class="sm">${esc(b.name)}<div>${esc(deptName(b.dept))} · ${esc((listOf(c.id)||{}).name||'')}</div></td><td class="num">${c.due?`<span class="due ${dc}" style="display:inline-flex;gap:4px;align-items:center">${ic('clock')}${fmtDay(c.due)}</span>`:''}</td></tr>`}).join('')}</table></div>`:'';
  return `<div class="page"><h1>${t('mine')}</h1><p class="lead">${t('mineLead')}</p>
    ${mine.length?grp('over','bad')+grp('today')+grp('week')+grp('later')+grp('none'):`<div class="empty-p">${t('nothingMine')}</div>`}</div>`}

/* Department page */
function deptHTML(){
  const d=dept(V.dept),bs=boards().filter(b=>b.dept===d.id),admin=headOf(d.id),h=headOfDept(d.id);
  return `<div class="page" style="background:${theme()==='light'?d.tint:'var(--pagebg)'}">
    <h1>${esc(d[lang])}</h1><p class="lead">${admin?t('deptLead',{n:bs.length}):t('deptLeadStaff')}${h?` · ${t('headLabel')}: <b style="color:var(--text)">${esc(pname(h.id))}</b>`:''}</p>
    <div class="tiles">${bs.map(b=>{const s=stats(cardsOf(b));return `<button class="tile" data-a="board" data-id="${b.id}"><span class="band" style="background:${d.dot}"></span>
        <h3>${esc(b.name)}</h3><div>${stChip(b.status)}</div>
        <div class="meta"><span>${t('openN',{n:s.open})}</span>${s.over?`<span class="bad">${t('overN',{n:s.over})}</span>`:''}</div>
        ${pbar(s.pct)}<div class="foot"><span class="sm" style="color:var(--muted);font-size:12px">${b.status&&b.status.at?t('updated',{t:ago(b.status.at)}):''}</span><span class="who">${b.members.slice(0,6).map(m=>av(m)).join('')}</span></div></button>`}).join('')}
      ${admin?(V.newBoard?`<div class="tile comp" style="justify-content:center"><input id="newb" placeholder="${t('boardPh')}" maxlength="80" dir="auto"><div class="row"><button class="btn" data-a="bnew">${t('create')}</button><button class="ib" data-a="bnew-x" aria-label="${t('cancel')}">${ic('x')}</button></div></div>`
        :`<button class="tile new" data-a="bnew-open">${ic('plus')}${t('newBoard')}</button>`):''}
    </div>${!bs.length&&!admin?`<div class="empty-p">${t('noBoards')}</div>`:''}</div>`}

/* Board */
function boardHTML(){const b=B(),d=dept(b.dept),admin=canAdmin(b);
  return `<div style="flex:1;display:flex;flex-direction:column;min-height:0;background:${theme()==='light'?d.tint:'linear-gradient(135deg,#1b1917 0%,#34302b 100%)'}">
    <div class="bbar">
      <button class="crumb" data-a="dept" data-id="${d.id}">${esc(d[lang])}</button>
      ${V.editBoard?`<input class="bname-in" id="bname" value="${esc(b.name)}" maxlength="80" dir="auto">`:`<button class="bname" dir="auto" data-a="${admin?'bname':''}">${esc(b.name)}</button>`}
      ${stChip(b.status,admin)}
      <div class="sp"></div>
      <div class="members hide-sm">${b.members.map(m=>av(m)).join('')}</div>
      ${admin?`<button class="pill" data-a="members">${ic('users')}<span class="hide-sm">${t('members')}</span></button>`:''}
      <button class="pill ${V.filter||filtering()?'on':''}" data-a="filter">${ic('filter')}<span class="hide-sm">${t('filter')}</span></button>
      <button class="ib" data-a="bmenu" aria-label="${t('boardMenu')}" title="${t('boardMenu')}">${ic('dots')}</button>
    </div>
    ${V.filter?filterBar():''}
    <div class="canvas" id="canvas">
      ${b.lists.map(id=>listHTML(D.lists[id],admin)).join('')}
      ${admin?(V.addList?`<div class="addl open comp"><input id="newl" dir="auto" placeholder="${t('listPh')}" maxlength="60"><div class="row"><button class="btn" data-a="addl-go">${t('addListBtn')}</button><button class="ib" data-a="addl-x" aria-label="${t('cancel')}">${ic('x')}</button></div></div>`
        :`<button class="addl" data-a="addl">${ic('plus')}${t('addList')}</button>`):''}
    </div></div>`}
function filterBar(){const f=V.f,b=B();
  return `<div class="fbar">
    ${b.members.map(id=>`<button class="chip ${f.members.includes(id)?'on':''}" data-a="fm" data-v="${id}">${av(id)} ${esc(pname(id))}</button>`).join('')}
    ${LABELS.map(l=>`<button class="chip ${f.labels.includes(l.id)?'on':''}" data-a="fl" data-v="${l.id}"><i style="background:${l.color}"></i>${t('lb_'+l.id)}</button>`).join('')}
    <button class="chip ${f.due==='week'?'on':''}" data-a="fd" data-v="week">${ic('clock')} ${t('dueWeek')}</button>
    <button class="chip ${f.due==='over'?'on':''}" data-a="fd" data-v="over">${t('overdueF')}</button>
    ${filtering()?`<button class="chip" data-a="fclear">${ic('x')} ${t('clear')}</button>`:''}
  </div>`}
function listHTML(l,admin){
  const all=l.cards.map(id=>D.cards[id]).filter(Boolean),shown=all.filter(match);
  if(l.col)return `<div class="list col" data-id="${l.id}"><div class="lhead"><button class="ib" data-a="lcol" data-id="${l.id}" aria-label="${t('expand')}" title="${t('expand')}">${ic('expand')}</button><span class="lcount">${shown.length}</span><div class="ltitle" dir="auto">${esc(l.name)}</div></div></div>`;
  return `<div class="list" data-id="${l.id}">
    <div class="lhead ${admin?'':'nodrag'}">
      ${V.editList===l.id?`<input class="lin" id="lname" dir="auto" value="${esc(l.name)}" maxlength="60">`:`<div class="ltitle" dir="auto" ${admin?`data-a="lname" data-id="${l.id}"`:''}>${esc(l.name)}</div>`}
      <span class="lcount">${filtering()?shown.length+'/'+all.length:all.length}</span>
      <button class="ib" data-a="lcol" data-id="${l.id}" aria-label="${t('collapse')}" title="${t('collapse')}">${ic('collapse')}</button>
      <button class="ib" data-a="lmenu" data-id="${l.id}" aria-label="${t('listMenu')}" title="${t('listMenu')}">${ic('dots')}</button>
    </div>
    <div class="cards">${shown.map(cardHTML).join('')}${filtering()&&!shown.length&&all.length?`<div class="empty">${t('noMatch')}</div>`:''}
      ${V.comp===l.id?`<div class="comp"><textarea id="newc" dir="auto" placeholder="${t('cardPh')}" maxlength="300"></textarea><div class="row"><button class="btn" data-a="addc-go" data-id="${l.id}">${t('addCardBtn')}</button><button class="ib" data-a="addc-x" aria-label="${t('cancel')}">${ic('x')}</button></div></div>`:''}
    </div>
    ${V.comp===l.id?'':`<div class="lfoot"><button class="addc" data-a="addc" data-id="${l.id}">${ic('plus')}${t('addCard')}</button></div>`}
  </div>`}
function cardHTML(c){
  const n=c.check.length,d=c.check.filter(x=>x.d).length,cm=c.log.filter(x=>x.c).length,dc=dueCls(c);
  const badges=[c.due?`<span class="due ${dc}">${ic('clock')}${fmtDay(c.due)}</span>`:'',c.repeat?`<span title="${t('repeat')}">${ic('repeat')}${t('r_'+c.repeat)}</span>`:'',
    c.desc?`<span title="${t('desc')}">${ic('desc')}</span>`:'',cm?`<span>${ic('chat')}${cm}</span>`:'',n?`<span class="ckc ${d===n?'full':''}">${ic('check')}${d}/${n}</span>`:''].join('');
  return `<div class="card ${c.done?'done':''}" data-id="${c.id}" tabindex="0">
    ${c.labels.length?`<div class="lbs">${c.labels.map(id=>{const l=label(id);return l?`<span style="background:${l.color}" title="${t('lb_'+id)}"></span>`:''}).join('')}</div>`:''}
    <div class="ct" dir="auto">${c.done?`<span style="color:var(--ok)">${ic('tick')}</span> `:''}${esc(c.title)}</div>
    ${badges||c.members.length?`<div class="bd">${badges}${c.members.length?`<span class="who">${c.members.map(m=>av(m)).join('')}</span>`:''}</div>`:''}
  </div>`}
function modalHTML(c){
  const l=listOf(c.id),b=boardOfList(l.id),admin=canAdmin(b),n=c.check.length,d=c.check.filter(x=>x.d).length,pc=n?Math.round(d/n*100):0;
  const pool=[...new Set(b.members.concat(c.members))];
  const log=c.log.slice().sort((x,y)=>y.at-x.at);
  return `<div class="ov" data-a="ov"><div class="md" role="dialog" aria-modal="true" aria-label="${esc(c.title)}">
    <button class="ib x" data-a="mclose" aria-label="${t('close')}">${ic('x')}</button>
    <div class="mhead">${ic('card')}<textarea class="mt" dir="auto" id="mt" rows="1" maxlength="300">${esc(c.title)}</textarea></div>
    <div class="msub">${esc(b.name)} · ${t('inList')} <b>${esc(l?l.name:'')}</b></div>
    <div class="mbody"><div>

/* ---------- drag and drop (mouse: move a little; touch: press and hold). Lists move only for the department head. ---------- */
const DR={d:null,justDropped:false,timer:null,auto:null,x:0,y:0};
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||V.card||V.view!=='board')return;
  if(e.target.closest('input,textarea,button,select'))return;
  const card=e.target.closest('.card[data-id]'),head=e.target.closest('.lhead'),col=e.target.closest('.list.col');
  let type,el;if(card){type='card';el=card}else if((head||col)&&canAdmin(B())){type='list';el=(head||col).closest('.list')}else return;
  DR.d={type,id:el.dataset.id,el,sx:e.clientX,sy:e.clientY,started:false,touch:e.pointerType!=='mouse'};DR.x=e.clientX;DR.y=e.clientY;
  if(DR.d.touch)DR.timer=setTimeout(()=>{if(DR.d&&!DR.d.started)start()},300);
});
document.addEventListener('pointermove',e=>{const d=DR.d;if(!d)return;DR.x=e.clientX;DR.y=e.clientY;
  if(!d.started){const m=Math.hypot(e.clientX-d.sx,e.clientY-d.sy);if(d.touch){if(m>10){clearTimeout(DR.timer);DR.d=null}return}if(m<6)return;start()}
  over()});
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',()=>{if(DR.d&&DR.d.started)end();else{clearTimeout(DR.timer);DR.d=null}});
document.addEventListener('touchmove',e=>{if(DR.d&&DR.d.started)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(DR.d)e.preventDefault()});
function start(){const d=DR.d;d.started=true;const r=d.el.getBoundingClientRect();d.ox=d.sx-r.left;d.oy=d.sy-r.top;
  const g=d.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);d.g=g;
  const ph=document.createElement('div');ph.className=d.type==='card'?'ph':'lph';ph.style.height=(d.type==='card'?r.height:Math.min(r.height,300))+'px';d.el.after(ph);d.ph=ph;d.el.style.display='none';
  document.body.classList.add('dragging');if(navigator.vibrate&&d.touch)try{navigator.vibrate(15)}catch(x){}
  DR.auto=setInterval(autoScroll,16);over()}
function over(){const d=DR.d;if(!d||!d.started)return;const x=DR.x,y=DR.y;d.g.style.left=(x-d.ox)+'px';d.g.style.top=(y-d.oy)+'px';
  const cv=document.getElementById('canvas');
  if(d.type==='card'){
    let L=null;document.querySelectorAll('.canvas .list:not(.col)').forEach(l=>{const r=l.getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6)L=l});
    if(!L)return;const box=L.querySelector('.cards');const cs=[...box.querySelectorAll('.card[data-id]')].filter(c=>c!==d.el);
    const before=cs.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
    if(before){if(d.ph.nextSibling!==before)box.insertBefore(d.ph,before)}else{const comp=box.querySelector('.comp,.empty');comp?box.insertBefore(d.ph,comp):box.appendChild(d.ph)}
  }else{
    const ls=[...cv.querySelectorAll(':scope > .list')].filter(l=>l!==d.el);const rtl=lang==='ar';
    const before=ls.find(l=>{const r=l.getBoundingClientRect(),mid=r.left+r.width/2;return rtl?x>mid:x<mid});
    if(before){if(d.ph.nextSibling!==before)cv.insertBefore(d.ph,before)}else{const add=cv.querySelector('.addl');add?cv.insertBefore(d.ph,add):cv.appendChild(d.ph)}
  }}
function autoScroll(){const d=DR.d;if(!d||!d.started)return;const cv=document.getElementById('canvas');if(!cv)return;const r=cv.getBoundingClientRect(),e=70;
  if(DR.x<r.left+e)cv.scrollLeft-=14;else if(DR.x>r.right-e)cv.scrollLeft+=14;
  if(d.type==='card'){const box=d.ph&&d.ph.closest('.cards');if(box){const b=box.getBoundingClientRect();if(DR.y<b.top+40)box.scrollTop-=10;else if(DR.y>b.bottom-40)box.scrollTop+=10}}
  over()}
function end(){clearTimeout(DR.timer);const d=DR.d;DR.d=null;if(!d||!d.started)return;clearInterval(DR.auto);document.body.classList.remove('dragging');
  if(d.type==='card'){const L=d.ph.closest('.list');if(L){const idsInDom=[...L.querySelectorAll('.cards > .card[data-id], .cards > .ph')].filter(x=>x!==d.el);const vis=idsInDom.indexOf(d.ph);
      const list=D.lists[L.dataset.id],visIds=idsInDom.filter(x=>x!==d.ph).map(x=>x.dataset.id);const after=visIds[vis-1];
      const full=list.cards.filter(cid=>cid!==d.id);const idx=after?full.indexOf(after)+1:(visIds[0]?full.indexOf(visIds[0]):full.length);
      moveCard(d.id,list.id,idx<0?full.length:idx)}}
  else{const cv=document.getElementById('canvas');const order=[...cv.querySelectorAll(':scope > .list, :scope > .lph')].filter(x=>x!==d.el).map(x=>x===d.ph?d.id:x.dataset.id);B().lists=order;save()}
  d.g.remove();DR.justDropped=true;setTimeout(()=>{DR.justDropped=false},50);render()}

render();
</script>
