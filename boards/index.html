<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forka Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#23211f;--charcoal-2:#171513;--paper:#f6f3ee;--bronze:#9a6b3f;--bronze-l:#b8875a;--bronze-soft:#e9dccb;
  --list:#1c1a18;--card:#2c2926;--card-h:#363230;--line:#3b3631;--text:#f3eee6;--muted:#a59d92;
  --ok:#5e9a45;--warn:#c48a2c;--bad:#c2503f;
  --sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;--serif:'EB Garamond',Georgia,serif;
}
html[dir=rtl]{--sans:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--charcoal-2);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;flex-direction:column;height:100%}

/* top bar */
.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--charcoal-2);border-bottom:1px solid #2c2925}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--serif);font-weight:600;letter-spacing:.32em;font-size:19px}
.brand span{color:var(--bronze-l);font-size:14px;font-weight:600}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid #3a3631;background:#22201d;padding:0 12px 0 34px;outline:none}
html[dir=rtl] .search input{padding:0 34px 0 12px}
.search input:focus{border-color:var(--bronze-l)}
.search svg{position:absolute;top:9px;inset-inline-start:11px;color:var(--muted)}
.seg{display:flex;background:#2a2724;border-radius:999px;padding:3px}
.seg button{padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--bronze);color:#fff}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* board bar */
.bbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.bname{font-family:var(--serif);font-size:22px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.bname:hover{background:rgba(255,255,255,.12)}
.bname-in{font-family:var(--serif);font-size:22px;font-weight:600;background:#fff;color:var(--charcoal);border:0;border-radius:6px;padding:2px 8px;outline:2px solid var(--bronze-l)}
.ib{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.ib:hover,.ib.on{background:rgba(255,255,255,.16)}
.sp{flex:1}
.members{display:flex}
.members .av{border:2px solid rgba(0,0,0,.35);margin-inline-start:-6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.14);font-size:14px;font-weight:600}
.pill:hover{background:rgba(255,255,255,.22)}
.pill.on{background:var(--paper);color:var(--charcoal)}
.note{margin:0 16px;padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.35);color:#e9dccb;font-size:12.5px;display:inline-block}

/* filter */
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:rgba(0,0,0,.35);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:500}
.chip.on{background:var(--paper);color:var(--charcoal)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* canvas + lists */
.canvas{flex:1;display:flex;align-items:flex-start;gap:12px;padding:12px 16px 24px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}
.canvas::-webkit-scrollbar{height:12px}.canvas::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:8px}
.list{width:276px;flex:none;max-height:100%;display:flex;flex-direction:column;background:var(--list);border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.4);scroll-snap-align:start}
.lhead{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 14px;cursor:grab;user-select:none;-webkit-user-select:none}
html[dir=rtl] .lhead{padding:10px 14px 6px 8px}
.ltitle{flex:1;text-align:start;font-weight:700;font-size:14.5px;padding:4px 2px;border-radius:5px;overflow-wrap:anywhere}
.lin{flex:1;font-weight:700;font-size:14.5px;background:#fff;color:var(--charcoal);border:0;border-radius:5px;padding:4px 6px;outline:2px solid var(--bronze-l)}
.lcount{color:var(--muted);font-size:13px;padding:0 4px}
.lhead .ib{width:28px;height:28px;color:var(--muted)}
.lhead .ib:hover{color:var(--text)}
.cards{padding:2px 8px;overflow-y:auto;min-height:6px;display:flex;flex-direction:column;gap:8px}
.cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:#3a3631;border-radius:6px}
.card{background:var(--card);border-radius:10px;padding:9px 12px;box-shadow:0 1px 0 rgba(0,0,0,.45);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:1px solid transparent}
.card:hover{background:var(--card-h);outline-color:#4a443d}
.card .lbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.card .lbs span{height:8px;width:40px;border-radius:4px}
.card .ct{font-size:14.5px;line-height:1.38;overflow-wrap:anywhere}
.card.done .ct{color:var(--muted)}
.card .bd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:7px;color:var(--muted);font-size:12.5px}
.card .bd span{display:inline-flex;align-items:center;gap:4px}
.card .bd svg{width:14px;height:14px}
.due{padding:2px 6px;border-radius:5px}
.due.over{background:var(--bad);color:#fff}.due.soon{background:var(--warn);color:#1b1206}.due.ok{background:var(--ok);color:#fff}
.ckc.full{background:var(--ok);color:#fff;padding:2px 6px;border-radius:5px}
.card .who{margin-inline-start:auto;display:flex;gap:3px}
.card .who .av{width:24px;height:24px;font-size:10px}
.lfoot{padding:6px 8px 8px}
.addc{width:100%;display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;text-align:start}
.addc:hover{background:rgba(255,255,255,.08);color:var(--text)}
.comp textarea,.comp input{width:100%;resize:none;border:0;border-radius:10px;background:var(--card);padding:9px 12px;outline:2px solid var(--bronze-l);font-size:14.5px;min-height:62px}
.comp input{min-height:auto;height:36px}
.row{display:flex;align-items:center;gap:6px;margin-top:8px}
.btn{height:34px;padding:0 14px;border-radius:7px;background:var(--bronze);color:#fff;font-weight:600;font-size:14px}
.btn:hover{background:#86592f}
.btn.sec{background:rgba(255,255,255,.1);color:var(--text)}
.btn.sec:hover{background:rgba(255,255,255,.18)}
.btn.dan{background:transparent;color:#e08b7d;border:1px solid #6b3a31}
.btn.dan:hover{background:#3a201b}
.addl{width:276px;flex:none;border-radius:14px;background:rgba(255,255,255,.18);padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px;text-align:start}
.addl:hover{background:rgba(255,255,255,.26)}
.addl.open{background:var(--list);display:block}
.list.col{width:46px;cursor:grab}
.list.col .lhead{flex-direction:column;padding:10px 0;gap:10px;height:100%}
.list.col .ltitle{writing-mode:vertical-rl;flex:none}
html[dir=ltr] .list.col .ltitle{transform:rotate(180deg)}
.empty{color:var(--muted);font-size:13px;padding:6px 6px 2px}

/* drag */
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(3deg);box-shadow:0 12px 28px rgba(0,0,0,.5);opacity:.96}
.ph{border-radius:10px;background:rgba(255,255,255,.07);outline:2px dashed rgba(255,255,255,.18)}
.lph{width:276px;flex:none;border-radius:14px;background:rgba(0,0,0,.25);outline:2px dashed rgba(255,255,255,.25)}
body.dragging,body.dragging *{cursor:grabbing!important}

/* menus */
.pop{position:fixed;z-index:40;width:270px;background:#26231f;border:1px solid #3a3631;border-radius:12px;box-shadow:0 14px 32px rgba(0,0,0,.5);padding:8px}
.pop h4{margin:4px 6px 8px;font-size:13px;color:var(--muted);font-weight:600;text-align:center}
.pop .mi{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:14px;text-align:start}
.pop .mi:hover{background:rgba(255,255,255,.08)}
.pop .mi.cur{color:var(--bronze-l);font-weight:600}
.pop .mi.dan{color:#e08b7d}
.pop hr{border:0;border-top:1px solid #3a3631;margin:6px 0}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px}
.sw button{height:44px;border-radius:8px;outline:2px solid transparent}
.sw button.on{outline-color:#fff}

/* card details */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:48px 14px}
.md{width:100%;max-width:760px;background:#24211e;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);position:relative}
.mhead{display:flex;gap:10px;align-items:flex-start;padding:22px 22px 8px}
.mt{flex:1;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.25;background:transparent;border:0;outline:none;resize:none;padding:2px 6px;border-radius:6px;width:100%;overflow:hidden}
.mt:focus{background:#fff;color:var(--charcoal)}
.msub{padding:0 28px 6px;color:var(--muted);font-size:13.5px}
.msub b{color:var(--text);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.mbody{display:grid;grid-template-columns:1fr 200px;gap:22px;padding:10px 28px 26px}
.sec{margin-top:18px}
.sec:first-child{margin-top:4px}
.sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.sh .sp{flex:1}
.kv{display:flex;flex-wrap:wrap;gap:16px}
.kv>div>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{height:30px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;opacity:.38;display:inline-flex;align-items:center;gap:5px}
.lchip.on{opacity:1}
.lchip svg{width:13px;height:13px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 3px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;opacity:.55}
html[dir=rtl] .pchip{padding:0 3px 0 10px}
.pchip.on{opacity:1;background:rgba(255,255,255,.14)}
.fld{height:34px;border-radius:7px;border:1px solid #3a3631;background:#1c1a18;padding:0 10px;outline:none;color-scheme:dark}
.fld:focus{border-color:var(--bronze-l)}
.donebx{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600}
.donebx.on{background:var(--ok);color:#fff}
.desc{width:100%;min-height:96px;border-radius:9px;border:1px solid #3a3631;background:#1c1a18;padding:10px 12px;outline:none;resize:vertical;line-height:1.45}
.desc:focus{border-color:var(--bronze-l)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:5px;background:#3a3631;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze-l);border-radius:5px}
.bar i.full{background:var(--ok)}
.cki{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:7px}
.cki:hover{background:rgba(255,255,255,.05)}
.cki input{width:17px;height:17px;accent-color:var(--bronze)}
.cki span{flex:1;font-size:14px}
.cki.done span{text-decoration:line-through;color:var(--muted)}
.cki .ib{width:26px;height:26px;opacity:0}
.cki:hover .ib{opacity:1}
.act{display:flex;gap:10px;margin-top:12px}
.act .tx{flex:1;font-size:14px}
.act .tx b{font-weight:600}
.act .tm{color:var(--muted);font-size:12px;margin-top:2px}
.act .bub{background:#1c1a18;border:1px solid #3a3631;border-radius:9px;padding:8px 11px;margin-top:4px;white-space:pre-wrap;line-height:1.4}
.side .sl{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.side .sl:first-child{margin-top:4px}
.side .btn{width:100%;margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:flex-start}
.side select{width:100%}
.x{position:absolute;top:14px;inset-inline-end:14px}

@media (max-width:760px){
  .mbody{grid-template-columns:1fr}
  .brand span{display:none}
  .search{max-width:none}
  .bname{font-size:19px;max-width:52vw}
  .list,.addl,.lph{width:84vw}
  .ov{padding:0}
  .md{border-radius:0;min-height:100%}
  .hide-sm{display:none}
}
</style>
</head>

<script>

const ICON={

const ic=(n,cls)=>`<svg viewBox="0 0 24 24"${cls?` class="${cls}"`:''} aria-hidden="true">${ICON[n]}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- words (English / Arabic) ---------- */
const T={
en:{app:'Boards',search:'Search',addCard:'Add a card',addCardBtn:'Add card',cardPh:'Enter a title for this card',addList:'Add another list',listPh:'Enter list name',addListBtn:'Add list',cancel:'Cancel',

let lang=(()=>{try{return localStorage.getItem('fb-lang')==='ar'?'ar':'en'}catch(e){return 'en'}})();

const fmtDay=ts=>new Date(ts).toLocaleDateString(lang==='ar'?'ar-AE':'en-GB',{day:'numeric',month:'short'});
function dueCls(c){if(!c.due)return '';if(c.done)return 'ok';const d=c.due-today();return d<0?'over':d<=day?'soon':''}
function ago(ts){const m=Math.round((Date.now()-ts)/6e4);if(m<1)return t('now');if(m<60)return t('mAgo',{n:m});const h=Math.round(m/60);if(h<24)return t('hAgo',{n:h});return fmtDay(ts)}
const av=(id,cls)=>{const p=person(id);return `<span class="av ${cls||''}" style="background:${p.color}" title="${esc(p.name)}">${esc(p.ini)}</span>`};
function match(c){const f=V.f;
  if(f.q&&!(c.title+' '+c.desc).toLowerCase().includes(f.q.toLowerCase()))return false;
  if(f.members.length&&!f.members.some(m=>c.members.includes(m)))return false;
  if(f.labels.length&&!f.labels.some(l=>c.labels.includes(l)))return false;
  if(f.due==='week'&&!(c.due&&!c.done&&c.due>=today()&&c.due<today()+7*day))return false;
  if(f.due==='over'&&!(c.due&&!c.done&&c.due<today()))return false;
  return true}
const filtering=()=>{const f=V.f;return !!(f.q||f.members.length||f.labels.length||f.due)};

function logTo(c,e){c.log.push(Object.assign({at:Date.now(),by:ME},e))}
function addCard(lid,title){title=title.trim();if(!title)return;const l=D.lists[lid];const c={id:uid('c'),title,desc:'',labels:[],members:[],due:null,done:false,repeat:'',check:[],log:[]};
  logTo(c,{k:'l_added',a:l.name});D.cards[c.id]=c;l.cards.push(c.id);save()}
function moveCard(cid,toL,idx){const from=listOf(cid);if(!from)return;from.cards.splice(from.cards.indexOf(cid),1);const to=D.lists[toL];idx=Math.max(0,Math.min(idx,to.cards.length));to.cards.splice(idx,0,cid);
  if(from.id!==toL)logTo(D.cards[cid],{k:'l_moved',a:from.name,b:to.name});save()}
function commitModalFields(){const c=D.cards[V.card];if(!c)return;const mt=document.getElementById('mt'),de=document.getElementById('cdesc');

document.addEventListener('click',e=>{
  if(DR.justDropped){DR.justDropped=false;return}
  const a=e.target.closest('[data-a]');
  if(V.pop&&!e.target.closest('#pop')&&!(a&&['boards','bmenu','lmenu'].includes(a.dataset.a))){V.pop=null;render();if(!a)return}
  if(!a){const card=e.target.closest('.card[data-id]');if(card){V.card=card.dataset.id;V.comp=null;render()}
    if(V.editList&&!e.target.closest('.lhead')){saveListName();}
    return}
  const k=a.dataset.a,id=a.dataset.id,v=a.dataset.v;
  const c=V.card?D.cards[V.card]:null;
  switch(k){
    case 'lang':lang=v;try{localStorage.setItem('fb-lang',v)}catch(x){}render();break;
    case 'bname':V.editBoard=true;render();focusSel('#bname');break;
    case 'boards':V.pop=V.pop&&V.pop.kind==='boards'?null:{kind:'boards',anchor:'[data-a=boards]'};render();break;
    case 'bmenu':V.pop=V.pop&&V.pop.kind==='bmenu'?null:{kind:'bmenu',anchor:'[data-a=bmenu]'};render();break;
    case 'bgo':D.cur=id;V.pop=null;V.comp=null;save();render();break;
    case 'bnew':{const n=document.getElementById('newb').value.trim();if(!n)return;const b={id:uid('b'),name:n,bg:'charcoal',lists:[]};
      ['To do','In progress','Done'].forEach(ln=>{const l={id:uid('l'),name:ln,cards:[],col:false};D.lists[l.id]=l;b.lists.push(l.id)});
      D.boards[b.id]=b;D.order.push(b.id);D.cur=b.id;V.pop=null;save();render();break}
    case 'bgset':B().bg=v;save();render();break;
    case 'ask-no':ASK=null;render();break;
    case 'ask-yes':{const go=ASK&&ASK.go;ASK=null;if(go)go();render();break}
    case 'reset':ask(t('resetQ'),()=>{D=seed();V.card=null;save()});break;
    case 'bdel':ask(t('deleteBoardQ'),()=>{const b=B();b.lists.forEach(lid=>{D.lists[lid].cards.forEach(cid=>delete D.cards[cid]);delete D.lists[lid]});delete D.boards[b.id];D.order=D.order.filter(x=>x!==b.id);D.cur=D.order[0];save()});break;
    case 'filter':V.filter=!V.filter;render();break;
    case 'fm':V.f.members=V.f.members.includes(v)?V.f.members.filter(x=>x!==v):V.f.members.concat(v);render();break;
    case 'fl':V.f.labels=V.f.labels.includes(v)?V.f.labels.filter(x=>x!==v):V.f.labels.concat(v);render();break;
    case 'fd':V.f.due=V.f.due===v?'':v;render();break;
    case 'fclear':V.f={q:'',members:[],labels:[],due:''};render();break;
    case 'addl':V.addList=true;render();focusSel('#newl');break;
    case 'addl-x':V.addList=false;render();break;
    case 'addl-go':addList();break;
    case 'addc':V.comp=id;V.pop=null;render();focusSel('#newc');scrollListEnd(id);break;
    case 'addc-x':V.comp=null;render();break;
    case 'addc-go':{const ta=document.getElementById('newc');addCard(id,ta.value);render();focusSel('#newc');scrollListEnd(id);break}
    case 'lname':V.editList=id;render();focusSel('#lname');break;
    case 'lcol':D.lists[id].col=!D.lists[id].col;V.pop=null;save();render();break;
    case 'lmenu':V.pop=V.pop&&V.pop.kind==='lmenu'&&V.pop.id===id?null:{kind:'lmenu',id,anchor:`.list[data-id="${id}"] [data-a=lmenu]`};render();break;
    case 'lsort':D.lists[id].cards.sort((x,y)=>(D.cards[x].due||9e15)-(D.cards[y].due||9e15));V.pop=null;save();render();break;
    case 'ldel':ask(t('delListQ'),()=>{D.lists[id].cards.forEach(cid=>delete D.cards[cid]);delete D.lists[id];B().lists=B().lists.filter(x=>x!==id);save()});break;
    case 'ov':if(e.target===a){commitModalFields();V.card=null;render()}break;
    case 'mclose':commitModalFields();V.card=null;render();break;
    case 'cm':commitModalFields();c.members=c.members.includes(v)?c.members.filter(x=>x!==v):c.members.concat(v);save();render();break;
    case 'cl':commitModalFields();c.labels=c.labels.includes(v)?c.labels.filter(x=>x!==v):c.labels.concat(v);save();render();break;
    case 'cdone':commitModalFields();c.done=!c.done;logTo(c,{k:c.done?'l_done':'l_undone'});save();render();break;
    case 'ck':commitModalFields();c.check[+a.dataset.i].d=a.checked;save();render();break;
    case 'ckdel':commitModalFields();c.check.splice(+a.dataset.i,1);save();render();break;
    case 'ckadd':addCheck();break;
    case 'cmt':{const tx=document.getElementById('cmt').value.trim();if(!tx)return;commitModalFields();logTo(c,{c:tx});save();render();break}
    case 'cdel':commitModalFields();ask(t('delQ'),()=>{const l=listOf(c.id);if(l)l.cards.splice(l.cards.indexOf(c.id),1);delete D.cards[c.id];V.card=null;save()});break;
  }
});
function focusSel(s){const el=document.querySelector(s);if(el){el.focus();if(el.select&&el.tagName==='INPUT')el.select()}}
function scrollListEnd(id){const el=document.querySelector(`.list[data-id="${id}"] .cards`);if(el)el.scrollTop=el.scrollHeight}
function addList(){const inp=document.getElementById('newl');const n=inp&&inp.value.trim();if(!n)return;const l={id:uid('l'),name:n,cards:[],col:false};D.lists[l.id]=l;B().lists.push(l.id);save();render();focusSel('#newl');const cv=document.querySelector('.canvas');cv.scrollLeft=lang==='ar'?-cv.scrollWidth:cv.scrollWidth}
function addCheck(){const inp=document.getElementById('ckin');const v=inp&&inp.value.trim();if(!v)return;commitModalFields();D.cards[V.card].check.push({t:v,d:false});save();render();focusSel('#ckin')}
function saveListName(){const inp=document.getElementById('lname');if(inp&&V.editList&&inp.value.trim())D.lists[V.editList].name=inp.value.trim();V.editList=null;save();render()}
function saveBoardName(){const inp=document.getElementById('bname');if(inp&&inp.value.trim())B().name=inp.value.trim();V.editBoard=false;save();render()}
document.addEventListener('keydown',e=>{
  const id=e.target.id;
  if(id==='newc'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const lid=V.comp;addCard(lid,e.target.value);render();focusSel('#newc');scrollListEnd(lid);return}
  if(id==='newl'&&e.key==='Enter'){e.preventDefault();addList();return}
  if(id==='newb'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-a=bnew]').click();return}
  if(id==='lname'&&e.key==='Enter'){e.preventDefault();saveListName();return}
  if(id==='bname'&&e.key==='Enter'){e.preventDefault();saveBoardName();return}
  if(id==='ckin'&&e.key==='Enter'){e.preventDefault();addCheck();return}
  if(id==='mt'&&e.key==='Enter'){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')){V.card=e.target.dataset.id;render();return}
  if(e.key==='Escape'){if(ASK){ASK=null;render()}else if(V.pop){V.pop=null;render()}else if(V.card){commitModalFields();V.card=null;render()}else if(V.comp){V.comp=null;render()}else if(V.addList){V.addList=false;render()}else if(V.editList){V.editList=null;render()}else if(V.editBoard){V.editBoard=false;render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.f.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='mt'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}});
document.addEventListener('change',e=>{const c=V.card&&D.cards[V.card];if(!c)return;
  if(e.target.id==='cdue'){commitModalFields();c.due=e.target.value?new Date(e.target.value+'T00:00:00').getTime():null;save();render()}
  if(e.target.id==='crep'){commitModalFields();c.repeat=e.target.value;save();render()}
  if(e.target.id==='cmove'){commitModalFields();const to=D.lists[e.target.value];moveCard(c.id,to.id,to.cards.length);render()}
  if(e.target.id==='mt'||e.target.id==='cdesc'){commitModalFields()}});
document.addEventListener('focusout',e=>{
  if(e.target.id==='lname')setTimeout(()=>{if(V.editList&&document.activeElement.id!=='lname')saveListName()},0);
  if(e.target.id==='bname')setTimeout(()=>{if(V.editBoard)saveBoardName()},0)});

/* ---------- drag and drop (mouse: move a little; touch: press and hold) ---------- */
const DR={d:null,justDropped:false,timer:null,auto:null,x:0,y:0};
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||V.card)return;
  if(e.target.closest('input,textarea,button,select'))return;
  const card=e.target.closest('.card[data-id]'),head=e.target.closest('.lhead'),col=e.target.closest('.list.col');
  let type,el;if(card){type='card';el=card}else if(head||col){type='list';el=(head||col).closest('.list')}else return;
  DR.d={type,id:el.dataset.id,el,sx:e.clientX,sy:e.clientY,started:false,touch:e.pointerType!=='mouse'};DR.x=e.clientX;DR.y=e.clientY;
  if(DR.d.touch)DR.timer=setTimeout(()=>{if(DR.d&&!DR.d.started)start()},300);
});
document.addEventListener('pointermove',e=>{const d=DR.d;if(!d)return;DR.x=e.clientX;DR.y=e.clientY;
  if(!d.started){const m=Math.hypot(e.clientX-d.sx,e.clientY-d.sy);if(d.touch){if(m>10){clearTimeout(DR.timer);DR.d=null}return}if(m<6)return;start()}
  over()});
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',()=>{if(DR.d&&DR.d.started)end();else{clearTimeout(DR.timer);DR.d=null}});
document.addEventListener('touchmove',e=>{if(DR.d&&DR.d.started)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(DR.d)e.preventDefault()});
function start(){const d=DR.d;d.started=true;const r=d.el.getBoundingClientRect();d.ox=d.sx-r.left;d.oy=d.sy-r.top;
  const g=d.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);d.g=g;
  const ph=document.createElement('div');ph.className=d.type==='card'?'ph':'lph';ph.style.height=(d.type==='card'?r.height:Math.min(r.height,300))+'px';d.el.after(ph);d.ph=ph;d.el.style.display='none';
  document.body.classList.add('dragging');if(navigator.vibrate&&d.touch)try{navigator.vibrate(15)}catch(x){}
  DR.auto=setInterval(autoScroll,16);over()}
function over(){const d=DR.d;if(!d||!d.started)return;const x=DR.x,y=DR.y;d.g.style.left=(x-d.ox)+'px';d.g.style.top=(y-d.oy)+'px';
  const cv=document.getElementById('canvas');
  if(d.type==='card'){
    let L=null;document.querySelectorAll('.canvas .list:not(.col)').forEach(l=>{const r=l.getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6)L=l});
    if(!L)return;const box=L.querySelector('.cards');const cs=[...box.querySelectorAll('.card[data-id]')].filter(c=>c!==d.el);
    const before=cs.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
    if(before){if(d.ph.nextSibling!==before)box.insertBefore(d.ph,before)}else{const comp=box.querySelector('.comp,.empty');comp?box.insertBefore(d.ph,comp):box.appendChild(d.ph)}
  }else{
    const ls=[...cv.querySelectorAll(':scope > .list')].filter(l=>l!==d.el);const rtl=lang==='ar';
    const before=ls.find(l=>{const r=l.getBoundingClientRect(),mid=r.left+r.width/2;return rtl?x>mid:x<mid});
    if(before){if(d.ph.nextSibling!==before)cv.insertBefore(d.ph,before)}else{const add=cv.querySelector('.addl');cv.insertBefore(d.ph,add)}
  }}
function autoScroll(){const d=DR.d;if(!d||!d.started)return;const cv=document.getElementById('canvas');if(!cv)return;const r=cv.getBoundingClientRect(),e=70;
  if(DR.x<r.left+e)cv.scrollLeft-=14;else if(DR.x>r.right-e)cv.scrollLeft+=14;
  if(d.type==='card'){const box=d.ph&&d.ph.closest('.cards');if(box){const b=box.getBoundingClientRect();if(DR.y<b.top+40)box.scrollTop-=10;else if(DR.y>b.bottom-40)box.scrollTop+=10}}
  over()}
function end(){clearTimeout(DR.timer);const d=DR.d;DR.d=null;if(!d||!d.started)return;clearInterval(DR.auto);document.body.classList.remove('dragging');
  if(d.type==='card'){const L=d.ph.closest('.list');if(L){const idsInDom=[...L.querySelectorAll('.cards > .card[data-id], .cards > .ph')].filter(x=>x!==d.el);const vis=idsInDom.indexOf(d.ph);
      // position among visible cards -> position in the full list (filtered cards keep their place)
      const list=D.lists[L.dataset.id],visIds=idsInDom.filter(x=>x!==d.ph).map(x=>x.dataset.id);const after=visIds[vis-1];
      const full=list.cards.filter(cid=>cid!==d.id);const idx=after?full.indexOf(after)+1:(visIds[0]?full.indexOf(visIds[0]):full.length);
      moveCard(d.id,list.id,idx<0?full.length:idx)}}
  else{const cv=document.getElementById('canvas');const order=[...cv.querySelectorAll(':scope > .list, :scope > .lph')].filter(x=>x!==d.el).map(x=>x===d.ph?d.id:x.dataset.id);B().lists=order;save()}
  d.g.remove();DR.justDropped=true;setTimeout(()=>{DR.justDropped=false},50);render()}

render();
</script>
</body>
</html>
