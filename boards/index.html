<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Forka Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#23211f;--charcoal-2:#171513;--paper:#f6f3ee;--bronze:#9a6b3f;--bronze-l:#b8875a;--bronze-soft:#e9dccb;
  --ok:#4f7a3a;--warn:#e0a23a;--bad:#b8432f;
  --sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;--serif:'EB Garamond',Georgia,serif;
}
/* Dark theme (charcoal). Light theme (paper) below. Colours that sit on the board background use --on. */
.board{--list:#1c1a18;--card:#2c2926;--card-h:#363230;--line:#3b3631;--text:#f3eee6;--muted:#a9a196;--on:#f3eee6;
  --hover:rgba(255,255,255,.14);--soft:rgba(255,255,255,.07);--pill:rgba(255,255,255,.14);--barbg:rgba(0,0,0,.28);--notebg:rgba(0,0,0,.35);--notefg:#e9dccb;
  --field:#1c1a18;--pop:#26231f;--modal:#24211e;--scheme:dark;--shadow:rgba(0,0,0,.45);--dan:#e08b7d;--danline:#6b3a31;--danbg:#3a201b}
.board.light{--list:#ebe5db;--card:#fffdf9;--card-h:#ffffff;--line:#ddd5c8;--text:#23211f;--muted:#6b655c;--on:#23211f;
  --hover:rgba(35,33,31,.08);--soft:rgba(35,33,31,.05);--pill:rgba(35,33,31,.07);--barbg:rgba(255,253,249,.7);--notebg:rgba(154,107,63,.12);--notefg:#6b4a2a;
  --field:#ffffff;--pop:#fffdf9;--modal:#fbf8f3;--scheme:light;--shadow:rgba(35,33,31,.14);--dan:#a33a2c;--danline:#e3b8b0;--danbg:#f8e9e5}
.board.light .card{box-shadow:0 1px 2px var(--shadow)}
.board.light .list{box-shadow:none}
.board{color:var(--text)}
html[dir=rtl]{--sans:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--charcoal-2);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;flex-direction:column;height:100%}

/* top bar */
.top{color:#f3eee6;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--charcoal-2);border-bottom:1px solid #2c2925}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--serif);font-weight:600;letter-spacing:.32em;font-size:19px}
.brand span{color:var(--bronze-l);font-size:14px;font-weight:600}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid #3a3631;background:#22201d;padding:0 12px 0 34px;outline:none}
html[dir=rtl] .search input{padding:0 34px 0 12px}
.search input:focus{border-color:var(--bronze-l)}
.search svg{position:absolute;top:9px;inset-inline-start:11px;color:var(--muted)}
.seg{display:flex;background:#2a2724;border-radius:999px;padding:3px}
.seg button{padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--bronze);color:#fff}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* board bar */
.bbar{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--on);background:var(--barbg);backdrop-filter:blur(6px)}
.bname{font-family:var(--serif);font-size:22px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.bname:hover{background:var(--hover)}
.bname-in{font-family:var(--serif);font-size:22px;font-weight:600;background:#fff;color:var(--charcoal);border:0;border-radius:6px;padding:2px 8px;outline:2px solid var(--bronze-l)}
.ib{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.ib:hover,.ib.on{background:var(--hover)}
.sp{flex:1}
.members{display:flex}
.members .av{border:2px solid rgba(0,0,0,.35);margin-inline-start:-6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;background:var(--pill);font-size:14px;font-weight:600}
.pill:hover{background:var(--hover)}
.pill.on{background:var(--charcoal);color:#fff}.board:not(.light) .pill.on{background:var(--paper);color:var(--charcoal)}
.note{margin:0 16px;padding:6px 12px;border-radius:8px;background:var(--notebg);color:var(--notefg);font-size:12.5px;display:inline-block}

/* filter */
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;color:var(--on);background:var(--barbg);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--pill);font-weight:500}
.chip.on{background:var(--charcoal);color:#fff}.board:not(.light) .chip.on{background:var(--paper);color:var(--charcoal)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* canvas + lists */
.canvas{flex:1;display:flex;align-items:flex-start;gap:12px;padding:12px 16px 24px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}
.canvas::-webkit-scrollbar{height:12px}.canvas::-webkit-scrollbar-thumb{background:var(--hover);border-radius:8px}
.list{width:276px;flex:none;max-height:100%;display:flex;flex-direction:column;background:var(--list);border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.4);scroll-snap-align:start}
.lhead{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 14px;cursor:grab;user-select:none;-webkit-user-select:none}
html[dir=rtl] .lhead{padding:10px 14px 6px 8px}
.ltitle{flex:1;text-align:start;font-weight:700;font-size:14.5px;padding:4px 2px;border-radius:5px;overflow-wrap:anywhere}
.lin{flex:1;font-weight:700;font-size:14.5px;background:#fff;color:var(--charcoal);border:0;border-radius:5px;padding:4px 6px;outline:2px solid var(--bronze-l)}
.lcount{color:var(--muted);font-size:13px;padding:0 4px}
.lhead .ib{width:28px;height:28px;color:var(--muted)}
.lhead .ib:hover{color:var(--text)}
.cards{padding:2px 8px;overflow-y:auto;min-height:6px;display:flex;flex-direction:column;gap:8px}
.cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.card{background:var(--card);border-radius:10px;padding:9px 12px;box-shadow:0 1px 0 var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:1px solid transparent}
.card:hover{background:var(--card-h);outline-color:var(--line)}
.card .lbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.card .lbs span{height:8px;width:40px;border-radius:4px}
.card .ct{font-size:14.5px;line-height:1.38;overflow-wrap:anywhere}
.card.done .ct{color:var(--muted)}
.card .bd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:7px;color:var(--muted);font-size:12.5px}
.card .bd span{display:inline-flex;align-items:center;gap:4px}
.card .bd svg{width:14px;height:14px}
.due{padding:2px 6px;border-radius:5px}
.due.over{background:var(--bad);color:#fff}.due.soon{background:var(--warn);color:#241703}.due.ok{background:var(--ok);color:#fff}
.ckc.full{background:var(--ok);color:#fff;padding:2px 6px;border-radius:5px}
.card .who{margin-inline-start:auto;display:flex;gap:3px}
.card .who .av{width:24px;height:24px;font-size:10px}
.lfoot{padding:6px 8px 8px}
.addc{width:100%;display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;text-align:start}
.addc:hover{background:var(--hover);color:var(--text)}
.comp textarea,.comp input{width:100%;resize:none;border:0;border-radius:10px;background:var(--card);padding:9px 12px;outline:2px solid var(--bronze-l);font-size:14.5px;min-height:62px}
.comp input{min-height:auto;height:36px}
.row{display:flex;align-items:center;gap:6px;margin-top:8px}
.btn{height:34px;padding:0 14px;border-radius:7px;background:var(--bronze);color:#fff;font-weight:600;font-size:14px}
.btn:hover{background:#86592f}
.btn.sec{background:var(--pill);color:var(--text)}
.btn.sec:hover{background:var(--hover)}
.btn.dan{background:transparent;color:var(--dan);border:1px solid var(--danline)}
.btn.dan:hover{background:var(--danbg)}
.addl{width:276px;flex:none;border-radius:14px;background:var(--pill);color:var(--on);padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px;text-align:start}
.addl:hover{background:var(--hover)}
.addl.open{background:var(--list);color:var(--text);display:block}
.list.col{width:46px;cursor:grab}
.list.col .lhead{flex-direction:column;padding:10px 0;gap:10px;height:100%}
.list.col .ltitle{writing-mode:vertical-rl;flex:none}
html[dir=ltr] .list.col .ltitle{transform:rotate(180deg)}
.empty{color:var(--muted);font-size:13px;padding:6px 6px 2px}

/* drag */
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(3deg);box-shadow:0 12px 28px rgba(0,0,0,.5);opacity:.96}
.ph{border-radius:10px;background:var(--soft);outline:2px dashed var(--line)}
.lph{width:276px;flex:none;border-radius:14px;background:var(--soft);outline:2px dashed var(--line)}
body.dragging,body.dragging *{cursor:grabbing!important}

/* menus */
.pop{position:fixed;z-index:40;width:270px;background:var(--pop);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 32px rgba(0,0,0,.35);padding:8px}
.pop h4{margin:4px 6px 8px;font-size:13px;color:var(--muted);font-weight:600;text-align:center}
.pop .mi{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:14px;text-align:start}
.pop .mi:hover{background:var(--hover)}
.pop .mi.cur{color:var(--bronze-l);font-weight:600}
.pop .mi.dan{color:var(--dan)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px}
.sw button{height:44px;border-radius:8px;outline:2px solid transparent}
.sw button.on{outline-color:var(--bronze)}

/* card details */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:48px 14px}
.md{width:100%;max-width:860px;background:var(--modal);color:var(--text);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);position:relative}
.mhead{display:flex;gap:10px;align-items:flex-start;padding:22px 22px 8px}
.mt{flex:1;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.25;background:transparent;border:0;outline:none;resize:none;padding:2px 6px;border-radius:6px;width:100%;overflow:hidden}
.mt:focus{background:#fff;color:var(--charcoal)}
.msub{padding:0 28px 6px;color:var(--muted);font-size:13.5px}
.msub b{color:var(--text);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.mbody{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:22px;padding:10px 28px 26px}
.mbody>div{min-width:0}
div.sec{margin-top:18px}
div.sec:first-child{margin-top:4px}
.sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.sh .sp{flex:1}
.kv{display:flex;flex-wrap:wrap;gap:16px}
.kv>div>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{height:30px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;opacity:.38;display:inline-flex;align-items:center;gap:5px}
.lchip.on{opacity:1}
.lchip svg{width:13px;height:13px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 3px;border-radius:999px;background:var(--soft);font-size:13px;opacity:.55}
html[dir=rtl] .pchip{padding:0 3px 0 10px}
.pchip.on{opacity:1;background:var(--pill)}
.fld{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--field);padding:0 10px;outline:none;color-scheme:var(--scheme)}
.fld:focus{border-color:var(--bronze-l)}
.donebx{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:7px;background:var(--pill);font-size:14px;font-weight:600}
.donebx.on{background:var(--ok);color:#fff}
.desc{width:100%;min-height:96px;border-radius:9px;border:1px solid var(--line);background:var(--field);padding:10px 12px;outline:none;resize:vertical;line-height:1.45}
.desc:focus{border-color:var(--bronze-l)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze-l);border-radius:5px}
.bar i.full{background:var(--ok)}
.cki{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:7px}
.cki:hover{background:var(--soft)}
.cki input{width:17px;height:17px;accent-color:var(--bronze)}
.cki span{flex:1;font-size:14px}
.cki.done span{text-decoration:line-through;color:var(--muted)}
.cki .ib{width:26px;height:26px;opacity:0}
.cki:hover .ib{opacity:1}
.act{display:flex;gap:10px;margin-top:12px}
.act .tx{flex:1;font-size:14px}
.act .tx b{font-weight:600}
.act .tm{color:var(--muted);font-size:12px;margin-top:2px}
.act .bub{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-top:4px;white-space:pre-wrap;line-height:1.4}
.side .sl{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.side .sl:first-child{margin-top:4px}
.side .btn{width:100%;margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:flex-start}
.side select{width:100%}
.x{position:absolute;top:14px;inset-inline-end:14px}

@media (max-width:760px){
  .mbody{grid-template-columns:minmax(0,1fr);padding:10px 16px 26px}
  .mbody>div,.kv>div{min-width:0;max-width:100%}
  .brand span{display:none}
  .search{max-width:none}
  .bname{font-size:19px;max-width:52vw}
  .list,.addl,.lph{width:84vw}
  .ov{padding:0}
  .md{border-radius:0;min-height:100%}
  .hide-sm{display:none}
}
/* ---- departments, sidebar, pages ---- */
.board{--sidebg:#1a1816;--pagebg:#201e1c}
.board.light{--sidebg:#fbf8f3;--pagebg:#f6f3ee}
.shell{flex:1;display:flex;min-height:0}
.side{width:240px;flex:none;background:var(--sidebg);border-inline-end:1px solid var(--line);padding:12px 10px 30px;overflow-y:auto;color:var(--text)}
.side .nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;text-align:start;color:var(--text)}
.side .nav:hover{background:var(--hover)}
.side .nav.on{background:var(--pill);font-weight:700}
.side .nav .n{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}
.side .nav .n.bad{color:var(--bad)}
.side .dot{width:10px;height:10px;border-radius:3px;flex:none}
.side h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 10px 6px;font-weight:600}
html[dir=rtl] .side h5{letter-spacing:0}
.side .sub{padding-inline-start:30px;font-size:13.5px;font-weight:400}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.page{flex:1;overflow:auto;padding:24px 28px 48px;background:var(--pagebg);color:var(--text)}
.page h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 4px}
.page .lead{color:var(--muted);margin:0 0 20px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.kpi.bad b{color:var(--bad)}
.tw{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.tbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl .num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .bad{color:var(--bad);font-weight:700}
.tbl .sm{color:var(--muted);font-size:12.5px}
.pbar{display:flex;align-items:center;gap:8px;min-width:130px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar .bar{height:7px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.st.on{background:#e3eedb;color:#35571f}.st.risk{background:#fbefd6;color:#7a4f06}.st.off{background:#f8e1dc;color:#8a2c1e}.st.none{background:var(--soft);color:var(--muted)}
.board:not(.light) .st.on{background:#2b3a24;color:#b9d9a3}.board:not(.light) .st.risk{background:#3d2f12;color:#f0c674}.board:not(.light) .st.off{background:#40211b;color:#f0a597}
button.st{cursor:pointer}
.h2{font-size:17px;font-weight:700;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:10px;min-height:160px;color:var(--text);position:relative;overflow:hidden}
.tile:hover{border-color:var(--bronze-l)}
.tile .band{position:absolute;inset:0 0 auto 0;height:6px}
.tile h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:4px 0 0;line-height:1.2}
.tile .meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px}
.tile .meta .bad{color:var(--bad);font-weight:700}
.tile .foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.tile .who{display:flex;margin-inline-start:auto}
.tile .who .av{width:24px;height:24px;font-size:10px;border:2px solid var(--card);margin-inline-start:-6px}
.tile.new{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-weight:600;gap:6px}
.mine-g{margin:22px 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.mine-g .c{color:var(--muted);font-weight:600}
.mine-g.bad{color:var(--bad)}
.empty-p{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center}
.viewas{height:30px;border-radius:7px;border:1px solid #3a3631;background:#22201d;color:#f3eee6;padding:0 8px;font-size:13px;max-width:210px}
.crumb{color:var(--on);opacity:.8;font-size:13.5px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap}
.crumb:hover{background:var(--hover);opacity:1}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:7px;text-align:start;font-size:14px}
.mrow:hover{background:var(--hover)}
.mrow .r{color:var(--muted);font-size:12px}
.mrow .tk{margin-inline-start:auto;color:var(--bronze);width:18px}

  return `<tr class="click" data-a="open" data-id="${x.c.id}"><td><b dir="auto">${!x.s&&x.c.type==='milestone'?`<span class="msd">${ic('diamond')}</span> `:''}${esc(x.title)}</b>${x.s?`<div class="sm subof" dir="auto">${ic('subs')}${esc(t('subOf',{x:x.c.title}))}</div>`:''}
    ${!x.s&&x.c.labels.length?`<div style="display:flex;gap:4px;margin-top:5px">${x.c.labels.map(l=>`<span style="height:6px;width:28px;border-radius:3px;background:${(label(l,x.b)||{}).color||'#999'}"></span>`).join('')}</div>`:''}${!x.s&&x.c.type==='approval'?`<div style="margin-top:5px">${apChip(x.c)}</div>`:''}</td>
    <td class="sm">${esc(bname(x.b))}<div>${esc(deptName(x.b.dept))} · ${esc(LN(listOf(x.c.id)))}</div></td>
    <td class="num">${x.due?`<span class="due ${itCls(x)}" style="display:inline-flex;gap:4px;align-items:center">${ic('clock')}${itDate(x)}</span>`:''}</td>
    ${secs?`<td class="msc"><select class="fld msec" data-k="${x.k}" aria-label="${t('moveSec')}">${M.secs.map(s=>`<option value="${s.id}" ${(cur||M.secs[0].id)===s.id?'selected':''}>${esc(secName(s))}</option>`).join('')}</select></td>`:''}</tr>`}
function mineHTML(){const tab=V.mtab||'list',grp=V.mgrp||'sec',items=myItems(),M=myState();
  const secOf=x=>M.secs.some(y=>y.id===M.at[x.k])?M.at[x.k]:M.secs[0].id;
  const tabs=`<div class="tabs">${[['list','myList','list'],['board','myBoard','board'],['cal','myCal','cal'],['files','myFiles','clip']].map(([k,l,i])=>`<button class="tab ${tab===k?'on':''}" data-a="mtab" data-v="${k}">${ic(i)} ${t(l)}</button>`).join('')}</div>`;
  let body='';
  if(tab==='list'){
    const reqs=allCards().filter(({c})=>c.requester===ME()&&(!c.done||(c.doneAt||0)>Date.now()-14*day));
    let main='';
    if(!items.length)main=`<div class="empty-p">${t('nothingMine')}</div>`;
    else if(grp==='due'){const t0=today(),G={over:[],today:[],week:[],later:[],none:[]};
      items.forEach(x=>{const d=x.due;G[!d?'none':d<t0?'over':d<t0+day?'today':d<t0+7*day?'week':'later'].push(x)});
      main=['over','today','week','later','none'].map(k=>G[k].length?`<div class="mine-g ${k==='over'?'bad':''}">${t('g_'+k)} <span class="c">${G[k].length}</span></div><div class="tw"><table class="tbl mtbl">${G[k].map(x=>myRow(x,false)).join('')}</table></div>`:'').join('')}
    else main=M.secs.map((s,i)=>{const its=items.filter(x=>secOf(x)===s.id);
      return `<div class="mine-g sech" data-sec="${s.id}">${V.secEdit===s.id?`<input class="fld" id="secname" dir="auto" maxlength="40" value="${esc(secName(s))}" data-v="${s.id}">`:`<span dir="auto">${esc(secName(s))}</span>`} <span class="c">${its.length}</span>
        <span class="sp"></span><button class="lk2" data-a="secren" data-v="${s.id}">${t('renameSec')}</button>${i?`<button class="lk2" data-a="secdel" data-v="${s.id}">${t('delSec')}</button>`:''}</div>
        ${its.length?`<div class="tw"><table class="tbl mtbl">${its.map(x=>myRow(x,true)).join('')}</table></div>`:''}`}).join('')+
      `<div class="row secadd"><input class="fld" id="secnew" dir="auto" maxlength="40" placeholder="${t('secPh')}"><button class="btn sec" data-a="secadd">${ic('plus')}${t('addSec')}</button></div>`;
    body=`<div class="row" style="margin:0 0 6px;align-items:center;gap:8px"><span class="sm" style="color:var(--muted);font-size:13px">${t('groupBy')}</span><div class="vseg"><button data-a="mgrp" data-v="sec" class="${grp==='sec'?'on':''}">${t('gSec')}</button><button data-a="mgrp" data-v="due" class="${grp==='due'?'on':''}">${t('gDue')}</button></div></div>`+main+
    (reqs.length?`<div class="mine-g">${ic('inbox')}${t('requested')} <span class="c">${reqs.length}</span></div><div class="tw"><table class="tbl" id="myreqs">${reqs.map(({c,b})=>`<tr class="click" data-a="open" data-id="${c.id}">
      <td><b dir="auto">${esc(c.title)}</b><div class="sm">${esc(deptName(b.dept))}</div></td>
      <td>${c.done?`<span class="st on"><i></i>${t('doneTag')}</span>`:`<span class="st none">${esc(LN(listOf(c.id)))}</span>`}</td>
      <td class="sm">${c.members.length?c.members.map(m=>esc(pname(m))).join(', '):''}</td>
      <td class="num">${c.due?`<span class="due ${dueCls(c)}" style="display:inline-flex;gap:4px;align-items:center">${ic('clock')}${fmtDay(c.due)}</span>`:''}</td></tr>`).join('')}</table></div>`:'')}
  else if(tab==='board'){
    body=`<div class="mboard"><div class="canvas" id="canvas">${M.secs.map(s=>{const its=items.filter(x=>secOf(x)===s.id);
      return `<div class="list" data-id="${s.id}"><div class="lhead nodrag"><div class="ltitle" dir="auto">${esc(secName(s))}</div><span class="lcount">${its.length}</span></div>
        <div class="cards">${its.map(x=>`<div class="card ${!x.s&&x.c.type==='milestone'?'ms':''}" data-id="${x.k}" data-card="${x.c.id}" tabindex="0"><div class="ct" dir="auto">${!x.s&&x.c.type==='milestone'?`<span class="msd">${ic('diamond')}</span> `:''}${esc(x.title)}</div>
          ${x.s?`<div class="subof" dir="auto">${ic('subs')}${esc(x.c.title)}</div>`:''}<div class="bd">${x.due?`<span class="due ${itCls(x)}">${ic('clock')}${itDate(x)}</span>`:''}<span>${esc(bname(x.b))}</span></div></div>`).join('')||`<div class="empty">${t('emptySec')}</div>`}</div><div style="height:10px"></div></div>`}).join('')}</div></div>`}
  else if(tab==='cal')body=calHTML(items.map(x=>({id:x.c.id,title:x.title,due:x.due,cls:itCls(x),ms:!x.s&&x.c.type==='milestone'})));
  else{const fl=allCards().filter(({c})=>c.members.includes(ME())||(c.follow||[]).includes(ME())||c.requester===ME()).flatMap(({c,b})=>(c.atts||[]).map(a=>({a,c,b}))).sort((x,y)=>y.a.at-x.a.at);
    body=fl.length?`<div class="tw"><table class="tbl" id="myfiles"><tr><th>${t('t_file')}</th><th>${t('t_task')}</th><th></th></tr>${fl.map(({a,c,b})=>`<tr class="click" data-a="open" data-id="${c.id}">
      <td><div class="att" style="border:0;padding:0;background:none">${/^image\//.test(a.type)?`<img class="th" data-att="${a.id}" alt="">`:`<span class="th">${esc((a.name.split('.').pop()||'').toUpperCase().slice(0,4))}</span>`}<div class="nm" dir="auto">${esc(a.name)}<small>${Math.max(1,Math.round(a.size/1024))} KB · ${esc(pname(a.by))} · ${ago(a.at)}</small></div></div></td>
      <td class="sm"><b dir="auto" style="color:var(--text)">${esc(c.title)}</b><div>${esc(bname(b))}</div></td><td style="text-align:end"><button class="btn sec" data-a="attopen" data-v="${a.id}">${t('openF')}</button></td></tr>`).join('')}</table></div>`:`<div class="empty-p">${t('noFiles')}</div>`}
  return `<div class="page"><h1>${t('mine')}</h1><p class="lead">${t('mineLead')}</p>${tabs}${body}</div>`}

/* Projects: every board you can see, with search, filters and sorting */
function lastMod(b){let m=(b.status&&b.status.at)||0;b.lists.forEach(l=>{const L=D.lists[l];if(L)L.cards.forEach(id=>{const c=D.cards[id];if(c)c.log.forEach(x=>{if(x.at>m)m=x.at})})});return m}
const bOwner=b=>b.owner||(headOfDept(b.dept)||{}).id;
function projectsHTML(){const P=V.pf=V.pf||{q:'',dept:'',owner:'',member:'',status:'',sort:'mod'};
  let bs=boards().map(b=>({b,s:stats(cardsOf(b)),m:lastMod(b),o:bOwner(b)}));
  const owners=[...new Set(bs.map(x=>x.o).filter(Boolean))],mem=[...new Set(bs.flatMap(x=>boardPeople(x.b)))];
  bs=bs.filter(({b,o})=>(!P.q||bname(b).toLowerCase().includes(P.q.toLowerCase()))&&(!P.dept||b.dept===P.dept)&&(!P.owner||o===P.owner)&&(!P.member||boardPeople(b).includes(P.member))&&(!P.status||(b.kind?'':((b.status&&b.status.s)||'none'))===P.status));
  const S={mod:(x,y)=>y.m-x.m,name:(x,y)=>bname(x.b).localeCompare(bname(y.b)),prog:(x,y)=>y.s.pct-x.s.pct,over:(x,y)=>y.s.over-x.s.over};bs.sort(S[P.sort]||S.mod);
  const sel=(id,all,opts,v)=>`<select class="fld" id="${id}" aria-label="${esc(all)}"><option value="">${esc(all)}</option>${opts.map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  return `<div class="page"><h1>${t('projectsNav')}</h1><p class="lead">${t('projLead')}</p>
    <div class="pfind">${ic('search')}<input id="pq" type="search" placeholder="${t('findProj')}" value="${esc(P.q)}" aria-label="${t('findProj')}"></div>
    <div class="pfil">${sel('pf-dept',t('anyDept'),depts().map(d=>[d.id,d[lang]]),P.dept)}${sel('pf-owner',t('anyOwner'),owners.map(o=>[o,pname(o)]),P.owner)}${sel('pf-member',t('anyMember'),mem.map(o=>[o,pname(o)]),P.member)}
      ${sel('pf-status',t('anyStatus'),['on','risk','off','none'].map(k=>[k,t('st_'+k)]),P.status)}
      <label class="sortl">${t('sortL')} <select class="fld" id="pf-sort">${['mod','name','prog','over'].map(k=>`<option value="${k}" ${P.sort===k?'selected':''}>${t({mod:'sortMod',name:'sortName',prog:'sortProg',over:'sortOver'}[k])}</option>`).join('')}</select></label></div>
    ${bs.length?`<div class="tw"><table class="tbl" id="projtbl"><tr><th>${t('t_board')}</th><th>${t('t_owner')}</th><th>${t('t_status')}</th><th>${t('t_prog')}</th><th class="num">${t('t_over')}</th><th>${t('t_members')}</th><th>${t('t_last')}</th></tr>
    ${bs.map(({b,s,m,o})=>`<tr class="click" data-a="board" data-id="${b.id}"><td><div style="display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;background:${dept(b.dept).dot}"></span><span><b dir="auto">${esc(bname(b))}</b><div class="sm">${esc(deptName(b.dept))}</div></span></div></td>
      <td class="sm">${o?esc(pname(o)):'-'}</td><td>${b.kind?'':stChip(b.status)}</td><td>${pbar(s.pct)}</td><td class="num ${s.over?'bad':''}">${s.over}</td><td><div style="display:flex">${boardPeople(b).slice(0,5).map(x=>av(x)).join('')}</div></td><td class="sm">${m?ago(m):'-'}</td></tr>`).join('')}</table></div>`:`<div class="empty-p">${t('noProj')}</div>`}</div>`}

/* ---------- Strategy: goals, portfolios, timeline, reporting, resourcing and performance ---------- */
const lead=()=>isCEO()||headAny(meP());
const scopeD=()=>isCEO()?DEPTS.map(d=>d.id):dlist(meP()).filter(d=>isHd(meP(),d));
const scopeBoards=()=>boards().filter(b=>scopeD().includes(b.dept));
const scopePeople=()=>PEOPLE.filter(p=>!p.ceo&&!p.invited&&dlist(p).some(d=>scopeD().includes(d)));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const mondayOf=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const legend=items=>`<div class="legend">${items.map(([cls,txt])=>`<span><i class="${cls}"></i>${txt}</span>`).join('')}</div>`;
/* Goals */
const goalsSeen=()=>(D.goals||[]).filter(g=>isCEO()||g.lvl==='company'||inD(meP(),g.lvl));
const canGoal=g=>isCEO()||(g.lvl!=='company'&&headOf(g.lvl));
function goalPct(g){const bs=(g.boards||[]).map(id=>D.boards[id]).filter(Boolean);if(!bs.length)return Math.max(0,Math.min(100,+g.pct||0));return stats(bs.flatMap(cardsOf)).pct}
function goalRow(g){const bs=(g.boards||[]).map(id=>D.boards[id]).filter(Boolean);
  return `<tr class="click" data-a="gopen" data-id="${g.id}"><td><b dir="auto">${esc(g.title)}</b>${g.status&&g.status.note?`<div class="sm" dir="auto">${esc(g.status.note)}</div>`:''}</td>
    <td>${stChip(g.status)}</td><td>${pbar(goalPct(g))}</td><td class="sm">${g.owner?`<div style="display:flex;align-items:center;gap:6px">${av(g.owner)}${esc(pname(g.owner))}</div>`:'-'}</td>
    <td class="sm">${g.due?fmtDay(g.due):'-'}</td><td class="sm">${bs.length?bs.map(b=>esc(bname(b))).join(', '):'-'}</td></tr>`}
function goalsHTML(){const G=goalsSeen(),groups=[['company',t('companyGoals')]].concat(DEPTS.filter(d=>G.some(g=>g.lvl===d.id)).map(d=>[d.id,d[lang]]));
  const can=isCEO()||headAny(meP());
  return `<div class="page"><div class="phead"><div><h1>${t('goals')}</h1><p class="lead">${t('goalsLead')}</p></div>${can?`<button class="btn" data-a="gnew">${ic('plus')}${t('newGoal')}</button>`:''}</div>
    ${G.length?groups.map(([k,n])=>{const gs=G.filter(g=>g.lvl===k);return gs.length?`<div class="h2">${k==='company'?ic('target'):`<span class="dot" style="width:10px;height:10px;border-radius:3px;background:${dept(k).dot}"></span>`}${esc(n)}</div>
      <div class="tw"><table class="tbl goaltbl"><tr><th>${t('gTitle')}</th><th>${t('gStatus')}</th><th>${t('t_prog')}</th><th>${t('gOwner')}</th><th>${t('gDue')}</th><th>${t('gBoards').split(' (')[0]}</th></tr>${gs.map(goalRow).join('')}</table></div>`:''}).join(''):`<div class="empty-p">${t('noGoals')}</div>`}</div>`}
function goalFormHTML(){const f=V.gf,g=f.id&&(D.goals||[]).find(x=>x.id===f.id),ro=g&&!canGoal(g),miss=k=>f.bad.includes(k)?'miss':'';
  const lvls=(isCEO()?['company'].concat(DEPTS.map(d=>d.id)):scopeD());
  const bs=boards().filter(b=>f.lvl==='company'||b.dept===f.lvl);
  return `<div class="ov"><div class="md" role="dialog" aria-modal="true" aria-label="${t('editGoal')}" style="max-width:640px">
    <button class="ib x" data-a="gx" aria-label="${t('close')}">${ic('x')}</button>
    <div class="mhead">${ic('target')}<div class="mt" style="cursor:default">${f.id?t('editGoal'):t('newGoal')}</div></div>
    <div class="ntf"><fieldset class="ro" ${ro?'disabled':''}>
      ${ro?`<div class="reqnote">${t('gRo')}</div>`:''}${f.bad.length?`<div class="errbox">${t('need')}</div>`:''}
      <label class="fl" for="gf-title">${t('gTitle')} <b>*</b></label><input class="fld ${miss('title')}" id="gf-title" dir="auto" maxlength="160" style="width:100%" placeholder="${t('gTitlePh')}" value="${esc(f.title)}">
      <div class="g3">
        <div><label class="fl" for="gf-lvl">${t('gLevel')}</label><select class="fld" id="gf-lvl">${lvls.map(k=>`<option value="${k}" ${f.lvl===k?'selected':''}>${k==='company'?t('companyLvl'):esc(deptName(k))}</option>`).join('')}</select></div>
        <div><label class="fl" for="gf-owner">${t('gOwner')} <b>*</b></label><select class="fld ${miss('owner')}" id="gf-owner"><option value="">-</option>${PEOPLE.filter(p=>!p.invited&&(f.lvl==='company'||inD(p,f.lvl)||p.ceo)).map(p=>`<option value="${p.id}" ${f.owner===p.id?'selected':''}>${esc(pname(p.id))}</option>`).join('')}</select></div>
        <div><label class="fl" for="gf-due">${t('gDue')} <b>*</b></label><input class="fld ${miss('due')}" type="date" id="gf-due" value="${esc(f.due)}"></div>
      </div>
      <label class="fl">${t('gBoards')}</label><div class="lchips">${bs.map(b=>`<button class="pchip ${f.boards.includes(b.id)?'on':''}" style="padding:0 12px" data-a="gfb" data-v="${b.id}">${f.boards.includes(b.id)?ic('tick'):''}${esc(bname(b))}</button>`).join('')}</div>
      ${f.boards.length?'':`<label class="fl" for="gf-pct">${t('gPct')}</label><input class="fld" type="number" min="0" max="100" id="gf-pct" value="${esc(f.pct)}" style="width:120px">`}
      <div class="g3"><div><label class="fl" for="gf-s">${t('gStatus')}</label><select class="fld" id="gf-s">${['on','risk','off'].map(k=>`<option value="${k}" ${f.s===k?'selected':''}>${t('st_'+k)}</option>`).join('')}</select></div></div>
      <label class="fl" for="gf-note">${t('gNote')}</label><textarea class="desc" id="gf-note" dir="auto" style="min-height:60px" maxlength="240">${esc(f.note)}</textarea>
      <div class="row" style="justify-content:flex-end;margin-top:18px">${f.id&&!ro?`<button class="btn dan" data-a="gdel" style="margin-inline-end:auto">${t('delGoal')}</button>`:''}<button class="btn sec" data-a="gx">${t('cancel')}</button>${ro?'':`<button class="btn" data-a="gsave">${t('saveB')}</button>`}</div>
    </fieldset></div></div></div>`}
function gfSync(){const f=V.gf,g=id=>document.getElementById(id);if(!f||!g('gf-title'))return;f.title=g('gf-title').value;f.lvl=g('gf-lvl').value;f.owner=g('gf-owner').value;f.due=g('gf-due').value;f.s=g('gf-s').value;f.note=g('gf-note').value;if(g('gf-pct'))f.pct=g('gf-pct').value}
function gfOpen(id){const g=id&&(D.goals||[]).find(x=>x.id===id);
  V.gf=g?{id:g.id,title:g.title,lvl:g.lvl,owner:g.owner||'',due:g.due?ymd(g.due):'',boards:(g.boards||[]).slice(),pct:g.pct||'',s:(g.status&&g.status.s)||'on',note:(g.status&&g.status.note)||'',bad:[]}
    :{id:null,title:'',lvl:isCEO()?'company':scopeD()[0],owner:ME(),due:'',boards:[],pct:'',s:'on',note:'',bad:[]};render();focusSel('#gf-title')}
function gfSave(){gfSync();const f=V.gf,bad=[];if(!f.title.trim())bad.push('title');if(!f.owner)bad.push('owner');if(!f.due)bad.push('due');f.bad=bad;if(bad.length){render();return}
  D.goals=D.goals||[];let g=D.goals.find(x=>x.id===f.id);if(!g){g={id:uid('g')};D.goals.push(g)}
  const old=g.status||{};Object.assign(g,{title:f.title.trim(),lvl:f.lvl,owner:f.owner,due:new Date(f.due+'T00:00:00').getTime(),boards:f.boards.slice(),pct:+f.pct||0,
    status:{s:f.s,note:f.note.trim(),by:(old.s===f.s&&old.note===f.note.trim())?old.by||ME():ME(),at:(old.s===f.s&&old.note===f.note.trim())?old.at||Date.now():Date.now()}});
  V.gf=null;save();render()}
/* Portfolios */
const portsSeen=()=>(D.ports||[]).filter(x=>isCEO()||x.owner===ME());
const bDue=b=>b.due||Math.max(0,...cardsOf(b).map(c=>c.due||0))||null;
const bStart=b=>{const v=cardsOf(b).map(c=>c.start||c.due).filter(Boolean);return v.length?Math.min(...v):null};

        <div class="meta"><span>${t('projN',{n:bs.length})}</span></div>${pbar(stats(bs.flatMap(cardsOf)).pct)}<div class="foot"><span class="who">${av(x.owner)}</span></div></button>`}).join('')}
      <div class="tile comp" style="justify-content:center"><input id="newport" class="fld" dir="auto" maxlength="60" placeholder="${t('portPh')}"><div class="row"><button class="btn" data-a="pnew">${ic('plus')}${t('newPort')}</button></div></div></div>
    ${P.length?'':`<div class="empty-p" style="margin-top:14px">${t('noPorts')}</div>`}</div>`;
  const items=cur.items.filter(i=>D.boards[i.b]&&canSee(D.boards[i.b])),tab=V.ptab||'list';
  const add=boards().filter(b=>!cur.items.some(i=>i.b===b.id));
  return `<div class="page"><button class="crumb" data-a="go" data-v="ports" style="color:var(--muted);padding-inline-start:0">${ic(lang==='ar'?'right':'left')} ${t('ports')}</button>

function chSend(){const ta=document.getElementById('chin'),tx=ta&&ta.value.trim(),k=V.ch;if(!tx||!k)return;D.msgs=D.msgs||{};(D.msgs[k]=D.msgs[k]||[]).push({id:uid('m'),by:ME(),at:Date.now(),t:tx});
  if(D.msgs[k].length>400)D.msgs[k]=D.msgs[k].slice(-400);markSeen(k);

/* ---------- Live: Forka Apps sign-in and the Boards server (when BOARDS_URL is set in config.js) ----------
   Everything is kept on the server, one row per board, list, card, message, goal… Each change is sent within half a second;
   other people's changes arrive every 20 seconds. If the connection drops, changes wait and are sent again. */
const SV={tok:'',snap:{},docs:{},pend:{},since:0,t:null,busy:false,ready:false,people:[],me:{email:''}};
const DELETABLE=['board','list','card','goal','port','tpl','ctpl','space'];
const iniOf=n=>String(n||'').split(/[\s@._-]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
const HCOL=['#6f8a5a','#5b7896','#9a6b3f','#6d5f8f','#a8655a','#4f7f78','#5c6680','#a88a4a','#7a6a55'];
const hcol=s=>HCOL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%HCOL.length];
function api(action,p){return fetch(CFG.BOARDS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:SV.tok},p||{}))}).then(r=>r.json()).catch(()=>({ok:false,error:'net'}))}
function toDocs(){const out={},put=(id,kind,json)=>{out[id]={kind,json}},cl={},me=ME();
  Object.values(D.lists).forEach(l=>l.cards.forEach(c=>{cl[c]=l.id}));
  D.order.forEach((id,i)=>{const b=D.boards[id];if(b)put(id,'board',Object.assign({},b,{id,ord:i}))});
  Object.keys(D.lists).forEach(id=>put(id,'list',Object.assign({},D.lists[id],{id})));
  Object.keys(D.cards).forEach(id=>put(id,'card',Object.assign({},D.cards[id],{id,l:cl[id]||D.cards[id].l||null})));
  (D.goals||[]).forEach(g=>put('goal:'+g.id,'goal',g));(D.ports||[]).forEach(p=>put('port:'+p.id,'port',p));
  Object.keys(D.msgs||{}).forEach(k=>D.msgs[k].forEach(m=>put('msg:'+m.id,'msg',Object.assign({k},m))));
  (D.notes||[]).forEach(n=>put('note:'+n.id,'note',n));
  if(me)put('user:'+me,'user',{my:(D.my||{})[me]||null,seen:(D.seen||{})[me]||null,dark:!!(D.dark||{})[me],lblOff:!!(D.lblOff||{})[me],emailOff:!!(D.emailOff||{})[me]});
  Object.keys(D.prof||{}).forEach(e=>put('prof:'+e,'prof',D.prof[e]));Object.keys(D.cap||{}).forEach(e=>put('cap:'+e,'cap',{n:D.cap[e]}));
  PEOPLE.forEach(p=>{if(p.ceo)return;const id='member:'+p.id,j={depts:Object.assign({},pD(p))};if(p.inv)j.inv=p.inv;if(SV.snap[id]||Object.keys(j.depts).length||j.inv)put(id,'member',j)});
  (D.spaces||[]).forEach(x=>put('space:'+x.id,'space',x));
  (D.tpls||[]).forEach(x=>put('tpl:'+x.id,'tpl',x));(D.cardTpl||[]).forEach(x=>put('ctpl:'+x.id,'ctpl',x));
  return out}
function syncQueue(){if(!SV.ready)return;const cur=toDocs();
  Object.keys(cur).forEach(id=>{const s=JSON.stringify(cur[id].json);if(SV.snap[id]!==s){SV.pend[id]={id,kind:cur[id].kind,json:cur[id].json};SV.snap[id]=s;SV.docs[id]={kind:cur[id].kind,json:JSON.parse(s)}}});
  Object.keys(SV.snap).forEach(id=>{if(!cur[id]){const k=SV.docs[id]&&SV.docs[id].kind;if(DELETABLE.includes(k))SV.pend[id]={id,kind:k,del:true};delete SV.snap[id];delete SV.docs[id]}});
  if(Object.keys(SV.pend).length){setSync('saving');clearTimeout(SV.t);SV.t=setTimeout(flush,500)}}
async function flush(){if(SV.busy){clearTimeout(SV.t);SV.t=setTimeout(flush,700);return}
  const all=Object.values(SV.pend);if(!all.length){setSync('ok');return}
  const docs=all.slice(0,250);docs.forEach(d=>delete SV.pend[d.id]);SV.busy=true;
  const r=await api('save',{docs});SV.busy=false;
  if(!r.ok){docs.forEach(d=>{if(!SV.pend[d.id])SV.pend[d.id]=d});if(r.error==='session')return gate('signin');setSync('off');clearTimeout(SV.t);SV.t=setTimeout(flush,8000);return}
  if(r.rejected&&r.rejected.length){flash(t('notAllowed'));await pull(false)}
  if(Object.keys(SV.pend).length){clearTimeout(SV.t);SV.t=setTimeout(flush,300)}else setSync('ok')}
async function flushAll(){for(let i=0;i<20&&(Object.keys(SV.pend).length||SV.busy);i++){clearTimeout(SV.t);await flush();if(SV.busy)await new Promise(r=>setTimeout(r,300))}}
async function pull(delta){syncQueue();if(SV.pulling)return;SV.pulling=true;const r=await api('load',delta?{since:SV.since}:{});SV.pulling=false;
  if(!r.ok){if(r.error==='session')return gate('signin');setSync('off');return}
  if(!delta){Object.keys(SV.docs).forEach(id=>{if(!SV.pend[id]){delete SV.docs[id];delete SV.snap[id]}});SV.people=r.people||SV.people}
  if(r.me)SV.me=r.me;SV.since=r.now;let ch=!delta;
  r.docs.forEach(d=>{if(SV.pend[d.id])return;if(d.del){if(SV.docs[d.id]){delete SV.docs[d.id];delete SV.snap[d.id];ch=true}return}
    const s=JSON.stringify(d.json);if(SV.snap[d.id]===s)return;SV.docs[d.id]={kind:d.kind,json:d.json};SV.snap[d.id]=s;ch=true});
  if(ch){fromDocs();soft()}
  setSync(Object.keys(SV.pend).length?'saving':'ok')}
const mDepts=m=>m&&m.depts?Object.assign({},m.depts):m&&m.dept?{[m.dept]:m.role||'staff'}:{};
function fromDocs(){const me=SV.me.email,N={boards:{},lists:{},cards:{},order:[],me,dark:{},lblOff:{},emailOff:{},my:{},seen:{},goals:[],ports:[],msgs:{},notes:[],prof:{},cap:{},tpls:[],cardTpl:[]},bs=[],mem={};
  Object.keys(SV.docs).forEach(id=>{const d=SV.docs[id],j=JSON.parse(JSON.stringify(d.json));
    switch(d.kind){case 'board':N.boards[id]=j;bs.push(Object.assign({},j,{id}));break;case 'list':N.lists[id]=j;break;case 'card':N.cards[id]=j;break;
      case 'goal':N.goals.push(j);break;case 'port':N.ports.push(j);break;case 'msg':(N.msgs[j.k]=N.msgs[j.k]||[]).push(j);break;case 'note':N.notes.push(j);break;
      case 'user':if(id==='user:'+me){if(j.my)N.my[me]=j.my;if(j.seen)N.seen[me]=j.seen;N.dark[me]=!!j.dark;N.lblOff[me]=!!j.lblOff;N.emailOff[me]=!!j.emailOff}break;
      case 'prof':N.prof[id.slice(5)]=j;break;case 'cap':N.cap[id.slice(4)]=j.n;break;case 'member':mem[id.slice(7)]=j;break;case 'tpl':N.tpls.push(j);break;case 'ctpl':N.cardTpl.push(j);break;case 'space':(N.spaces=N.spaces||[]).push(j);break}});
  // a card belongs to the list it names, so two people moving cards at the same moment never lose one
  Object.keys(N.lists).forEach(id=>{const l=N.lists[id];l.cards=(l.cards||[]).filter(c=>N.cards[c]&&N.cards[c].l===id)});
  Object.keys(N.cards).forEach(id=>{const l=N.lists[N.cards[id].l];if(l&&!l.cards.includes(id))l.cards.push(id)});
  Object.values(N.msgs).forEach(a=>a.sort((x,y)=>x.at-y.at));N.notes.sort((x,y)=>x.at-y.at);
  N.order=bs.sort((a,b)=>(a.ord??1e9)-(b.ord??1e9)).map(b=>b.id);
  N.people=SV.people.map(p=>{const m=mem[p.email]||{},nm=p.name||p.email;return {id:p.email,en:nm,ar:nm,ini:iniOf(nm),color:p.ceo?'#c27a2c':dlist({depts:mDepts(m)}).length?dept(dlist({depts:mDepts(m)})[0]).dot:hcol(p.email),
    depts:p.ceo?{}:mDepts(m),email:p.email,ceo:!!p.ceo,invited:!!p.invited,title:p.title||''}});
  Object.keys(mem).forEach(e=>{if(mem[e].inv&&!N.people.some(p=>p.id===e)){const nm=mem[e].inv.name||e;N.people.push({id:e,en:nm,ar:nm,ini:iniOf(nm),color:hcol(e),depts:mDepts(mem[e]),email:e,invited:true,inv:mem[e].inv})}});
  D=N;PEOPLE=D.people;rebuildDepts()}

function soft(){const a=document.activeElement;if(DR.d||ASK||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!['q','pq','pq2'].includes(a.id))){V.stale=true;return}render()}
function setSync(s){SV.state=s;const el=document.getElementById('sync');if(el){el.className='sync '+s;el.textContent=s==='ok'?t('sSaved'):s==='saving'?t('sSaving'):t('sOff')}}

async function bootLive(){try{SV.tok=localStorage.getItem('fa-token')||''}catch(e){}
  if(!SV.tok)return gate('signin');gate('load');
  const r=await api('load');if(!r.ok)return gate(r.error==='session'?'signin':'net');
  SV.people=r.people||[];SV.me=r.me;SV.since=r.now;r.docs.forEach(d=>{SV.docs[d.id]={kind:d.kind,json:d.json};SV.snap[d.id]=JSON.stringify(d.json)});
  fromDocs();SV.ready=true;home();openHash();render();setSync('ok');
  setInterval(()=>{if(!document.hidden&&SV.ready)pull(true)},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SV.ready)pull(true)});
  window.addEventListener('beforeunload',e=>{if(Object.keys(SV.pend).length){flush();e.preventDefault();e.returnValue=''}})}

    if(sv&&dv&&sv>dv){V.dateErr={s:sv,d:dv};render();return}V.dateErr=false;c.start=tm(sv);c.due=tm(dv);save();render()}
  if(e.target.id==='cown'){commitModalFields();c.owner=e.target.value;save();render()}
  if(e.target.id==='ctype'){commitModalFields();if(e.target.value==='task')delete c.type;else c.type=e.target.value;save();render()}
  if(e.target.id==='fadd'&&e.target.value){commitModalFields();(c.follow=c.follow||[]).push(e.target.value);save();render()}
  if(e.target.classList&&e.target.classList.contains('cf')){commitModalFields();(c.f=c.f||{})[e.target.dataset.f]=e.target.value.trim();save();render()}
  if(e.target.classList&&e.target.classList.contains('subw')){commitModalFields();const sb=c.subs[+e.target.dataset.i];sb.who=e.target.value;if(sb.who)notify(sb.who,'subassign',c.id);save();render()}
  if(e.target.classList&&e.target.classList.contains('subd')){commitModalFields();c.subs[+e.target.dataset.i].due=e.target.value?new Date(e.target.value+'T00:00:00').getTime():null;save();render()}
  if(e.target.id==='crep'){commitModalFields();c.repeat=e.target.value;save();render()}
  if(e.target.id==='cpri'){commitModalFields();c.priority=e.target.value;save();render()}
  if(e.target.id==='cmove'){commitModalFields();const to=D.lists[e.target.value];moveCard(c.id,to.id,to.cards.length);render()}
  if(e.target.id==='mt'||e.target.id==='cdesc'){commitModalFields()}});
document.addEventListener('focusout',e=>{
  if(V.stale)setTimeout(()=>{const a=document.activeElement;if(V.stale&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){V.stale=false;render()}},50);
  if(e.target.id==='lname')setTimeout(()=>{if(V.editList&&document.activeElement.id!=='lname')saveListName()},0);
  if(e.target.id==='bname')setTimeout(()=>{if(V.editBoard)saveBoardName()},0);
  if(e.target.id==='secname')setTimeout(()=>{if(V.secEdit&&document.activeElement.id!=='secname')saveSec()},0)});

/* ---------- drag and drop (mouse: move a little; touch: press and hold). Lists move only for the department head. ---------- */
const DR={d:null,justDropped:false,timer:null,auto:null,x:0,y:0};
document.addEventListener('pointerdown',e=>{
  const myB=V.view==='mine'&&V.mtab==='board';
  if(e.button!==0||V.card||(V.view!=='board'&&!myB))return;
  if(e.target.closest('input,textarea,button,select'))return;
  const card=e.target.closest('.card[data-id]'),head=e.target.closest('.lhead'),col=e.target.closest('.list.col');
  let type,el;if(card){type='card';el=card}else if(!myB&&(head||col)&&canAdmin(B())){type='list';el=(head||col).closest('.list')}else return;
  DR.d={type,id:el.dataset.id,el,sx:e.clientX,sy:e.clientY,started:false,touch:e.pointerType!=='mouse'};DR.x=e.clientX;DR.y=e.clientY;
  if(DR.d.touch)DR.timer=setTimeout(()=>{if(DR.d&&!DR.d.started)start()},300);
});
document.addEventListener('pointermove',e=>{const d=DR.d;if(!d)return;DR.x=e.clientX;DR.y=e.clientY;
  if(!d.started){const m=Math.hypot(e.clientX-d.sx,e.clientY-d.sy);if(d.touch){if(m>10){clearTimeout(DR.timer);DR.d=null}return}if(m<6)return;start()}
  over()});
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',()=>{if(DR.d&&DR.d.started)end();else{clearTimeout(DR.timer);DR.d=null}});
document.addEventListener('touchmove',e=>{if(DR.d&&DR.d.started)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(DR.d)e.preventDefault()});
function start(){const d=DR.d;d.started=true;const r=d.el.getBoundingClientRect();d.ox=d.sx-r.left;d.oy=d.sy-r.top;
  const g=d.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);d.g=g;
  const ph=document.createElement('div');ph.className=d.type==='card'?'ph':'lph';ph.style.height=(d.type==='card'?r.height:Math.min(r.height,300))+'px';d.el.after(ph);d.ph=ph;d.el.style.display='none';
  document.body.classList.add('dragging');if(navigator.vibrate&&d.touch)try{navigator.vibrate(15)}catch(x){}
  DR.auto=setInterval(autoScroll,16);over()}
function over(){const d=DR.d;if(!d||!d.started)return;const x=DR.x,y=DR.y;d.g.style.left=(x-d.ox)+'px';d.g.style.top=(y-d.oy)+'px';
  const cv=document.getElementById('canvas');
  if(d.type==='card'){
    let L=null;document.querySelectorAll('.canvas .list:not(.col)').forEach(l=>{const r=l.getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6)L=l});
    if(!L)return;const box=L.querySelector('.cards');const cs=[...box.querySelectorAll('.card[data-id]')].filter(c=>c!==d.el);
    const before=cs.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
    if(before){if(d.ph.nextSibling!==before)box.insertBefore(d.ph,before)}else{const comp=box.querySelector('.comp,.empty');comp?box.insertBefore(d.ph,comp):box.appendChild(d.ph)}
  }else{
    const ls=[...cv.querySelectorAll(':scope > .list')].filter(l=>l!==d.el);const rtl=lang==='ar';
    const before=ls.find(l=>{const r=l.getBoundingClientRect(),mid=r.left+r.width/2;return rtl?x>mid:x<mid});
    if(before){if(d.ph.nextSibling!==before)cv.insertBefore(d.ph,before)}else{const add=cv.querySelector('.addl');add?cv.insertBefore(d.ph,add):cv.appendChild(d.ph)}
  }}
function autoScroll(){const d=DR.d;if(!d||!d.started)return;const cv=document.getElementById('canvas');if(!cv)return;const r=cv.getBoundingClientRect(),e=70;
  if(DR.x<r.left+e)cv.scrollLeft-=14;else if(DR.x>r.right-e)cv.scrollLeft+=14;
  if(d.type==='card'){const box=d.ph&&d.ph.closest('.cards');if(box){const b=box.getBoundingClientRect();if(DR.y<b.top+40)box.scrollTop-=10;else if(DR.y>b.bottom-40)box.scrollTop+=10}}
  over()}
function end(){clearTimeout(DR.timer);const d=DR.d;DR.d=null;if(!d||!d.started)return;clearInterval(DR.auto);document.body.classList.remove('dragging');
  if(d.type==='card'&&V.view==='mine'){const L=d.ph.closest('.list');if(L){myState().at[d.id]=L.dataset.id;save()}}
  else if(d.type==='card'){const L=d.ph.closest('.list');if(L){const idsInDom=[...L.querySelectorAll('.cards > .card[data-id], .cards > .ph')].filter(x=>x!==d.el);const vis=idsInDom.indexOf(d.ph);
      const list=D.lists[L.dataset.id],visIds=idsInDom.filter(x=>x!==d.ph).map(x=>x.dataset.id);const after=visIds[vis-1];
      const full=list.cards.filter(cid=>cid!==d.id);const idx=after?full.indexOf(after)+1:(visIds[0]?full.indexOf(visIds[0]):full.length);
      moveCard(d.id,list.id,idx<0?full.length:idx)}}
  else{const cv=document.getElementById('canvas');const order=[...cv.querySelectorAll(':scope > .list, :scope > .lph')].filter(x=>x!==d.el).map(x=>x===d.ph?d.id:x.dataset.id);B().lists=order;save()}
  d.g.remove();DR.justDropped=true;setTimeout(()=>{DR.justDropped=false},50);render()}

if(LIVE)bootLive();else render();
</script>
</body>
